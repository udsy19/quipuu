[[extract]]
id = "PY-082"
language = "python"
query = """
(call
  function: (identifier) @cls (#eq? @cls "MLDSAMuHasher"))
"""
captures = { cls = "ident" }
api = "cryptography.hazmat.mldsa.mu_hasher"
description = "pyca ML-DSA external-mu incremental hashing: MLDSAMuHasher(public_key) — FIPS 204's external-mu mode, computed from a key object whose parameter set this table cannot trace."

[[classify]]
id = "CRYPTO-1035"
when.api = "^cryptography\\.hazmat\\.mldsa\\.mu_hasher$"
algorithm_id = "ml-dsa-unattributed"
severity_hint = "auto"
message = "MLDSAMuHasher(public_key) — FIPS 204, quantum-resistant, but the parameter set is carried by the public_key argument's type and is not statically knowable at this call site."

# pyca/cryptography — HPKE (cryptography.hazmat.primitives.hpke), GA since
# 47.0.0. Suite(kem, kdf, aead) takes its KEM as a bare `KEM.<member>`
# attribute (`from cryptography.hazmat.primitives.hpke import Suite, KEM,
# KDF, AEAD` then `Suite(KEM.X25519, ...)`, per the library's own test
# suite) — same bare-identifier call shape #Y47 already established for
# this file, so only the kem argument is captured; kdf/aead don't affect
# the quantum-relevant classification. MLKEM768_X25519 is the X-Wing
# combiner (draft-connolly-cfrg-xwing-kem, HPKE KEM ID 0x647A — confirmed
# directly against pyca's own Rust backend source, hpke.rs). MLKEM1024_P384
# uses a related but textually distinct combiner (draft-ietf-hpke-pq, its
# own "MLKEM1024-P384" label, not X-Wing's) that this table has no
# dedicated row for, so it is attributed by its PQ component only —
# ml-kem-1024 — the same restraint #Y114's OpenMLS rule used for a
# composite id this table doesn't carry.

[[extract]]
id = "PY-083"
language = "python"
query = """
(call
  function: (identifier) @fn (#eq? @fn "Suite")
  arguments: (argument_list
    (attribute
      object: (identifier) @kem_mod (#eq? @kem_mod "KEM")
      attribute: (identifier) @kem)
    (_)
    (_)))
"""
