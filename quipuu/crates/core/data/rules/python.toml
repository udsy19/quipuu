    attribute: (identifier) @fn (#match? @fn "^(generate|from_seed_bytes|from_public_bytes)$")))
"""
captures = { cls = "ident", fn = "ident" }
api = "cryptography.hazmat.mldsa.{cls}.{fn}"
description = "pyca ML-DSA key generation/import: MLDSA65PrivateKey.generate(), .from_seed_bytes(), MLDSA65PublicKey.from_public_bytes()."

[[classify]]
id = "CRYPTO-823"
when.api = "^cryptography\\.hazmat\\.mldsa\\.ml_dsa_44$"
algorithm_id = "ml-dsa-44"
severity_hint = "auto"
message = "pyca ML-DSA-44 — FIPS 204, quantum-resistant. Migrated signature call site."

[[classify]]
id = "CRYPTO-824"
when.api = "^cryptography\\.hazmat\\.mldsa\\.ml_dsa_65$"
algorithm_id = "ml-dsa-65"
severity_hint = "auto"
