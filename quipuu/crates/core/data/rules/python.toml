# ============================================================================
# liboqs's official Python binding (`liboqs-python`, PyPI, PQCA-maintained) —
# oqs.KeyEncapsulation(alg) / oqs.Signature(alg) construct via the identical
# OQS_KEM_new / OQS_SIG_new C entry points cpp.toml already classifies. Both
# of the library's own published examples (examples/kem.py, examples/sig.py)
# pass a local variable rather than a literal, so each API needs both a
# literal-string arm set and a variable-symbol fallback (#Y74).
# ============================================================================

[[extract]]
id = "PY-090"
language = "python"
query = """
(call
  function: (attribute
    object: (identifier) @oqs_mod (#eq? @oqs_mod "oqs")
    attribute: (identifier) @fn (#eq? @fn "KeyEncapsulation"))
  arguments: (argument_list (_) @alg))
"""
captures = { oqs_mod = "ident", fn = "ident", alg = "literal_string" }
api = "oqs.KeyEncapsulation"
description = "liboqs-python KEM construction — oqs.KeyEncapsulation(alg_name)."

[[classify]]
id = "CRYPTO-992"
when.api = "^oqs\\.KeyEncapsulation$"
when.args.alg = { regex = "^ML-KEM-512$" }
algorithm_id = "ml-kem-512"
severity_hint = "auto"
message = "liboqs-python KeyEncapsulation({alg}) — ML-KEM-512, FIPS 203, quantum-resistant."

[[classify]]
id = "CRYPTO-993"
when.api = "^oqs\\.KeyEncapsulation$"
