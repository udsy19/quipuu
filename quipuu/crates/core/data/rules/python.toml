# AES via cryptography.hazmat.ciphers — capture the algorithm class name

[[extract]]
id = "PY-030"
language = "python"
query = """
(call
  function: (attribute
    object: (identifier) @cipher_mod (#eq? @cipher_mod "ciphers")
    attribute: (identifier) @cls (#eq? @cls "Cipher"))
  arguments: (argument_list
    (call
      function: (attribute
        object: (identifier) @algos (#eq? @algos "algorithms")
        attribute: (identifier) @algo)
      arguments: (_))
    (call
      function: (attribute
        object: (identifier) @modes (#eq? @modes "modes")
        attribute: (identifier) @mode)
      arguments: (_))))
"""
captures = { cipher_mod = "ident", cls = "ident", algos = "ident", algo = "ident", modes = "ident", mode = "ident" }
api = "cryptography.hazmat.ciphers.Cipher"
description = "Symmetric cipher Cipher(algorithms.X, modes.Y) construction."

[[classify]]
id = "CRYPTO-130"
when.api = "^cryptography\\.hazmat\\.ciphers\\.Cipher$"
when.args.algo = { regex = "^TripleDES$" }
algorithm_id = "3des"
severity_hint = "critical"
message = "3DES disallowed for new encryption use (NIST SP 800-131A, 2023)."

[[classify]]
id = "CRYPTO-131"
when.api = "^cryptography\\.hazmat\\.ciphers\\.Cipher$"
when.args.algo = { regex = "^ARC4$" }
algorithm_id = "rc4"
severity_hint = "critical"
message = "RC4 is broken — many distinguishing/key-recovery attacks."

[[classify]]
id = "CRYPTO-132"
when.api = "^cryptography\\.hazmat\\.ciphers\\.Cipher$"
when.args.algo = { regex = "^AES" }
when.args.mode = { regex = "^ECB$" }
algorithm_id = "aes-unattributed-ecb"
severity_hint = "high"
message = "AES-ECB leaks plaintext patterns at every key size. The key size is in the `key` argument to algorithms.AES(), not at this call site. Use GCM or CBC+HMAC."

# hashlib

[[extract]]
id = "PY-040"
language = "python"
query = """
(call
  function: (attribute
    object: (identifier) @mod (#eq? @mod "hashlib")
    attribute: (identifier) @fn))
"""
captures = { mod = "ident", fn = "ident" }
api = "hashlib.{fn}"
description = "hashlib hash function call."

[[classify]]
id = "CRYPTO-140"
when.api = "^hashlib\\.md5$"
algorithm_id = "md5"
severity_hint = "critical"
message = "MD5 classically broken."

[[classify]]
id = "CRYPTO-141"
when.api = "^hashlib\\.sha1$"
algorithm_id = "sha-1"
severity_hint = "critical"
message = "SHA-1 classically broken (SHAttered, 2017)."

# `hashlib.new(name)` names its hash in the first argument. Read it. When the
# argument is a variable there is no capture and no rule fires — a dynamic
# hash name is not evidence of MD5, which is what the previous placeholder
# asserted for every hashlib.new() call site in existence.

[[classify]]
id = "CRYPTO-142"
when.api = "^hashlib\\.new$"
when.args.name = { regex = "(?i)^md5$" }
algorithm_id = "md5"
severity_hint = "critical"
message = "hashlib.new('{name}') — MD5 is collision-broken (2004)."

[[classify]]
id = "CRYPTO-143"
when.api = "^hashlib\\.new$"
when.args.name = { regex = "(?i)^sha-?1$" }
algorithm_id = "sha-1"
severity_hint = "critical"
message = "hashlib.new('{name}') — SHA-1 is collision-broken (SHAttered, 2017)."

# PY-040's `[[extract]]` block above is documentation of the tree-sitter shape,
# same as every other pack — the actual extraction runs through `PYTHON_CALLEE_APIS`
# (scanner.rs), which had entries for hashlib.md5/sha1/new only. hashlib.sha256()
# and its SHA-2/SHA-3 siblings were never extracted at all, confirmed empirically
# (0 findings on a probe file calling all seven before this change) and by the
# `every_classify_rule_targets_an_api_the_extractor_can_emit` gate, which rejected
# a first version of this diff that added only these classify arms. Same defect
# class as #Y61/#Y64: a missing dispatch-table entry, not a missing classify arm.
# Fixed by adding the seven `hashlib.*` entries to `PYTHON_CALLEE_APIS`.

[[classify]]
id = "CRYPTO-962"
when.api = "^hashlib\\.sha224$"
algorithm_id = "sha-224"
severity_hint = "auto"
message = "hashlib.sha224() — SHA-224 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-963"
when.api = "^hashlib\\.sha256$"
algorithm_id = "sha-256"
severity_hint = "auto"
message = "hashlib.sha256() — SHA-256 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-964"
when.api = "^hashlib\\.sha384$"
algorithm_id = "sha-384"
severity_hint = "auto"
message = "hashlib.sha384() — SHA-384 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-965"
when.api = "^hashlib\\.sha512$"
algorithm_id = "sha-512"
severity_hint = "auto"
message = "hashlib.sha512() — SHA-512 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-966"
when.api = "^hashlib\\.sha3_256$"
algorithm_id = "sha3-256"
severity_hint = "auto"
message = "hashlib.sha3_256() — SHA3-256 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-967"
when.api = "^hashlib\\.sha3_384$"
algorithm_id = "sha3-384"
severity_hint = "auto"
message = "hashlib.sha3_384() — SHA3-384 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-968"
when.api = "^hashlib\\.sha3_512$"
algorithm_id = "sha3-512"
severity_hint = "auto"
message = "hashlib.sha3_512() — SHA3-512 hash. Quantum-safe."

# ssl — TLS context configuration

[[extract]]
id = "PY-050"
language = "python"
query = """
(call
  function: (attribute
    object: (identifier) @mod (#eq? @mod "ssl")
    attribute: (identifier) @fn (#eq? @fn "SSLContext"))
  arguments: (argument_list (attribute
    object: (identifier) @ssl2 (#eq? @ssl2 "ssl")
    attribute: (identifier) @proto)))
"""
captures = { mod = "ident", fn = "ident", ssl2 = "ident", proto = "ident" }
api = "ssl.SSLContext"
description = "Python SSL context — protocol selection."

[[classify]]
id = "CRYPTO-150"
when.api = "^ssl\\.SSLContext$"
when.args.proto = { regex = "^(PROTOCOL_SSLv2|PROTOCOL_SSLv3|PROTOCOL_TLSv1|PROTOCOL_TLSv1_1)$" }
# A protocol constant names no cipher; `tls-legacy-protocol` says that, where
# the previous `rsa-2048` placeholder asserted an algorithm not in the source.
algorithm_id = "tls-legacy-protocol"
severity_hint = "critical"
message = "Insecure TLS protocol {proto}. Use PROTOCOL_TLS_CLIENT/PROTOCOL_TLS_SERVER with TLS 1.2+ only."

# PyJWT

[[extract]]
id = "PY-060"
language = "python"
query = """
(call
  function: (attribute
    object: (identifier) @jwt (#eq? @jwt "jwt")
    attribute: (identifier) @fn (#eq? @fn "encode"))
  arguments: (argument_list
    (_)
    (_)
    (keyword_argument
      name: (identifier) @kw (#eq? @kw "algorithm")
      value: (string) @alg)))
"""
captures = { jwt = "ident", fn = "ident", kw = "ident", alg = "literal_string" }
api = "jwt.encode"
description = "PyJWT signing call with explicit algorithm kwarg."

[[classify]]
id = "CRYPTO-160"
when.api = "^jwt\\.encode$"
when.args.alg = { regex = "^[\"']?none[\"']?$" }
when.site_context = ["Call"]
algorithm_id = "jwt-alg-none"
severity_hint = "critical"
message = "JWT algorithm='none' — signature verification disabled."

[[classify]]
id = "CRYPTO-161"
when.api = "^jwt\\.encode$"
when.args.alg = { regex = "^[\"']?HS256[\"']?$" }
when.site_context = ["Call"]
algorithm_id = "sha-256"   # HMAC-SHA256; treated as symmetric-OK but flag for weak-secret risk in v1.5
severity_hint = "low"
message = "JWT HS256 (HMAC-SHA256) — confirm signing key has ≥256 bits of entropy."

[[classify]]
id = "CRYPTO-162"
when.api = "^jwt\\.encode$"
when.args.alg = { regex = "^[\"']?RS256[\"']?$" }
when.site_context = ["Call"]
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "auto"
message = "JWT RS256 — RSA-PKCS1 signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-163"
when.api = "^jwt\\.encode$"
when.args.alg = { regex = "^[\"']?ES256[\"']?$" }
when.site_context = ["Call"]
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "JWT ES256 — ECDSA P-256, quantum-vulnerable."

# pycryptodome — Crypto.PublicKey.RSA

[[extract]]
id = "PY-070"
language = "python"
query = """
(call
  function: (attribute
    object: (attribute
      object: (identifier) @crypto_mod (#eq? @crypto_mod "Crypto")
      attribute: (identifier))
    attribute: (identifier) @fn (#eq? @fn "generate"))
  arguments: (argument_list (integer) @bits))
"""
captures = { crypto_mod = "ident", fn = "ident", bits = "literal_int" }
api = "Crypto.PublicKey.RSA.generate"
description = "pycryptodome RSA.generate(bits)."

[[classify]]
id = "CRYPTO-170"
when.api = "^Crypto\\.PublicKey\\.RSA\\.generate$"
when.args.bits = { lt = 2048 }
algorithm_id = "rsa-undersized"
severity_hint = "critical"
message = "pycryptodome RSA.generate({bits}) — below 2048-bit floor."

[[classify]]
id = "CRYPTO-171"
when.api = "^Crypto\\.PublicKey\\.RSA\\.generate$"
when.args.bits = 2048
algorithm_id = "rsa-2048"
severity_hint = "auto"
message = "pycryptodome RSA-2048 — NIST IR 8547 deprecation 2030."

[[classify]]
id = "CRYPTO-172"
when.api = "^Crypto\\.PublicKey\\.RSA\\.generate$"
when.args.bits = { ge = 3072 }
algorithm_id = "rsa-3072"
severity_hint = "auto"
message = "pycryptodome RSA-{bits} — quantum-vulnerable regardless of key size."

# bits is a runtime variable, e.g. RSA.generate(key_size) — same shape as
# CRYPTO-104's paramiko-style fallback above. Without this arm the call
# silently produced zero findings despite the extractor seeing the call.
[[classify]]
id = "CRYPTO-173"
when.api = "^Crypto\\.PublicKey\\.RSA\\.generate$"
when.args.bits_symbol = { regex = ".+" }
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "pycryptodome RSA key size is runtime-variable ({bits_symbol}); cannot statically verify it meets the 2048-bit floor. Quantum-vulnerable in any case."

# pycryptodome/pycryptodomex — Crypto.Cipher.DES / Crypto.Cipher.DES3
# (Cryptodome.Cipher.* imports the identical class names, so the bare
