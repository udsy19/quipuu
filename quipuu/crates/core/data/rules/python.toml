# Fallback for every other liboqs KEM name (HQC, BIKE, Classic McEliece,
# FrodoKEM, ...) and for a runtime variable whose value cannot be read
# statically — both official examples (kem.py) pass `kemalg` this way.
# Ordered last so the ML-KEM arms above match first. Same shape #Y56 already
# shipped for cpp.toml's OQS_KEM_new.
[[classify]]
id = "CRYPTO-995"
when.api = "^oqs\\.KeyEncapsulation$"
when.args.alg = { regex = "." }
algorithm_id = "kem-unattributed"
severity_hint = "auto"
message = "liboqs-python KeyEncapsulation({alg}) — post-quantum KEM, family not in the quipuu algorithm table. Recorded as an unattributed call site — classify it by hand."

[[classify]]
id = "CRYPTO-996"
when.api = "^oqs\\.KeyEncapsulation$"
when.args.alg_symbol = { regex = ".+" }
algorithm_id = "kem-unattributed"
severity_hint = "auto"
message = "liboqs-python KeyEncapsulation algorithm is runtime-variable ({alg_symbol}); cannot statically verify the parameter set. Post-quantum KEM regardless."

