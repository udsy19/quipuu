language = "csharp"
query = """
(invocation_expression
  function: (member_access_expression
    expression: (identifier) @cls (#eq? @cls "Aes")
    name: (identifier) @fn (#eq? @fn "Create")))
"""
captures = { cls = "ident", fn = "ident" }
api = "System.Security.Cryptography.Aes.Create"
description = "Aes.Create() — factory for AES symmetric cipher."

[[classify]]
id = "CRYPTO-620"
when.api = "^System\\.Security\\.Cryptography\\.Aes\\.Create$"
algorithm_id = "aes-unattributed"
severity_hint = "auto"
message = "Aes.Create() — a factory that states neither key size nor mode; both come from the KeySize/Mode properties set afterwards. Ensure 256-bit keys and an authenticated mode (AesGcm/AesCcm). The default Mode is CBC, which is not authenticated."

# ============================================================================
# TripleDES.Create() / DES.Create()
# ============================================================================

[[extract]]
id = "CSH-011"
language = "csharp"
query = """
(invocation_expression
  function: (member_access_expression
    expression: (identifier) @cls (#match? @cls "^(TripleDES|DES)$")
    name: (identifier) @fn (#eq? @fn "Create")))
"""
captures = { cls = "ident", fn = "ident" }
api = "System.Security.Cryptography.TripleDES.Create"
description = "TripleDES.Create() — legacy symmetric cipher."

[[classify]]
id = "CRYPTO-621"
when.api = "^System\\.Security\\.Cryptography\\.TripleDES\\.Create$"
algorithm_id = "3des"
severity_hint = "high"
message = "TripleDES.Create() — 3DES is deprecated for new use (NIST SP 800-131A r2). Migrate to AES-256-GCM."
cwe = "CWE-327"

# `DES.Create()` used to share TripleDES's api name, so a single-DES call site
# was reported as 3DES — a different algorithm and a different CBOM component.

[[extract]]
id = "CS-022"
language = "csharp"
query = """
(invocation_expression
  function: (member_access_expression
    expression: (identifier) @cls (#eq? @cls "DES")
    name: (identifier) @fn (#eq? @fn "Create")))
"""
captures = { cls = "ident", fn = "ident" }
api = "System.Security.Cryptography.DES.Create"
description = "DES.Create() — single DES."

[[classify]]
id = "CRYPTO-622"
when.api = "^System\\.Security\\.Cryptography\\.DES\\.Create$"
algorithm_id = "des"
severity_hint = "critical"
message = "DES.Create() — 56-bit key, brute-forced since 1998; disallowed for new encryption (NIST SP 800-131A). Migrate to AES-256-GCM."
cwe = "CWE-327"

# ============================================================================
# SHA256.Create() / SHA512.Create()
# ============================================================================

[[extract]]
id = "CSH-020"
language = "csharp"
query = """
(invocation_expression
  function: (member_access_expression
    expression: (identifier) @cls (#match? @cls "^SHA(1|256|384|512|3_256|3_384|3_512)$")
    name: (identifier) @fn (#eq? @fn "Create")))
"""
captures = { cls = "ident", fn = "ident" }
api = "System.Security.Cryptography.{cls}.Create"
description = "SHA*.Create() — hash algorithm factory."

[[classify]]
id = "CRYPTO-630"
when.api = "^System\\.Security\\.Cryptography\\.SHA1\\.Create$"
algorithm_id = "sha-1"
severity_hint = "critical"
message = "SHA1.Create() — SHA-1 is classically broken (SHAttered, 2017). Use SHA-256 or higher."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-631"
when.api = "^System\\.Security\\.Cryptography\\.SHA256\\.Create$"
algorithm_id = "sha-256"
severity_hint = "auto"
message = "SHA256.Create() — SHA-256 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-632"
when.api = "^System\\.Security\\.Cryptography\\.SHA512\\.Create$"
algorithm_id = "sha-512"
severity_hint = "auto"
message = "SHA512.Create() — SHA-512 hash. Quantum-safe."

# SHA384.Create() — `CSHARP_CALLEE_APIS` (scanner.rs) had no entry for it, so
# the call site was never even extracted, though algorithm-table.toml already
# carries a sha-384 row. Added there alongside this arm.
[[classify]]
id = "CRYPTO-633"
when.api = "^System\\.Security\\.Cryptography\\.SHA384\\.Create$"
algorithm_id = "sha-384"
severity_hint = "auto"
message = "SHA384.Create() — SHA-384 hash. Quantum-safe."

# SHA3_256/384/512.Create() — same shape as SHA384 above: `CSHARP_CALLEE_APIS`
# had no entries for .NET's SHA3 classes, so the call sites were never
# extracted. sha3-384 also needed a new algorithm-table.toml row; sha3-256
# and sha3-512 already had one.
[[classify]]
id = "CRYPTO-945"
when.api = "^System\\.Security\\.Cryptography\\.SHA3_256\\.Create$"
algorithm_id = "sha3-256"
severity_hint = "auto"
message = "SHA3_256.Create() — SHA3-256 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-946"
when.api = "^System\\.Security\\.Cryptography\\.SHA3_384\\.Create$"
algorithm_id = "sha3-384"
severity_hint = "auto"
message = "SHA3_384.Create() — SHA3-384 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-947"
when.api = "^System\\.Security\\.Cryptography\\.SHA3_512\\.Create$"
algorithm_id = "sha3-512"
severity_hint = "auto"
message = "SHA3_512.Create() — SHA3-512 hash. Quantum-safe."

