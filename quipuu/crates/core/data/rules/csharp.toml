# ============================================================================
# System.Security.Cryptography — MLKem / MLDsa / SlhDsa (.NET 10+, first-party,
# no NuGet dependency)
#
# Shipped in System.Security.Cryptography.dll itself (net10.0+; also on the
# Microsoft.Bcl.Cryptography polyfill package for older TFMs) as a static
# factory: MLKem.GenerateKey(MLKemAlgorithm.MLKem768). Unlike RSA.Create() /
# ECDsa.Create() these classes derive from IDisposable directly, not
# AsymmetricAlgorithm, and take the parameter set as the sole GenerateKey
# argument rather than a property set afterwards — a different axis from
# every other rule in this file, per backlog #Y43. Property names read
# directly from learn.microsoft.com's MLKemAlgorithm / MLDsaAlgorithm /
# SlhDsaAlgorithm class pages (net-10.0), not guessed.
# ============================================================================

[[extract]]
id = "CSH-052"
language = "csharp"
query = """
(invocation_expression
  function: (member_access_expression
    expression: (identifier) @cls (#eq? @cls "MLKem")
    name: (identifier) @fn (#eq? @fn "GenerateKey"))
  arguments: (argument_list
