when.args.algo = { regex = "(?i)RSA-SHA384" }
algorithm_id = "rsa-pkcs1-sha384"
severity_hint = "auto"
message = "RSA-SHA384 signature via createSign('{algo}'). Quantum-vulnerable."

[[classify]]
id = "CRYPTO-972"
when.api = "^node:crypto\\.createSign$"
when.args.algo = { regex = "(?i)RSA-SHA512" }
algorithm_id = "rsa-pkcs1-sha512"
severity_hint = "auto"
message = "RSA-SHA512 signature via createSign('{algo}'). Quantum-vulnerable."

# ============================================================================
# WebCrypto — subtle.generateKey / subtle.sign
#
# One algorithm vocabulary serves both calls, so the classify arms below match
# either API and are ordered most-specific first (the scanner takes the first
# arm that matches). The algorithm name is read from argument 0 — either a bare
# string or the `name` property of the algorithm object — and `curve`, `hash`
# and `length` refine it. When argument 0 is a variable, nothing is captured and
# the two unattributed arms at the end fire instead. Nothing here asserts an
# algorithm the call site does not state: Node has accepted ML-DSA and ML-KEM in
# `subtle.generateKey`/`sign` since v24.7.0, so a hard-coded classical guess
# reports a migrated call site as quantum-vulnerable.
# ============================================================================

[[extract]]
id = "JST-040"
language = "javascript"
query = """
(call_expression
  function: (member_expression
    object: (_) @receiver
    property: (property_identifier) @fn (#eq? @fn "generateKey"))
  arguments: (arguments . (_) @alg))
"""
captures = { receiver = "expr", fn = "ident", alg = "literal_string", curve = "literal_string", hash = "literal_string", length = "literal_int" }
api = "webcrypto.subtle.generateKey"
description = "WebCrypto subtle.generateKey(algorithm, extractable, usages), through any receiver ending in `.subtle`. `alg` is the algorithm name — argument 0 when it is a bare string, else its `name` property. `curve`, `hash` and `length` are read off the same object when present."

[[extract]]
id = "JST-050"
language = "javascript"
query = """
(call_expression
  function: (member_expression
    object: (_) @receiver
    property: (property_identifier) @fn (#eq? @fn "sign"))
  arguments: (arguments . (_) @alg))
"""
captures = { receiver = "expr", fn = "ident", alg = "literal_string", curve = "literal_string", hash = "literal_string", length = "literal_int" }
api = "webcrypto.subtle.sign"
description = "WebCrypto subtle.sign(algorithm, key, data), through any receiver ending in `.subtle`. Same captures as JST-040; a sign() algorithm object carries `hash` but never `namedCurve`, which belongs to the key."

# --- PQC: FIPS 204 / 203, accepted by Node WebCrypto since v24.7.0 ----------
# The parameter set is fully determined by the name, so these need no refining
# capture.

[[classify]]
id = "CRYPTO-341"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ML-DSA-44$" }
algorithm_id = "ml-dsa-44"
severity_hint = "auto"
message = "WebCrypto ML-DSA-44 ({alg}) — FIPS 204, quantum-resistant. Migrated signature call site."

[[classify]]
id = "CRYPTO-342"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ML-DSA-65$" }
algorithm_id = "ml-dsa-65"
severity_hint = "auto"
message = "WebCrypto ML-DSA-65 ({alg}) — FIPS 204, quantum-resistant. Migrated signature call site."

[[classify]]
id = "CRYPTO-343"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ML-DSA-87$" }
algorithm_id = "ml-dsa-87"
severity_hint = "auto"
message = "WebCrypto ML-DSA-87 ({alg}) — FIPS 204, quantum-resistant. Migrated signature call site."

[[classify]]
id = "CRYPTO-344"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ML-KEM-512$" }
algorithm_id = "ml-kem-512"
severity_hint = "auto"
message = "WebCrypto ML-KEM-512 ({alg}) — FIPS 203, quantum-resistant. Migrated key-establishment call site."

[[classify]]
id = "CRYPTO-345"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ML-KEM-768$" }
algorithm_id = "ml-kem-768"
severity_hint = "auto"
message = "WebCrypto ML-KEM-768 ({alg}) — FIPS 203, quantum-resistant. Migrated key-establishment call site."

[[classify]]
id = "CRYPTO-346"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ML-KEM-1024$" }
algorithm_id = "ml-kem-1024"
severity_hint = "auto"
message = "WebCrypto ML-KEM-1024 ({alg}) — FIPS 203, quantum-resistant. Migrated key-establishment call site."

# --- Classical elliptic curve ----------------------------------------------
# `namedCurve` is required by WebCrypto for ECDSA/ECDH, so an ECDSA site with no
# curve capture wrote it as a variable; that falls through to CRYPTO-398 rather
# than being pinned to P-256.

[[classify]]
id = "CRYPTO-347"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ECDSA$" }
when.args.curve = { regex = "(?i)^P-256$" }
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "WebCrypto ECDSA on {curve}. Quantum-vulnerable — replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-348"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
