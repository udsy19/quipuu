# CRYPTO-330/331 covered only RSA-SHA256 and bare SHA256 — the two names the
# original fixture exercised — though node:crypto's createSign accepts the
# same RSA-SHA1/384/512 names OpenSSL supports (confirmed real Node.js names,
# not assumed: `require('crypto').getHashes()` lists all three), and
# algorithm-table.toml already carries `rsa-pkcs1-sha1`/`-sha384`/`-sha512`
