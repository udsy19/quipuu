# findings — same shape as `#Y56`/`#Y57`/`#Y58`/`#Y59`/`#Y60`. Ordered before
# nothing else needs reordering: none of the three strings contain "SHA256",
# so they cannot be shadowed by CRYPTO-330/331.

[[classify]]
id = "CRYPTO-970"
when.api = "^node:crypto\\.createSign$"
when.args.algo = { regex = "(?i)RSA-SHA1" }
algorithm_id = "rsa-pkcs1-sha1"
severity_hint = "auto"
message = "RSA-SHA1 signature via createSign('{algo}'). Classically broken (SHAttered, 2017)."

[[classify]]
