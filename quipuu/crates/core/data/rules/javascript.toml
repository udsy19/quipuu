[[classify]]
id = "CRYPTO-310"
when.api = "^node:crypto\\.createHash$"
when.args.algo = { regex = "(?i)^['\"]?md5['\"]?$" }
algorithm_id = "md5"
severity_hint = "critical"
message = "MD5 in createHash('{algo}'). Classically broken."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-311"
when.api = "^node:crypto\\.createHash$"
when.args.algo = { regex = "(?i)^['\"]?sha1['\"]?$" }
algorithm_id = "sha-1"
severity_hint = "critical"
