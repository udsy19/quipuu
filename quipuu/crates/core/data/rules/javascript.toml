when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ECDH$" }
when.args.curve = { regex = "(?i)^P-521$" }
algorithm_id = "ecdh-p521"
severity_hint = "auto"
