# JavaScript / TypeScript detection rules — two-layer (extract → classify), per D-07
#
# One file covers both .js and .ts files.  For .js we use tree-sitter-javascript;
# for .ts we use tree-sitter-typescript (TypeScript grammar extends the JS grammar
# so node shapes are identical for runtime crypto calls).
#
# Covers: node:crypto (createCipheriv, createHash, generateKeyPair, createSign),
#         WebCrypto (subtle.generateKey, subtle.sign), jsonwebtoken.
#
# Extract IDs: JST-NNN
# Classify IDs: CRYPTO-300..399

# ============================================================================
# node:crypto — createCipheriv
# ============================================================================

[[extract]]
id = "JST-001"
language = "javascript"
query = """
(call_expression
  function: (member_expression
    object: (identifier) @mod
    property: (property_identifier) @fn (#eq? @fn "createCipheriv"))
  arguments: (arguments (string) @algo))
"""
captures = { mod = "ident", fn = "ident", algo = "literal_string" }
api = "node:crypto.createCipheriv"
description = "node:crypto createCipheriv(algorithm, key, iv) — cipher algorithm string."

[[classify]]
id = "CRYPTO-300"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)des" }
algorithm_id = "des"
severity_hint = "critical"
message = "DES/3DES in createCipheriv('{algo}'). Disallowed for new use."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-301"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)rc4" }
algorithm_id = "rc4"
severity_hint = "critical"
message = "RC4 in createCipheriv('{algo}'). Classically broken."
cwe = "CWE-327"

# A Node cipher name always carries the key size — `aes-256-gcm`, and the
# legacy no-dash and `id-aesNNN-GCM` aliases. So the size is readable here and
# is read, rather than assumed. CRYPTO-302/303 stay as the family fallback for
# a name we do not recognise; they now say so instead of guessing. Rule order
# is load-bearing: apply_classify takes the first `when` that matches.

[[classify]]
id = "CRYPTO-304"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-?128-.*gcm" }
algorithm_id = "aes-128-gcm"
severity_hint = "auto"
message = "AES-128-GCM in createCipheriv('{algo}'). Good AEAD mode; CNSA 2.0 requires 256-bit AES."

[[classify]]
id = "CRYPTO-305"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-?192-.*gcm" }
algorithm_id = "aes-192-gcm"
severity_hint = "auto"
message = "AES-192-GCM in createCipheriv('{algo}'). Good AEAD mode; CNSA 2.0 requires 256-bit AES."

[[classify]]
id = "CRYPTO-306"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-?256-.*gcm" }
algorithm_id = "aes-256-gcm"
severity_hint = "auto"
message = "AES-256-GCM in createCipheriv('{algo}'). Good AEAD mode at a CNSA 2.0-approved key size."

[[classify]]
id = "CRYPTO-302"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-.*-gcm" }
algorithm_id = "aes-unattributed-gcm"
severity_hint = "auto"
message = "AES-GCM in createCipheriv('{algo}'). Good AEAD mode; the cipher name did not resolve to a key size quipuu recognises."

[[classify]]
id = "CRYPTO-307"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-?128-.*ecb" }
algorithm_id = "aes-128-ecb"
severity_hint = "high"
message = "AES-128-ECB in createCipheriv('{algo}'). Deterministic mode leaks patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-308"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-?192-.*ecb" }
algorithm_id = "aes-192-ecb"
severity_hint = "high"
message = "AES-192-ECB in createCipheriv('{algo}'). Deterministic mode leaks patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-309"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-?256-.*ecb" }
algorithm_id = "aes-256-ecb"
severity_hint = "high"
message = "AES-256-ECB in createCipheriv('{algo}'). Deterministic mode leaks patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-303"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-.*-ecb" }
algorithm_id = "aes-unattributed-ecb"
severity_hint = "high"
message = "AES-ECB in createCipheriv('{algo}'). Deterministic mode leaks patterns at every key size; the cipher name did not resolve to a key size quipuu recognises."
cwe = "CWE-327"

# ============================================================================
