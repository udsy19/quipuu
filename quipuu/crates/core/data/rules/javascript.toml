message = "WebCrypto AES-CBC, {length}-bit key. Unauthenticated mode; prefer AES-GCM."

# --- Unattributed ----------------------------------------------------------
# Everything that named an algorithm we have no row for, then everything whose
# algorithm argument was not a literal at all. Both record the call site without
# claiming an algorithm; see the `webcrypto-unattributed` row in
# algorithm-table.toml.

[[classify]]
id = "CRYPTO-398"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "." }
algorithm_id = "webcrypto-unattributed"
severity_hint = "auto"
message = "WebCrypto call names algorithm '{alg}', which has no row in the quipuu algorithm table. Recorded as an unattributed call site — classify it by hand."

[[classify]]
id = "CRYPTO-340"
when.api = "^webcrypto\\.subtle\\.generateKey$"
algorithm_id = "webcrypto-unattributed"
severity_hint = "auto"
message = "WebCrypto subtle.generateKey() with a non-literal algorithm argument. The algorithm is not determinable from this call site — inspect the value passed in."

[[classify]]
id = "CRYPTO-350"
when.api = "^webcrypto\\.subtle\\.sign$"
algorithm_id = "webcrypto-unattributed"
severity_hint = "auto"
message = "WebCrypto subtle.sign() with a non-literal algorithm argument. The algorithm is not determinable from this call site — inspect the value passed in."

# ============================================================================
# jsonwebtoken — jwt.sign
# ============================================================================

[[extract]]
id = "JST-060"
language = "javascript"
query = """
(call_expression
  function: (member_expression
    object: (identifier) @jwt (#eq? @jwt "jwt")
    property: (property_identifier) @fn (#eq? @fn "sign")))
"""
captures = { jwt = "ident", fn = "ident" }
api = "jsonwebtoken.jwt.sign"
description = "jsonwebtoken jwt.sign(payload, secret, {algorithm: ...})."

# jwt.sign — Phase 17 argument-value disambiguation. The original blanket
# rule was rewritten as per-variant rules below; the catch-all CRYPTO-360
# stays at the END so the more-specific rules win (first match wins in
# the apply_classify loop).

# Explicit HMAC: { algorithm: 'HS256' / HS384 / HS512 }
[[classify]]
id = "CRYPTO-361"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^HS256$" }
algorithm_id = "sha-256"
severity_hint = "low"
message = "jsonwebtoken jwt.sign({algorithm:'HS256'}) — HMAC-SHA256. Confirm signing key entropy."

[[classify]]
id = "CRYPTO-362"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^HS384$" }
algorithm_id = "sha-384"
severity_hint = "low"
message = "jsonwebtoken jwt.sign({algorithm:'HS384'}) — HMAC-SHA384. Confirm signing key entropy."

[[classify]]
id = "CRYPTO-363"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^HS512$" }
algorithm_id = "sha-512"
severity_hint = "low"
message = "jsonwebtoken jwt.sign({algorithm:'HS512'}) — HMAC-SHA512. Confirm signing key entropy."

# Explicit RSA-PKCS1
[[classify]]
id = "CRYPTO-364"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^RS256$" }
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "auto"
message = "jsonwebtoken jwt.sign({algorithm:'RS256'}) — RSA-PKCS1-SHA256. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-365"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^RS384$" }
algorithm_id = "rsa-pkcs1-sha384"
severity_hint = "auto"
message = "jsonwebtoken jwt.sign({algorithm:'RS384'}) — RSA-PKCS1-SHA384. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-366"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^RS512$" }
algorithm_id = "rsa-pkcs1-sha512"
severity_hint = "auto"
message = "jsonwebtoken jwt.sign({algorithm:'RS512'}) — RSA-PKCS1-SHA512. Quantum-vulnerable."

# Explicit RSA-PSS
[[classify]]
id = "CRYPTO-367"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^PS256$" }
algorithm_id = "rsa-pss-sha256"
severity_hint = "auto"
message = "jsonwebtoken jwt.sign({algorithm:'PS256'}) — RSA-PSS-SHA256. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-368"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^PS384$" }
algorithm_id = "rsa-pss-sha384"
severity_hint = "auto"
message = "jsonwebtoken jwt.sign({algorithm:'PS384'}) — RSA-PSS-SHA384. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-369"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^PS512$" }
algorithm_id = "rsa-pss-sha512"
severity_hint = "auto"
