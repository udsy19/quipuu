# Explicit ECDSA
[[classify]]
id = "CRYPTO-378"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^ES256$" }
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "jsonwebtoken jwt.sign({algorithm:'ES256'}) — ECDSA P-256. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-379"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^ES384$" }
algorithm_id = "ecdsa-p384"
severity_hint = "auto"
message = "jsonwebtoken jwt.sign({algorithm:'ES384'}) — ECDSA P-384. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-380"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^ES512$" }
algorithm_id = "ecdsa-p521"
parameter_source = "RFC 7518 § 3.4: ES512 is ECDSA using P-521 and SHA-512."
severity_hint = "auto"
message = "jsonwebtoken jwt.sign({algorithm:'ES512'}) — ECDSA P-521. Quantum-vulnerable."

# alg=none (CWE-347)
[[classify]]
id = "CRYPTO-381"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.algorithm = { regex = "^none$" }
algorithm_id = "jwt-alg-none"
severity_hint = "critical"
message = "jsonwebtoken jwt.sign({algorithm:'none'}) — signature verification disabled. CVE-2015-9235 class."
cwe = "CWE-347"

# No explicit algorithm AND key is a string literal → HMAC default
# (jsonwebtoken's default is HS256 when the key is a string).
[[classify]]
id = "CRYPTO-382"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
when.args.key_kind = "string"
algorithm_id = "sha-256"
parameter_source = "jsonwebtoken signs with HS256 when no algorithm option is given, so a string secret determines HMAC-SHA256 (jsonwebtoken README, sign options)."
severity_hint = "low"
message = "jsonwebtoken jwt.sign(payload, <string secret>) — HMAC-SHA256 by default. Confirm key entropy."

# Fallback: jwt.sign call we couldn't disambiguate (non-string key, no
# explicit algorithm option visible). Medium because the algorithm isn't
# statically determinable — auditor needs to check the call site.
[[classify]]
id = "CRYPTO-360"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "medium"
message = "jsonwebtoken jwt.sign() called without an explicit algorithm option and a non-string key — algorithm not statically determinable. Confirm algorithm at runtime."

# ============================================================================
# crypto-js — pure-JS crypto library used by ~12M downloads/week.
# Two-level member-expression callees are matched in match_js_callee()
# (scanner.rs) and routed to the classify rules below.
# Every algorithm here is on the BrokenClassically tier.
# ============================================================================

[[classify]]
id = "CRYPTO-370"
when.api = "^crypto-js\\.AES\\.encrypt$"
algorithm_id = "aes-unattributed"
severity_hint = "auto"
message = "crypto-js AES used. The CryptoJS.AES helper defaults to CBC mode with PKCS#7 padding, and derives its key size from the passphrase or key object — neither parameter is at this call site. Confirm both against project requirements. Inventory for CBOM."

[[classify]]
id = "CRYPTO-371"
when.api = "^crypto-js\\.DES\\.encrypt$"
algorithm_id = "des"
severity_hint = "critical"
message = "crypto-js DES (56-bit key) — classically broken. Replace with AES-256-GCM."

[[classify]]
id = "CRYPTO-372"
when.api = "^crypto-js\\.TripleDES\\.encrypt$"
algorithm_id = "3des"
severity_hint = "critical"
message = "crypto-js TripleDES — Sweet32 attack practical; NIST SP 800-131A disallowed after 2023."

[[classify]]
id = "CRYPTO-373"
when.api = "^crypto-js\\.RC4\\.encrypt$"
algorithm_id = "rc4"
severity_hint = "critical"
message = "crypto-js RC4 — classically broken (RFC 7465 PROHIBITS in TLS). Replace immediately."

[[classify]]
id = "CRYPTO-374"
when.api = "^crypto-js\\.MD5$"
algorithm_id = "md5"
severity_hint = "critical"
message = "crypto-js MD5 — classically broken (collision attacks since 2004). Use SHA-256."

[[classify]]
id = "CRYPTO-375"
when.api = "^crypto-js\\.SHA1$"
algorithm_id = "sha-1"
severity_hint = "critical"
message = "crypto-js SHA-1 — classically broken (SHAttered, 2017). Use SHA-256."

[[classify]]
id = "CRYPTO-376"
when.api = "^crypto-js\\.HmacMD5$"
algorithm_id = "md5"
severity_hint = "high"
message = "crypto-js HMAC-MD5 — HMAC mitigates MD5 collision attacks but the construct is deprecated; prefer HMAC-SHA-256."

[[classify]]
id = "CRYPTO-377"
when.api = "^crypto-js\\.HmacSHA1$"
algorithm_id = "sha-1"
severity_hint = "high"
message = "crypto-js HMAC-SHA1 — HMAC mitigates SHA-1 collision attacks but the construct is deprecated; prefer HMAC-SHA-256."
