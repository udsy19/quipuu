# --- RSA -------------------------------------------------------------------
# Keyed on the hash, not the modulus: WebCrypto requires `hash` for every RSA
# algorithm but only requires `modulusLength` for generateKey, so the hash is
# the parameter present at both call sites. This mirrors how the JWT alg names
# (RS256 / PS384) already map onto these rows.

[[classify]]
id = "CRYPTO-358"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^RSA-OAEP$" }
when.args.hash = { regex = "(?i)^SHA-256$" }
algorithm_id = "rsa-oaep-256"
severity_hint = "auto"
message = "WebCrypto RSA-OAEP with {hash}. Quantum-vulnerable key transport — HNDL exposure."

