# --- Symmetric -------------------------------------------------------------
# `length` is required for AES generateKey, so an AES arm without it saw a
# variable and falls through rather than assuming a key size.

[[classify]]
id = "CRYPTO-390"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^AES-GCM$" }
when.args.length = 128
algorithm_id = "aes-128-gcm"
severity_hint = "auto"
message = "WebCrypto AES-GCM, {length}-bit key. Grover halves the margin — 256-bit is the CNSA 2.0 floor."

[[classify]]
