# `namedCurve` belongs to the key, not to the algorithm object `subtle.sign`
# takes, so an ECDSA/ECDH sign call can never state its curve. These two arms
# keep the part that is certain — the family, and therefore the Shor verdict —
# and say in the message that the curve is not visible here. Same shape as
# CRYPTO-211 (`KeyPairGenerator.getInstance("EC")`) and CRYPTO-610
# (`ECDsa.Create()`), which have the same limitation for the same reason.

[[classify]]
id = "CRYPTO-395"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ECDSA$" }
algorithm_id = "ecdsa-unattributed"
severity_hint = "auto"
message = "WebCrypto ECDSA; the curve is not stated at this call site — it comes from the key. Quantum-vulnerable at every curve — replace with ML-DSA."

[[classify]]
id = "CRYPTO-396"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^ECDH$" }
algorithm_id = "ecdh-unattributed"
severity_hint = "auto"
message = "WebCrypto ECDH; the curve is not stated at this call site — it comes from the key. Quantum-vulnerable key agreement at every curve — HNDL exposure."

[[classify]]
id = "CRYPTO-354"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^Ed25519$" }
algorithm_id = "ed25519"
severity_hint = "auto"
message = "WebCrypto Ed25519 signature. Quantum-vulnerable — replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-355"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^Ed448$" }
algorithm_id = "ed448"
severity_hint = "auto"
message = "WebCrypto Ed448 signature. Quantum-vulnerable — replace with ML-DSA-87."

[[classify]]
id = "CRYPTO-356"
when.api = "^webcrypto\\.subtle\\.(generateKey|sign)$"
when.args.alg = { regex = "(?i)^X25519$" }
algorithm_id = "x25519"
severity_hint = "auto"
