# C / C++ detection rules — two-layer (extract → classify), per D-07
#
# Covers: OpenSSL (RSA_generate_key_ex, EVP_PKEY_CTX_new_from_name,
#         EVP_PKEY_Q_keygen, EVP_EncryptInit_ex, EVP_DigestInit,
#         SSL_CTX_set_cipher_list), libsodium (crypto_box_*, crypto_sign_*),
#         mbedTLS (mbedtls_rsa_*, mbedtls_pk_*), liboqs (OQS_KEM_*, OQS_SIG_*).
#
# Extract IDs: CPP-NNN
# Classify IDs: CRYPTO-400..499

# ============================================================================
# OpenSSL — RSA_generate_key_ex
# ============================================================================

[[extract]]
id = "CPP-001"
language = "c"
query = """
(call_expression
  function: (identifier) @fn (#eq? @fn "RSA_generate_key_ex")
  arguments: (argument_list
    (_)
    (number_literal) @bits))
"""
captures = { fn = "ident", bits = "literal_int" }
api = "openssl.RSA_generate_key_ex"
description = "OpenSSL RSA_generate_key_ex(rsa, bits, e, cb) — RSA key generation."

[[classify]]
id = "CRYPTO-400"
when.api = "^openssl\\.RSA_generate_key_ex$"
when.args.bits = { lt = 2048 }
algorithm_id = "rsa-undersized"
severity_hint = "critical"
message = "RSA_generate_key_ex with {bits} bits — below 2048-bit floor."
cwe = "CWE-326"

[[classify]]
id = "CRYPTO-401"
when.api = "^openssl\\.RSA_generate_key_ex$"
when.args.bits = 2048
algorithm_id = "rsa-2048"
severity_hint = "auto"
message = "RSA_generate_key_ex(bits=2048). Quantum-vulnerable: NIST IR 8547 deprecates after 2030."

[[classify]]
id = "CRYPTO-402"
when.api = "^openssl\\.RSA_generate_key_ex$"
when.args.bits = { ge = 4096 }
algorithm_id = "rsa-4096"
severity_hint = "auto"
message = "RSA_generate_key_ex(bits={bits}). Larger key does NOT protect against Shor's algorithm."

# ============================================================================
# OpenSSL — RSA_generate_key (legacy, pre-3.0, no `_ex`)
#
# `RSA_generate_key(bits, e, callback, cb_arg)` puts bits in argument
# position 1, not 2 — the opposite of `_ex`'s `(rsa, bits, e, cb)`. wolfssl's
# own OpenSSL-compat test suite wraps both success and failure calls in its
# `Expect{,Not}Null` macros; `is_test_assertion_callee` (scanner.rs) treats
# only `ExpectNull` as low-signal, so a call the test requires to fail is
# excluded via `site_context` while a call the test requires to succeed is
# not.
# ============================================================================

[[extract]]
id = "CPP-002"
language = "c"
query = """
(call_expression
  function: (identifier) @fn (#eq? @fn "RSA_generate_key")
  arguments: (argument_list . (number_literal) @bits))
"""
captures = { fn = "ident", bits = "literal_int" }
api = "openssl.RSA_generate_key"
description = "OpenSSL RSA_generate_key(bits, e, callback, cb_arg) — legacy RSA key generation, pre-3.0."

[[classify]]
id = "CRYPTO-403"
when.api = "^openssl\\.RSA_generate_key$"
when.args.bits = { lt = 2048 }
when.site_context = ["Call"]
algorithm_id = "rsa-undersized"
severity_hint = "critical"
message = "RSA_generate_key with {bits} bits — below 2048-bit floor."
cwe = "CWE-326"

[[classify]]
id = "CRYPTO-404"
when.api = "^openssl\\.RSA_generate_key$"
when.args.bits = 2048
when.site_context = ["Call"]
algorithm_id = "rsa-2048"
severity_hint = "auto"
message = "RSA_generate_key(bits=2048). Quantum-vulnerable: NIST IR 8547 deprecates after 2030."

[[classify]]
id = "CRYPTO-405"
when.api = "^openssl\\.RSA_generate_key$"
when.args.bits = { ge = 4096 }
when.site_context = ["Call"]
algorithm_id = "rsa-4096"
severity_hint = "auto"
message = "RSA_generate_key(bits={bits}). Larger key does NOT protect against Shor's algorithm."

# Catch-all: bits in (2048, 4096), e.g. 3072 — a real literal outside the
# three named bands above. Same convention as CRYPTO-593 (openssl crate,
# Rust): without it the finding silently disappears.
[[classify]]
id = "CRYPTO-406"
when.api = "^openssl\\.RSA_generate_key$"
when.site_context = ["Call"]
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "RSA_generate_key(bits={bits}). Quantum-vulnerable to Shor regardless of key size."

# ============================================================================
# OpenSSL EVP — EVP_EncryptInit_ex
# ============================================================================

[[extract]]
id = "CPP-010"
language = "c"
query = """
(call_expression
  function: (identifier) @fn (#eq? @fn "EVP_EncryptInit_ex")
  arguments: (argument_list
    (_)
    (call_expression (identifier) @cipher_fn)
    (_)
    (_)))
"""
captures = { fn = "ident", cipher_fn = "ident" }
api = "openssl.EVP_EncryptInit_ex"
description = "OpenSSL EVP_EncryptInit_ex(ctx, cipher_fn(), ...) — cipher type selection."

[[classify]]
id = "CRYPTO-413"
when.api = "^openssl\\.EVP_EncryptInit_ex$"
when.args.cipher_fn = { regex = "EVP_des_ede" }
algorithm_id = "3des"
severity_hint = "critical"
message = "3DES cipher in EVP_EncryptInit_ex (cipher={cipher_fn}). Disallowed for new encryption use (NIST SP 800-131A, 2023); 64-bit block invites Sweet32."
cwe = "CWE-327"

# `EVP_des_ede3_*` is 3DES and is matched by the arm above; everything else
# named EVP_des_* is single DES. Rule order is load-bearing.
[[classify]]
id = "CRYPTO-410"
when.api = "^openssl\\.EVP_EncryptInit_ex$"
when.args.cipher_fn = { regex = "EVP_des" }
algorithm_id = "des"
severity_hint = "critical"
message = "DES cipher in EVP_EncryptInit_ex (cipher={cipher_fn}). Disallowed for new use."
cwe = "CWE-327"

# AES-GCM — split by key size (the cipher_fn names it: EVP_aes_128_gcm, etc.).
[[classify]]
id = "CRYPTO-411"
when.api = "^openssl\\.EVP_EncryptInit_ex$"
when.args.cipher_fn = { regex = "EVP_aes_128_gcm" }
algorithm_id = "aes-128-gcm"
severity_hint = "auto"
message = "AES-128-GCM cipher in EVP_EncryptInit_ex. AEAD mode; 128-bit key may be Grover-weakened."

[[classify]]
id = "CRYPTO-414"
when.api = "^openssl\\.EVP_EncryptInit_ex$"
when.args.cipher_fn = { regex = "EVP_aes_192_gcm" }
algorithm_id = "aes-192-gcm"
severity_hint = "auto"
message = "AES-192-GCM cipher in EVP_EncryptInit_ex. AEAD mode, adequate against Grover."

[[classify]]
id = "CRYPTO-415"
when.api = "^openssl\\.EVP_EncryptInit_ex$"
when.args.cipher_fn = { regex = "EVP_aes_256_gcm" }
algorithm_id = "aes-256-gcm"
severity_hint = "auto"
message = "AES-256-GCM cipher in EVP_EncryptInit_ex. AEAD mode, quantum-safe."

# AES-ECB — same per-key-size split.
[[classify]]
id = "CRYPTO-412"
when.api = "^openssl\\.EVP_EncryptInit_ex$"
when.args.cipher_fn = { regex = "EVP_aes_128_ecb" }
algorithm_id = "aes-128-ecb"
severity_hint = "high"
message = "AES-128-ECB in EVP_EncryptInit_ex. Deterministic mode — leaks plaintext patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-416"
when.api = "^openssl\\.EVP_EncryptInit_ex$"
when.args.cipher_fn = { regex = "EVP_aes_192_ecb" }
algorithm_id = "aes-192-ecb"
severity_hint = "high"
message = "AES-192-ECB in EVP_EncryptInit_ex. Deterministic mode — leaks plaintext patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-417"
when.api = "^openssl\\.EVP_EncryptInit_ex$"
when.args.cipher_fn = { regex = "EVP_aes_256_ecb" }
algorithm_id = "aes-256-ecb"
severity_hint = "high"
message = "AES-256-ECB in EVP_EncryptInit_ex. Deterministic mode — leaks plaintext patterns."
cwe = "CWE-327"

