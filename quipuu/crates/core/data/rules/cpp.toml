# ============================================================================
# OpenSSL SSL — SSL_CTX_set_cipher_list
# ============================================================================

[[extract]]
id = "CPP-030"
language = "c"
query = """
(call_expression
  function: (identifier) @fn (#eq? @fn "SSL_CTX_set_cipher_list")
  arguments: (argument_list
    (_)
    (string_literal) @cipher_str))
"""
captures = { fn = "ident", cipher_str = "literal_string" }
api = "openssl.SSL_CTX_set_cipher_list"
description = "OpenSSL SSL_CTX_set_cipher_list(ctx, str) — TLS cipher suite string."

# The cipher-list grammar (openssl-ciphers(1)) gives `!` permanent-exclude and
# `-` delete, so `DEFAULT:!RC4` *removes* RC4 and must not fire. A weak token
# is enabled only at the start of the string or after `:` or `+`. `aNULL` and
# `eNULL` are covered by `NULL`; listing them separately matched nothing extra.
[[classify]]
id = "CRYPTO-430"
when.api = "^openssl\\.SSL_CTX_set_cipher_list$"
when.args.cipher_str = { regex = "(?i)(^|[\"':+])(RC4|DES|MD5|NULL|EXPORT)" }
algorithm_id = "weak-cipher-suite"
severity_hint = "high"
message = "Weak cipher enabled in SSL_CTX_set_cipher_list('{cipher_str}'). Remove RC4/DES/MD5/NULL/EXPORT ciphers."
cwe = "CWE-326"

[[classify]]
id = "CRYPTO-431"
when.api = "^openssl\\.SSL_CTX_set_cipher_list$"
algorithm_id = "tls-cipher-suite-config"
severity_hint = "low"
message = "SSL_CTX_set_cipher_list('{cipher_str}'). Configures which suites the context offers; the suite actually used is chosen at handshake time, so this finding names no algorithm. Verify the string excludes broken ciphers."

