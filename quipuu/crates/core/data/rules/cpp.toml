# ============================================================================
# liboqs — "heap"/generic API generation (OQS_KEM_new / OQS_SIG_new), the
# algorithm passed as a runtime string via the OQS_{KEM,SIG}_alg_* macros
# (e.g. `#define OQS_KEM_alg_ml_kem_768 "ML-KEM-768"`). tree-sitter sees the
# macro name as a bare identifier argument, not the expanded string literal.
# ============================================================================

[[extract]]
id = "CPP-062"
language = "c"
query = """
(call_expression
  function: (identifier) @fn (#eq? @fn "OQS_KEM_new")
  arguments: (argument_list (identifier) @alg))
"""
captures = { fn = "ident", alg = "ident" }
api = "liboqs.OQS_KEM_new"
description = "liboqs heap-form KEM API — OQS_KEM_new(OQS_KEM_alg_<param-set>) allocates by algorithm-name macro."

[[classify]]
id = "CRYPTO-466"
when.api = "^liboqs\\.OQS_KEM_new$"
when.args.alg = { regex = "^OQS_KEM_alg_ml_kem_512$" }
algorithm_id = "ml-kem-512"
severity_hint = "auto"
message = "liboqs OQS_KEM_new({alg}) — ML-KEM-512, FIPS 203, quantum-resistant."

[[classify]]
id = "CRYPTO-467"
when.api = "^liboqs\\.OQS_KEM_new$"
when.args.alg = { regex = "^OQS_KEM_alg_ml_kem_768$" }
algorithm_id = "ml-kem-768"
severity_hint = "auto"
message = "liboqs OQS_KEM_new({alg}) — ML-KEM-768, FIPS 203, quantum-resistant."

[[classify]]
id = "CRYPTO-468"
when.api = "^liboqs\\.OQS_KEM_new$"
when.args.alg = { regex = "^OQS_KEM_alg_ml_kem_1024$" }
algorithm_id = "ml-kem-1024"
severity_hint = "auto"
message = "liboqs OQS_KEM_new({alg}) — ML-KEM-1024, FIPS 203, quantum-resistant."

# Fallback for every other OQS_KEM_alg_* macro (HQC, BIKE, Classic McEliece,
# FrodoKEM, NTRUPrime, ...) — ordered last so the ML-KEM arms above match
# first. Extracted, not silently dropped: see kem-unattributed.
[[classify]]
id = "CRYPTO-897"
when.api = "^liboqs\\.OQS_KEM_new$"
when.args.alg = { regex = "." }
algorithm_id = "kem-unattributed"
severity_hint = "auto"
message = "liboqs OQS_KEM_new({alg}) — post-quantum KEM, family not in the quipuu algorithm table. Recorded as an unattributed call site — classify it by hand."

[[extract]]
id = "CPP-063"
language = "c"
query = """
(call_expression
  function: (identifier) @fn (#eq? @fn "OQS_SIG_new")
  arguments: (argument_list (identifier) @alg))
"""
captures = { fn = "ident", alg = "ident" }
api = "liboqs.OQS_SIG_new"
description = "liboqs heap-form SIG API — OQS_SIG_new(OQS_SIG_alg_<param-set>) allocates by algorithm-name macro."

[[classify]]
id = "CRYPTO-469"
when.api = "^liboqs\\.OQS_SIG_new$"
when.args.alg = { regex = "^OQS_SIG_alg_ml_dsa_44$" }
algorithm_id = "ml-dsa-44"
severity_hint = "auto"
message = "liboqs OQS_SIG_new({alg}) — ML-DSA-44, FIPS 204, quantum-resistant."

[[classify]]
id = "CRYPTO-470"
when.api = "^liboqs\\.OQS_SIG_new$"
when.args.alg = { regex = "^OQS_SIG_alg_ml_dsa_65$" }
algorithm_id = "ml-dsa-65"
severity_hint = "auto"
message = "liboqs OQS_SIG_new({alg}) — ML-DSA-65, FIPS 204, quantum-resistant."

[[classify]]
id = "CRYPTO-471"
when.api = "^liboqs\\.OQS_SIG_new$"
when.args.alg = { regex = "^OQS_SIG_alg_ml_dsa_87$" }
algorithm_id = "ml-dsa-87"
severity_hint = "auto"
message = "liboqs OQS_SIG_new({alg}) — ML-DSA-87, FIPS 204, quantum-resistant."

# SLH-DSA has no stack-form header in liboqs (no `src/sig_slh_dsa/`, unlike
# ML-DSA's `src/sig_ml_dsa/`) — OQS_SIG_new is its only call shape. Only the
# twelve "pure" parameter sets are covered; liboqs also defines many more
# `slh_dsa_*_prehash_*` (HashSLH-DSA) macros with no corresponding row in
# algorithm-table.toml, left for a future item rather than guessed here.

[[classify]]
id = "CRYPTO-472"
when.api = "^liboqs\\.OQS_SIG_new$"
when.args.alg = { regex = "^OQS_SIG_alg_slh_dsa_pure_sha2_128s$" }
