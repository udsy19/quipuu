when.api = "^liboqs\\.OQS_SIG_new$"
when.args.alg = { regex = "." }
algorithm_id = "sig-unattributed"
severity_hint = "auto"
message = "liboqs OQS_SIG_new({alg}) — post-quantum signature, family not in the quipuu algorithm table. Recorded as an unattributed call site — classify it by hand."

# ============================================================================
# OpenSSL 3.0+ — generic keygen API (EVP_PKEY_CTX_new_from_name /
# EVP_PKEY_Q_keygen), the documented replacement for the deprecated typed
# functions above (RSA_generate_key_ex, EC_KEY_generate_key, ...). The
# algorithm is a runtime string literal argument rather than baked into the
# function name — same shape as liboqs's heap-form API. Both functions share
# one classify pass over the same set of algorithm names; only the argument
# position of the name differs, so the two extract rules populate the same
# `alg` capture. Backlog #Y52.
# ============================================================================

[[extract]]
id = "CPP-064"
language = "c"
query = """
(call_expression
  function: (identifier) @fn (#eq? @fn "EVP_PKEY_CTX_new_from_name")
  arguments: (argument_list
    (_)
    (string_literal) @alg))
"""
captures = { fn = "ident", alg = "literal_string" }
api = "openssl.EVP_PKEY_CTX_new_from_name"
description = "OpenSSL EVP_PKEY_CTX_new_from_name(libctx, name, propq) — generic keygen context by algorithm name string."

[[extract]]
id = "CPP-065"
language = "c"
query = """
(call_expression
  function: (identifier) @fn (#eq? @fn "EVP_PKEY_Q_keygen")
  arguments: (argument_list
    (_)
    (_)
    (string_literal) @alg))
"""
captures = { fn = "ident", alg = "literal_string" }
api = "openssl.EVP_PKEY_Q_keygen"
description = "OpenSSL EVP_PKEY_Q_keygen(libctx, propq, type, ...) — one-shot generic keygen by algorithm name string."

[[classify]]
id = "CRYPTO-484"
when.api = "^openssl\\.(EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$"
when.args.alg = { regex = "(?i)^RSA$" }
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "OpenSSL generic keygen(\"{alg}\") — RSA key generation. Modulus size is set separately (OSSL_PKEY_PARAM_RSA_BITS or an EVP_PKEY_CTX_set_rsa_keygen_bits call this rule does not see); quantum-vulnerable to Shor regardless of size."

[[classify]]
id = "CRYPTO-485"
when.api = "^openssl\\.(EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$"
when.args.alg = { regex = "(?i)^EC$" }
algorithm_id = "ecdsa-unattributed"
severity_hint = "auto"
# The curve is set separately (OSSL_PKEY_PARAM_GROUP_NAME or an
# EVP_PKEY_CTX_set_group_name call), and this API generates an EC key for
# either signing or exchange — same ambiguity the crypto_sign_keypair pack
# above resolves by header, and the same reasoning as CRYPTO-211 (java.toml)
# for KeyPairGenerator.getInstance("EC"): Shor breaks every curve, so the
# migration verdict is exact even though the classical strength is not.
message = "OpenSSL generic keygen(\"{alg}\") — EC key generation, curve not stated at this call. Quantum-vulnerable at every curve. Replace with ML-DSA-65 (signing) or ML-KEM-768 (exchange)."

[[classify]]
id = "CRYPTO-486"
when.api = "^openssl\\.(EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$"
when.args.alg = { regex = "(?i)^DH$" }
algorithm_id = "dh-unattributed"
severity_hint = "auto"
message = "OpenSSL generic keygen(\"{alg}\") — Diffie-Hellman key generation, group size not stated at this call. Quantum-vulnerable regardless of size."

[[classify]]
id = "CRYPTO-487"
when.api = "^openssl\\.(EVP_PKEY_CTX_new_from_name|EVP_PKEY_Q_keygen)$"
when.args.alg = { regex = "(?i)^ML-KEM-512$" }
algorithm_id = "ml-kem-512"
severity_hint = "auto"
message = "OpenSSL generic keygen(\"{alg}\") — ML-KEM-512, FIPS 203, quantum-resistant."

