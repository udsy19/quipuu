# OpenMLS (Cryspen) — `Ciphersuite::MLS_*` enum variants (draft-ietf-mls-pq-
# ciphersuites, WG Draft; docs.rs/openmls/latest/openmls/prelude/enum.
# Ciphersuite.html, verified 2026-09-02) name the MLS protocol's hybrid/PQC
# ciphersuites literally, e.g. `Ciphersuite::MLS_192_MLKEM768_AES256GCM_
# SHA384_MLDSA65`. Gated behind a Cargo feature flag named after the draft —
# experimental, same tier `#Y95`'s .NET CompositeMLDsa shipped at. A bare
# path expression, not a call, so the matcher hooks `scoped_identifier`
# directly (`match_rust_openmls_ciphersuite` in scanner.rs) rather than
# riding the call-expression dispatch every other Rust rule in this file
# uses. Only the ciphersuite's KEM component gets an algorithm id — the
# accompanying signature scheme (Ed25519/P256/P384/ML-DSA) is a distinct
# primitive within the same suite name and not separately attributed here,
# same restraint `#Y113`'s LMS-only OpenSSL rule and CompositeMLKem's
# ml-kem-unattributed fallback both used. Order matters: the X25519-hybrid
# and XWING arms must precede the plain MLKEM768/MLKEM1024 arms below since
# classify rules stop at the first match. Backlog `#Y114`.
[[classify]]
id = "CRYPTO-1138"
when.api = "^openmls\\.Ciphersuite$"
when.args.variant = { regex = "XWING" }
algorithm_id = "x-wing"
severity_hint = "auto"
message = "OpenMLS Ciphersuite::{variant} — X-Wing (hybrid X25519 + ML-KEM-768) HPKE KEM. Migrated key-establishment."

[[classify]]
id = "CRYPTO-1139"
when.api = "^openmls\\.Ciphersuite$"
when.args.variant = { regex = "MLKEM768X25519" }
algorithm_id = "x25519-mlkem768"
severity_hint = "auto"
message = "OpenMLS Ciphersuite::{variant} — hybrid X25519 + ML-KEM-768 (FIPS 203) HPKE KEM. Migrated key-establishment."

[[classify]]
id = "CRYPTO-1140"
when.api = "^openmls\\.Ciphersuite$"
when.args.variant = { regex = "MLKEM1024" }
algorithm_id = "ml-kem-1024"
severity_hint = "auto"
message = "OpenMLS Ciphersuite::{variant} — non-hybrid ML-KEM-1024 (FIPS 203) HPKE KEM."

[[classify]]
id = "CRYPTO-1141"
when.api = "^openmls\\.Ciphersuite$"
when.args.variant = { regex = "MLKEM768" }
algorithm_id = "ml-kem-768"
severity_hint = "auto"
message = "OpenMLS Ciphersuite::{variant} — non-hybrid ML-KEM-768 (FIPS 203) HPKE KEM."

# ============================================================================
# oqs (liboqs-rust) — Kem::new(Algorithm)/Sig::new(Algorithm)
# ============================================================================
# open-quantum-safe/liboqs-rust, published as `oqs` on crates.io — the
# official liboqs Rust binding. `python.toml` and `cpp.toml` already cover
# liboqs's Python and C bindings, including unattributed fallbacks for
# non-ML-KEM/ML-DSA families; this closes the same gap for Rust. Both
# constructors take the parameter set as their sole argument — an
# `Algorithm` enum variant, the same path-expression-as-argument shape
# rcgen::KeyPair::generate_for and aws-lc-rs's constructors use above — so
# `rust_arg_const_name` captures it the same way. Where the argument is a
# variable there is no capture and the classify layer falls through to the
# unattributed sentinel. Backlog #Y117.

[[classify]]
id = "CRYPTO-1142"
when.api = "^oqs\\.kem\\.Kem\\.new$"
when.args.alg = "MlKem512"
algorithm_id = "ml-kem-512"
severity_hint = "auto"
message = "oqs Kem::new(Algorithm::MlKem512) — ML-KEM-512, FIPS 203, quantum-resistant."

[[classify]]
id = "CRYPTO-1143"
when.api = "^oqs\\.kem\\.Kem\\.new$"
when.args.alg = "MlKem768"
algorithm_id = "ml-kem-768"
severity_hint = "auto"
message = "oqs Kem::new(Algorithm::MlKem768) — ML-KEM-768, FIPS 203, quantum-resistant."

[[classify]]
id = "CRYPTO-1144"
when.api = "^oqs\\.kem\\.Kem\\.new$"
when.args.alg = "MlKem1024"
algorithm_id = "ml-kem-1024"
severity_hint = "auto"
message = "oqs Kem::new(Algorithm::MlKem1024) — ML-KEM-1024, FIPS 203, quantum-resistant."

# The fallback, and the only arm that fires when the argument is a variable
# or a non-ML-KEM Algorithm variant. It must stay last: the classify layer
# takes the first matching rule.
[[classify]]
id = "CRYPTO-1145"
when.api = "^oqs\\.kem\\.Kem\\.new$"
algorithm_id = "kem-unattributed"
severity_hint = "auto"
message = "oqs Kem::new(ALG) — post-quantum KEM instantiated; ALG is not a recognised ML-KEM literal here, so the parameter set is unknown."

