# Go detection rules — two-layer (extract → classify), per D-07
#
# LAYER 1: [[extract]] — find AST sites with tree-sitter S-expression queries,
#          capture parameter values (literal ints, type names, strings).
# LAYER 2: [[classify]] — given extracted (api, arg0, arg1, ...) tuples, emit
#          a finding with algorithm_id and severity hints.
#
# The classify layer's tuple-based pattern draws on cryptobom-forge's
# (Santandersecurityresearch/cryptobom-forge, not CBOMkit) rule files
# (knowledge/sources/cryptobom-forge-cryptocheck_*.{yml,json}) as prior art;
# the two schemas use different field names and are not file-format compatible.
#
# Field reference:
#   [[extract]]
#     id          stable rule id, format: GO-NNN
#     language    "go"  (matches tree-sitter grammar)
#     query       tree-sitter S-expression
#     captures    map of capture-name → kind (literal_int | literal_string | type | ident)
#     api         logical API name we matched (used by the classify layer)
#     description human-readable
#
#   [[classify]]
#     id          CRYPTO-NNN (SARIF rule id)
#     when.api    extract.api regex
#     when.args   tuple match on captured values; supports literals, ranges, regexes
#     algorithm_id  from data/algorithm-table.toml
#     severity_hint  "critical" | "high" | "medium" | "low" | "auto"
#                   ("auto" defers to QuantumRiskScore)
#     message     SARIF message text; supports {arg0}, {arg1}, ... substitution
#     help_uri    docs URL (filled by build script)
#     cwe         CWE identifier where applicable

# ============================================================================
# crypto/rsa — RSA key generation
# ============================================================================

[[extract]]
id = "GO-001"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg
    field: (field_identifier) @fn (#eq? @fn "GenerateKey"))
  arguments: (argument_list
    (identifier) @rng
    (int_literal) @bits))
(#eq? @pkg "rsa")
"""
captures = { pkg = "ident", fn = "ident", rng = "ident", bits = "literal_int" }
api = "crypto/rsa.GenerateKey"
description = "RSA key generation via crypto/rsa.GenerateKey(rand.Reader, bits)."

[[classify]]
id = "CRYPTO-001"
when.api = "^crypto/rsa\\.GenerateKey$"
when.args.bits = { lt = 2048 }
algorithm_id = "rsa-undersized"
severity_hint = "critical"
message = "RSA key generation with key size {bits} bits is below the 2048-bit minimum and classically insecure."
cwe = "CWE-326"

[[classify]]
id = "CRYPTO-002"
when.api = "^crypto/rsa\\.GenerateKey$"
when.args.bits = 2048
algorithm_id = "rsa-2048"
severity_hint = "auto"
message = "RSA-2048 key generation. Quantum-vulnerable: NIST IR 8547 deprecates after 2030, disallows after 2035."

[[classify]]
id = "CRYPTO-003"
when.api = "^crypto/rsa\\.GenerateKey$"
when.args.bits = 3072
algorithm_id = "rsa-3072"
severity_hint = "auto"
message = "RSA-3072 key generation. Quantum-vulnerable to Shor's algorithm regardless of key size."

[[classify]]
id = "CRYPTO-004"
when.api = "^crypto/rsa\\.GenerateKey$"
when.args.bits = { ge = 4096 }
algorithm_id = "rsa-4096"
severity_hint = "auto"
message = "RSA-{bits} key generation. Larger key does NOT protect against Shor's algorithm."

# GO-001's query requires the bit-length argument to be an inline int literal.
# `rsa.GenerateKey(rand.Reader, bits)` with `bits` a variable or expression
# still matches the api but captures no `bits`, so none of CRYPTO-001..004
# fire. Without this arm the call site vanished from the report entirely
# instead of degrading to an unattributed finding — the same shape the
# WebCrypto and Node generateKeyPair packs already handle. Placed last so the
# literal-bits arms above still win when the size is known.
[[classify]]
id = "CRYPTO-005"
when.api = "^crypto/rsa\\.GenerateKey$"
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "RSA key generation via crypto/rsa.GenerateKey with a non-literal key size — the value is not statically knowable at this call site. Quantum-vulnerable to Shor's algorithm regardless of size."

# GO-001 only sees the constructor. A signer/verifier that receives an
# already-generated *rsa.PrivateKey/*rsa.PublicKey never calls GenerateKey in
# the same file — kubernetes and vault's pkcs7 helper are both this shape —
# and the operation site vanished from the report entirely. The key size is
# not stated at a Sign/Verify/Encrypt/Decrypt call, so this degrades straight
# to the unattributed sentinel rather than guessing a size.
[[extract]]
id = "GO-002"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "rsa")
    field: (field_identifier) @fn (#match? @fn "^(SignPKCS1v15|VerifyPKCS1v15|SignPSS|VerifyPSS|EncryptOAEP|DecryptOAEP|EncryptPKCS1v15|DecryptPKCS1v15)$")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/rsa.Op"
description = "RSA sign/verify/encrypt/decrypt operation (rsa.SignPKCS1v15, VerifyPSS, EncryptOAEP, …) — the key size is not stated at this call site."

[[classify]]
id = "CRYPTO-006"
when.api = "^crypto/rsa\\.Op$"
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "RSA operation via crypto/rsa.{fn} on a key received rather than generated here — the key size is not statically knowable at this call site. Quantum-vulnerable to Shor's algorithm regardless of size."

# ============================================================================
# crypto/ecdsa — ECDSA key generation
# ============================================================================

[[extract]]
id = "GO-010"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg
    field: (field_identifier) @fn (#eq? @fn "GenerateKey"))
  arguments: (argument_list
    (call_expression
      function: (selector_expression
        operand: (identifier) @curve_pkg (#eq? @curve_pkg "elliptic")
        field: (field_identifier) @curve_fn))
    (identifier) @rng))
(#eq? @pkg "ecdsa")
"""
captures = { pkg = "ident", fn = "ident", curve_pkg = "ident", curve_fn = "ident", rng = "ident" }
api = "crypto/ecdsa.GenerateKey"
description = "ECDSA key generation via crypto/ecdsa.GenerateKey(elliptic.P256(), rand.Reader)."

[[classify]]
id = "CRYPTO-010"
when.api = "^crypto/ecdsa\\.GenerateKey$"
when.args.curve_fn = "P224"
algorithm_id = "ecdsa-p224"
severity_hint = "critical"
message = "ECDSA P-224 is below the 128-bit security floor (NIST SP 800-131A)."

[[classify]]
id = "CRYPTO-011"
when.api = "^crypto/ecdsa\\.GenerateKey$"
when.args.curve_fn = "P256"
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "ECDSA P-256 — quantum-vulnerable to Shor. Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-012"
when.api = "^crypto/ecdsa\\.GenerateKey$"
when.args.curve_fn = "P384"
algorithm_id = "ecdsa-p384"
severity_hint = "auto"
message = "ECDSA P-384 — quantum-vulnerable. Replace with ML-DSA-87."

[[classify]]
id = "CRYPTO-013"
when.api = "^crypto/ecdsa\\.GenerateKey$"
when.args.curve_fn = "P521"
algorithm_id = "ecdsa-p521"
severity_hint = "auto"
message = "ECDSA P-521 — quantum-vulnerable. Replace with ML-DSA-87."

# GO-010's query requires the curve argument to be an inline `elliptic.PXXX()`
# call. `ecdsa.GenerateKey(curve, rand.Reader)` with `curve` a variable still
# matches the api but captures no `curve_fn`, so none of CRYPTO-010..013 fire
# and the call site vanished instead of degrading. Same fix and same ordering
# rationale as CRYPTO-005 above.
[[classify]]
id = "CRYPTO-014"
when.api = "^crypto/ecdsa\\.GenerateKey$"
algorithm_id = "ecdsa-unattributed"
severity_hint = "auto"
message = "ECDSA key generation via crypto/ecdsa.GenerateKey with a non-inline curve expression — the curve is not statically knowable at this call site. Quantum-vulnerable at every curve — replace with ML-DSA."

# Same gap as GO-002, one crate over: ecdsa.Sign/SignASN1/Verify/VerifyASN1
# take an *ecdsa.PrivateKey/*ecdsa.PublicKey with no curve at the call site —
# kubernetes' certificate validation path is exactly this shape (VerifyASN1
# on a key parsed from a CSR). Same fix, same degrade-to-unattributed answer
# CRYPTO-014 already uses for the constructor's non-literal curve case.
[[extract]]
id = "GO-011"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "ecdsa")
    field: (field_identifier) @fn (#match? @fn "^(Sign|SignASN1|Verify|VerifyASN1)$")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/ecdsa.Op"
description = "ECDSA sign/verify operation (ecdsa.Sign, SignASN1, Verify, VerifyASN1) — the curve is bound to the key, not stated at this call site."

[[classify]]
id = "CRYPTO-015"
when.api = "^crypto/ecdsa\\.Op$"
algorithm_id = "ecdsa-unattributed"
severity_hint = "auto"
message = "ECDSA operation via crypto/ecdsa.{fn} on a key received rather than generated here — the curve is not statically knowable at this call site. Quantum-vulnerable at every curve — replace with ML-DSA.{pq_note}"

# ============================================================================
# crypto/dsa — classical (non-elliptic) DSA. GenerateKey takes an already-
# parameterised *dsa.PrivateKey with no prime/subprime size at the call site,
# and Sign/Verify carry no parameter either — same "unattributed" shape ecdsa's
# operation sites use above, sharing the `dsa-unattributed` sentinel Java's
# KeyPairGenerator.getInstance("DSA") already publishes (java.toml CRYPTO-212).
# ============================================================================

[[extract]]
id = "GO-012"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "dsa")
    field: (field_identifier) @fn (#eq? @fn "GenerateKey")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/dsa.GenerateKey"
description = "DSA key generation via crypto/dsa.GenerateKey — the parameter size lives in a separate dsa.GenerateParameters call, not here."

[[classify]]
id = "CRYPTO-016"
when.api = "^crypto/dsa\\.GenerateKey$"
algorithm_id = "dsa-unattributed"
severity_hint = "auto"
message = "DSA key generation via crypto/dsa.GenerateKey — deprecated for new use (FIPS 186-5) and broken by Shor at every parameter size. Replace with ML-DSA-65."

[[extract]]
id = "GO-013"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "dsa")
    field: (field_identifier) @fn (#match? @fn "^(Sign|Verify)$")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/dsa.Op"
description = "DSA sign/verify operation."

[[classify]]
id = "CRYPTO-017"
when.api = "^crypto/dsa\\.Op$"
algorithm_id = "dsa-unattributed"
severity_hint = "auto"
message = "DSA {fn} operation — broken by Shor and already deprecated classically (FIPS 186-5). Replace with ML-DSA-65."

# ============================================================================
# crypto/ed25519 / crypto/ecdh
# ============================================================================

[[extract]]
id = "GO-020"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "ed25519")
    field: (field_identifier) @fn (#eq? @fn "GenerateKey")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/ed25519.GenerateKey"
description = "Ed25519 keypair generation."

[[classify]]
id = "CRYPTO-020"
when.api = "^crypto/ed25519\\.GenerateKey$"
algorithm_id = "ed25519"
severity_hint = "auto"
message = "Ed25519 — quantum-vulnerable to Shor. Replace with ML-DSA-65."

# Ed25519 has no parameter set to lose — unlike rsa/ecdsa's operation sites,
# this needs no unattributed fallback, just the same algorithm_id the
# constructor already uses. golang-jwt/jwt's EdDSA verifier calls
# ed25519.Verify directly and never GenerateKey in the same file.
[[extract]]
id = "GO-021"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "ed25519")
    field: (field_identifier) @fn (#match? @fn "^(Sign|Verify)$")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/ed25519.Op"
description = "Ed25519 sign/verify operation."

[[classify]]
id = "CRYPTO-021"
when.api = "^crypto/ed25519\\.Op$"
algorithm_id = "ed25519"
severity_hint = "auto"
message = "Ed25519 {fn} operation — quantum-vulnerable to Shor. Replace with ML-DSA-65.{pq_note}"

# ============================================================================
# crypto/tls — TLS config
# ============================================================================

[[extract]]
id = "GO-030"
language = "go"
query = """
(keyed_element
  (literal_element (identifier) @key (#eq? @key "MinVersion"))
  (literal_element (selector_expression
    operand: (identifier) @tls_pkg (#eq? @tls_pkg "tls")
    field: (field_identifier) @version)))
"""
captures = { key = "ident", tls_pkg = "ident", version = "ident" }
api = "crypto/tls.Config.MinVersion"
description = "TLS minimum version setting."

[[classify]]
id = "CRYPTO-030"
when.api = "^crypto/tls\\.Config\\.MinVersion$"
when.args.version = { regex = "^(VersionSSL30|VersionTLS10|VersionTLS11)$" }
# A protocol-version field names no cipher. `tls-legacy-protocol` says exactly
# that, where the previous `rsa-2048` placeholder asserted an algorithm the
# source never mentions.
algorithm_id = "tls-legacy-protocol"
severity_hint = "critical"
message = "TLS minimum version is {version} — TLS < 1.2 is broken (POODLE, BEAST). Use tls.VersionTLS12 or tls.VersionTLS13."
cwe = "CWE-326"

# CipherSuites whitelisting (string-literal capture)

[[extract]]
id = "GO-031"
language = "go"
query = """
(keyed_element
  (literal_element (identifier) @key (#eq? @key "CipherSuites"))
  (literal_element (composite_literal
    body: (literal_value (literal_element
      (selector_expression
        operand: (identifier) @tls_pkg (#eq? @tls_pkg "tls")
        field: (field_identifier) @suite))))))
"""
captures = { key = "ident", tls_pkg = "ident", suite = "ident" }
api = "crypto/tls.Config.CipherSuites"
description = "TLS cipher suite list."

# CurvePreferences — TLS key-exchange group selection (the PQC migration target).
# The slice `[]tls.CurveID{tls.X25519, tls.CurveP256, ...}` is matched by its
# slice type (qualified_type tls.CurveID) and each element produces one extract
# event. The query binds @curve to one selector_expression per slice element.

[[extract]]
id = "GO-032"
language = "go"
query = """
(composite_literal
  type: (slice_type
    element: (qualified_type
      package: (package_identifier) @tls_t (#eq? @tls_t "tls")
      name: (type_identifier) @typ_name (#eq? @typ_name "CurveID")))
  body: (literal_value
    (literal_element
      (selector_expression
        operand: (identifier) @tls_pkg (#eq? @tls_pkg "tls")
        field: (field_identifier) @curve))))
"""
captures = { tls_t = "ident", typ_name = "ident", tls_pkg = "ident", curve = "ident" }
api = "crypto/tls.Config.CurvePreferences"
description = "TLS key-exchange group preference list (tls.CurveID)."

[[classify]]
id = "CRYPTO-032"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "X25519"
algorithm_id = "x25519"
severity_hint = "auto"
message = "TLS curve X25519 — classical ECDH, vulnerable to Shor. Replace with tls.X25519MLKEM768 (Go 1.24+)."

[[classify]]
id = "CRYPTO-033"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "CurveP256"
algorithm_id = "ecdh-p256"
severity_hint = "auto"
message = "TLS curve P-256 ECDH — quantum-vulnerable. Add tls.X25519MLKEM768 first in the list (Go 1.24+)."

[[classify]]
id = "CRYPTO-034"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "CurveP384"
algorithm_id = "ecdh-p384"
severity_hint = "auto"
message = "TLS curve P-384 ECDH — quantum-vulnerable. Add tls.X25519MLKEM768 / tls.SecP384r1MLKEM1024 first."

[[classify]]
id = "CRYPTO-035"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "CurveP521"
algorithm_id = "ecdh-p521"
severity_hint = "auto"
message = "TLS curve P-521 ECDH — quantum-vulnerable. Migrate to ML-KEM hybrid groups."

# The migrated half of the same list. Without these, a config that already
# names tls.X25519MLKEM768 reports only its classical neighbours and the PQC
# group is invisible — the tool asks for a migration it cannot see you make,
# and no adoption percentage over this pack could mean anything. The extract
# above already emits one event per slice element, so these need no matcher:
# the arms were simply missing. Names are the IANA registry spellings
# (knowledge/sources/iana-tls-supported-groups.csv), which is what Go's
# crypto/tls CurveID constants use.

[[classify]]
id = "CRYPTO-044"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "X25519MLKEM768"
algorithm_id = "x25519-mlkem768"
severity_hint = "auto"
message = "TLS group X25519MLKEM768 — hybrid X25519 + ML-KEM-768 (FIPS 203). Migrated key-establishment config."

[[classify]]
id = "CRYPTO-045"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "SecP256r1MLKEM768"
algorithm_id = "secp256r1-mlkem768"
severity_hint = "auto"
message = "TLS group SecP256r1MLKEM768 — hybrid secp256r1 + ML-KEM-768 (FIPS 203). Migrated key-establishment config."

[[classify]]
id = "CRYPTO-046"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "SecP384r1MLKEM1024"
algorithm_id = "secp384r1-mlkem1024"
severity_hint = "auto"
message = "TLS group SecP384r1MLKEM1024 — hybrid secp384r1 + ML-KEM-1024 (FIPS 203). Meets the CNSA 2.0 ML-KEM parameter set."

# Pure (non-hybrid) ML-KEM-1024 — new in Go 1.27, backlog #Y30's same-commit
# fall-through. Same extract, no new classify mechanism: the group name was
# simply missing from the arm list above.
[[classify]]
id = "CRYPTO-047"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "MLKEM1024"
algorithm_id = "ml-kem-1024"
severity_hint = "auto"
message = "TLS group MLKEM1024 — pure ML-KEM-1024 (FIPS 203, non-hybrid, Go 1.27+). Migrated key-establishment config."

[[classify]]
id = "CRYPTO-048"
when.api = "^crypto/tls\\.Config\\.CurvePreferences$"
when.args.curve = "X25519Kyber768Draft00"
algorithm_id = "x25519-kyber768-draft00"
severity_hint = "auto"
message = "TLS group X25519Kyber768Draft00 — pre-standard Kyber, obsoleted by draft-ietf-tls-ecdhe-mlkem. Replace with tls.X25519MLKEM768."

