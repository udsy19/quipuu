message = "JWT alg=HS512 — HMAC-SHA512. Symmetric; not quantum-broken but inventory for key rotation planning."

# alg=none — signature verification disabled; critical CWE-347
#
# The extract layer only emits this api when the name is declared beside
# another JOSE name — see go_alg_name_is_corroborated() in scanner.rs. Without
# that, an enum constant spelled "none" reaches an auditor as a disabled
# signature check.
[[classify]]
id = "CRYPTO-740"
when.api = "^go\\.alg-(switch|register)\\.none$"
when.site_context = ["Call", "StructLiteral", "StringConstant"]
algorithm_id = "jwt-alg-none"
severity_hint = "critical"
message = "JWT alg=none — signature verification is disabled. CVE-2015-9235 class vulnerability."
cwe = "CWE-347"

# RSA-OAEP key-wrap algorithms
[[classify]]
id = "CRYPTO-750"
when.api = "^go\\.alg-(switch|register)\\.RSA-OAEP$"
when.site_context = ["Call", "StructLiteral", "StringConstant"]
algorithm_id = "rsa-oaep"
severity_hint = "auto"
message = "JWE alg=RSA-OAEP — RSA-OAEP key encryption. Quantum-vulnerable to Shor's algorithm."

[[classify]]
