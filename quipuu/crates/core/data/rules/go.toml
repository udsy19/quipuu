# ============================================================================
# github.com/cloudflare/circl — Go's own PQC library (backlog #Y20, second
# item). Unlike WebCrypto's algorithm-name string argument, circl's ML-DSA and
# ML-KEM parameter sets are picked by which package is imported (mldsa44 vs.
# mldsa65 vs. mldsa87), so the "arg-literal" capture here is the package
# identifier itself, read off the callee text in match_go_callee. SLH-DSA is
# the exception — one package, twelve parameter sets selected by an `ID`
# argument — so its capture is a real argument read, same shape as jwt's
# `alg` capture above.
# ============================================================================

