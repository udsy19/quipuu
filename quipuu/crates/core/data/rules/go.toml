# ============================================================================
# crypto/aes — AES with mode detection requires a multi-step extract.
# These are simplified for v1 (key size via crypto/aes.NewCipher arg length).
# ============================================================================

[[extract]]
id = "GO-040"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "aes")
    field: (field_identifier) @fn (#eq? @fn "NewCipher"))
  arguments: (argument_list (_) @key_arg))
"""
captures = { pkg = "ident", fn = "ident", key_arg = "ident" }
api = "crypto/aes.NewCipher"
description = "AES cipher instantiation; key size determined by key byte slice length."

# Note: the classify layer for AES needs key-length flow analysis at v1.5; ship
# detection now, mark confidence low until the analysis lands.

[[classify]]
id = "CRYPTO-040"
when.api = "^crypto/aes\\.NewCipher$"
algorithm_id = "aes-unattributed"
severity_hint = "low"
message = "AES cipher in use. aes.NewCipher takes its key size from the slice passed in and names no mode — neither parameter is at this call site. Confirm a 32-byte key for AES-256 and an AEAD wrapper (cipher.NewGCM)."

# crypto/des and crypto/rc4 — classically broken symmetric primitives.
# Both packages exist in the Go stdlib only for legacy interop; every call is
# a finding, and neither takes a parameter that could change that.

[[extract]]
id = "GO-041"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "des")
    field: (field_identifier) @fn (#eq? @fn "NewCipher")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/des.NewCipher"
description = "Single-DES cipher instantiation."

[[classify]]
id = "CRYPTO-041"
when.api = "^crypto/des\\.NewCipher$"
algorithm_id = "des"
severity_hint = "critical"
message = "Single DES — 56-bit key, brute-forced since 1998. Disallowed by NIST SP 800-131A. Replace with AES-256-GCM."
cwe = "CWE-327"

[[extract]]
id = "GO-042"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "des")
    field: (field_identifier) @fn (#eq? @fn "NewTripleDESCipher")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/des.NewTripleDESCipher"
description = "Triple-DES cipher instantiation."

[[classify]]
id = "CRYPTO-042"
when.api = "^crypto/des\\.NewTripleDESCipher$"
algorithm_id = "3des"
severity_hint = "critical"
message = "3DES disallowed for new encryption use (NIST SP 800-131A, 2023) — 64-bit block invites Sweet32. Replace with AES-256-GCM."
cwe = "CWE-327"

[[extract]]
id = "GO-043"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#eq? @pkg "rc4")
    field: (field_identifier) @fn (#eq? @fn "NewCipher")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/rc4.NewCipher"
description = "RC4 stream cipher instantiation."

[[classify]]
id = "CRYPTO-043"
when.api = "^crypto/rc4\\.NewCipher$"
algorithm_id = "rc4"
severity_hint = "critical"
message = "RC4 is broken — biased keystream, practical plaintext recovery (RFC 7465 bans it in TLS). Replace with ChaCha20-Poly1305 or AES-256-GCM."
cwe = "CWE-327"

# ============================================================================
# crypto/md5 / crypto/sha1 — classically broken
# ============================================================================

[[extract]]
id = "GO-050"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @pkg (#match? @pkg "^(md5|sha1)$")
    field: (field_identifier) @fn (#eq? @fn "New")))
"""
captures = { pkg = "ident", fn = "ident" }
api = "crypto/md5_sha1.New"
description = "MD5 or SHA-1 hash construction."

[[classify]]
id = "CRYPTO-050"
when.api = "^crypto/md5_sha1\\.New$"
when.args.pkg = "md5"
algorithm_id = "md5"
severity_hint = "critical"
message = "MD5 is classically broken (collision attacks since 2004). Use SHA-256 or stronger."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-051"
when.api = "^crypto/md5_sha1\\.New$"
when.args.pkg = "sha1"
algorithm_id = "sha-1"
severity_hint = "critical"
message = "SHA-1 is classically broken (SHAttered, 2017). Use SHA-256 or stronger."
cwe = "CWE-327"

# ============================================================================
# golang-jwt / jwt-go — JWT signing
# ============================================================================

[[extract]]
id = "GO-060"
language = "go"
query = """
(call_expression
  function: (selector_expression
    operand: (identifier) @jwt (#match? @jwt "^(jwt|jwt_go|jwtgo)$")
    field: (field_identifier) @fn (#eq? @fn "NewWithClaims"))
  arguments: (argument_list
    (selector_expression
      operand: (identifier) @method_pkg
      field: (field_identifier) @alg)
    (_)))
"""
captures = { jwt = "ident", fn = "ident", method_pkg = "ident", alg = "ident" }
api = "jwt.NewWithClaims"
description = "JWT signing method (RS256, ES256, EdDSA, …)."

[[classify]]
id = "CRYPTO-060"
when.api = "^jwt\\.NewWithClaims$"
when.args.alg = { regex = "^(SigningMethodNone|None)$" }
algorithm_id = "jwt-alg-none"
severity_hint = "critical"
message = "JWT alg=none — signature verification disabled. CVE-2015-9235 class."
cwe = "CWE-347"

[[classify]]
id = "CRYPTO-061"
when.api = "^jwt\\.NewWithClaims$"
when.args.alg = { regex = "^(SigningMethodRS|RS)256$" }
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "auto"
message = "JWT signed with RS256 — RSA-PKCS1 signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-062"
when.api = "^jwt\\.NewWithClaims$"
when.args.alg = { regex = "^(SigningMethodES|ES)256$" }
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "JWT signed with ES256 — ECDSA P-256, quantum-vulnerable."

[[classify]]
id = "CRYPTO-063"
when.api = "^jwt\\.NewWithClaims$"
when.args.alg = { regex = "^(SigningMethodEdDSA|EdDSA)$" }
algorithm_id = "ed25519"
severity_hint = "auto"
message = "JWT signed with EdDSA (Ed25519) — quantum-vulnerable."

# ============================================================================
# Phase 7: Go string-table dispatch — `switch alg { case "RS256": ... }`
#
# V3 corpus run: 22/25 Go projects produced zero findings because JWT/JOSE
# libraries route algorithm choice through switch-on-string, not direct API
# calls. These rules classify the go.alg-switch.* raw matches emitted by
# match_go_alg_switch() in scanner.rs.
# ============================================================================

# RSA-PKCS1 signatures (RS*)
[[classify]]
id = "CRYPTO-700"
when.api = "^go\\.alg-(switch|register)\\.RS256$"
when.site_context = ["Call", "StructLiteral", "StringConstant"]
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "auto"
message = "JWT alg=RS256 — RSA-PKCS1-SHA256. Quantum-vulnerable to Shor's algorithm."

[[classify]]
id = "CRYPTO-701"
when.api = "^go\\.alg-(switch|register)\\.RS384$"
