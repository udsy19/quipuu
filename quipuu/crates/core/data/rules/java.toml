# ============================================================================
# javax.crypto.KeyGenerator.getInstance — BouncyCastle CompositeKEMs only
# (#Y101). `javax.crypto.KeyGenerator` has no general extraction in this file
# (most of its calls are AES/ChaCha20/HMAC symmetric key generation, out of
# the PQC migration story) — this block is scoped narrowly to the literal
# algorithm-name strings BC 1.85.2's own CompositeKEMs.Mappings registers
# under `KeyGenerator.<name>`, not a general KeyGenerator policy. A call
# whose literal does not match one of these arms is extracted and then
# matches no classify rule, which produces no finding at all, exactly like
# every other unmatched literal in this file.
#
# Verified directly against the release tag matching the published Maven
# Central artifact (`bcprov-jdk18on` 1.85.2, `bc-java` tag `r1rv85v2`), not a
# changelog or a prior cycle's count: `compositekem/CompositeIndex.java`'s
