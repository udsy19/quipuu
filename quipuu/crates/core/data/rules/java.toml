when.api = "^org\\.bouncycastle\\.AESEngine$"
algorithm_id = "aes-unattributed"
severity_hint = "auto"
message = "BouncyCastle AESEngine instantiated. A raw AES block cipher: it names no mode and takes its key size from init(). Confirm both — an unwrapped AESEngine is ECB."

[[classify]]
