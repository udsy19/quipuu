# ============================================================================
# java.security.KeyPairGenerator.getInstance
# ============================================================================

[[extract]]
id = "JAV-010"
language = "java"
query = """
(method_invocation
  object: (identifier) @cls (#eq? @cls "KeyPairGenerator")
  name: (identifier) @fn (#eq? @fn "getInstance")
  arguments: (argument_list (string_literal) @algo))
"""
captures = { cls = "ident", fn = "ident", algo = "literal_string" }
api = "java.security.KeyPairGenerator.getInstance"
description = "Java KeyPairGenerator.getInstance(algo) — asymmetric keypair generation."

[[classify]]
id = "CRYPTO-210"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?RSA\"?$" }
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "RSA keypair generator. Quantum-vulnerable: NIST IR 8547 deprecates after 2030."

[[classify]]
id = "CRYPTO-211"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?EC\"?$" }
algorithm_id = "ecdsa-unattributed"
severity_hint = "auto"
# The curve is determined by the subsequent .initialize(ECGenParameterSpec)
# call, which this matcher cannot see — so the id names no curve. It used to
# name P-256 "as the most common curve", which reported secp256k1 keys as
# NIST P-256. Auditors should read the initialize() call; Shor breaks all of
# them, so only the classical strength and the threat model differ.
message = "EC keypair generator — the curve is chosen at .initialize(ECGenParameterSpec(...)) and is not stated here. Quantum-vulnerable at every curve. Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-212"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?DSA\"?$" }
algorithm_id = "dsa-unattributed"
severity_hint = "high"
message = "DSA keypair generator. Deprecated for new use (FIPS 186-5)."

# --- PQC: FIPS 203 / 204, standard JCA names since JDK 24 (JEP 496 / 497) --
# KeyPairGenerator.getInstance generates both ML-KEM (JEP 496) and ML-DSA
# (JEP 497) key pairs; the parameter set is fully in the name, so these need
# no refining capture, matching the WebCrypto PQC arms in javascript.toml.

[[classify]]
id = "CRYPTO-215"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?ML-KEM-512\"?$" }
algorithm_id = "ml-kem-512"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — FIPS 203, quantum-resistant. Migrated key-establishment call site."

[[classify]]
id = "CRYPTO-216"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?ML-KEM-768\"?$" }
algorithm_id = "ml-kem-768"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — FIPS 203, quantum-resistant. Migrated key-establishment call site."

[[classify]]
id = "CRYPTO-217"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?ML-KEM-1024\"?$" }
algorithm_id = "ml-kem-1024"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — FIPS 203, quantum-resistant. Migrated key-establishment call site."

[[classify]]
id = "CRYPTO-218"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?ML-DSA-44\"?$" }
algorithm_id = "ml-dsa-44"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — FIPS 204, quantum-resistant. Migrated signature call site."

[[classify]]
id = "CRYPTO-219"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?ML-DSA-65\"?$" }
algorithm_id = "ml-dsa-65"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — FIPS 204, quantum-resistant. Migrated signature call site."

[[classify]]
id = "CRYPTO-223"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?ML-DSA-87\"?$" }
algorithm_id = "ml-dsa-87"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — FIPS 204, quantum-resistant. Migrated signature call site."

# --- Classical: the two JCA names KeyPairGenerator.getInstance drops today --

[[classify]]
id = "CRYPTO-1063"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?Ed25519\"?$" }
algorithm_id = "ed25519"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — Ed25519, broken by Shor. Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-1064"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?XDH\"?$" }
algorithm_id = "xdh-unattributed"
severity_hint = "auto"
# The curve (X25519 vs X448) is chosen at the subsequent
# .initialize(NamedParameterSpec) call, which this matcher cannot see — same
# shape as CRYPTO-211's "EC" arm above.
message = "XDH keypair generator — the curve is chosen at .initialize(NamedParameterSpec(...)) and is not stated here. Quantum-vulnerable at every curve. Replace with X25519MLKEM768."

# --- PQC: FIPS 205, BouncyCastle's own JCA names (BC has no JDK-native ------
# SLH-DSA provider; names read from bcgit/bc-java
# prov/.../jcajce/provider/asymmetric/SLHDSA.java's Mappings class, not
# guessed — see #Y21's sibling caution against unverified BC class/algorithm
# names). Each parameter-set arm also accepts BC's "-WITH-<hash>" pre-hash
# suffix (HashSLH-DSA variant): the suffix changes how the message is
# digested before signing, not which of the twelve FIPS 205 parameter sets
# is in use, so both spellings resolve to the same algorithm_id.
[[classify]]
id = "CRYPTO-770"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SLH-DSA-SHA2-128S(-WITH-SHA256)?\"?$" }
algorithm_id = "slh-dsa-sha2-128s"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — FIPS 205, quantum-resistant. Migrated signature call site."

