algorithm_id = "ml-kem-unattributed"
severity_hint = "auto"
message = "KeyGenerator.getInstance('{algo}') — BouncyCastle Composite ML-KEM (FIPS 203 ML-KEM-1024 paired with X448). The ML-KEM component is quantum-resistant; algorithm-table.toml has no composite-family row, so the specific classical pairing is not published as a separate id."

