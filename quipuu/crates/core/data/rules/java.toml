severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — BouncyCastle Composite ML-DSA (FIPS 204 ML-DSA-44 paired with RSA-2048 RSASSA-PSS). The ML-DSA component is quantum-resistant; algorithm-table.toml has no composite-family row, so the specific classical pairing is not published as a separate id."

