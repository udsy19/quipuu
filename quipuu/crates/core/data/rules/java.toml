# --- PQC: FIPS 205, BouncyCastle's own JCA names (BC has no JDK-native ------
# SLH-DSA provider; names read from bcgit/bc-java
# prov/.../jcajce/provider/asymmetric/SLHDSA.java's Mappings class, not
# guessed — see #Y21's sibling caution against unverified BC class/algorithm
# names). Each parameter-set arm also accepts BC's "-WITH-<hash>" pre-hash
# suffix (HashSLH-DSA variant): the suffix changes how the message is
# digested before signing, not which of the twelve FIPS 205 parameter sets
# is in use, so both spellings resolve to the same algorithm_id.
