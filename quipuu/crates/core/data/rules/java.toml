# `KeyPairGenerator.getInstance(keyType)` with `keyType` a variable (netty's
# `pkitesting/Algorithms.java` is the corpus's own example) matches none of
# CRYPTO-210..223 above — none of their regexes match the variable's
# identifier text — and the call site vanished from the report entirely
# instead of degrading. Same defect class Go's `rsa-unattributed` fallback
# (`go.toml` CRYPTO-005) fixes; here the family itself is unknown (RSA, EC,
# DSA, ML-KEM, ML-DSA, or a provider-specific name all reach this same
# call shape), so it degrades to the JCA-wide sentinel rather than guessing
# a family the source does not state. Placed last so every literal arm above
# still wins when the algorithm is known.
[[classify]]
id = "CRYPTO-234"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
algorithm_id = "jca-unattributed"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance() with a non-literal algorithm argument — the value is not statically knowable at this call site. Inspect the value passed in."

