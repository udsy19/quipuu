# ============================================================================
# org.bouncycastle — BC provider detection
# ============================================================================

[[extract]]
id = "JAV-030"
language = "java"
query = """
(object_creation_expression
  type: (type_identifier) @cls (#match? @cls "^(RSAKeyPairGenerator|AESEngine|GCMBlockCipher|BouncyCastleProvider|MLKEMKeyPairGenerator|MLDSAKeyPairGenerator|SLHDSAKeyPairGenerator|MLKEMGenerator|MLKEMExtractor|MLDSASigner|SLHDSASigner|HashMLDSASigner|HashSLHDSASigner|DilithiumSigner|SPHINCSPlusSigner|XMSSSigner|XMSSMTSigner)$"))
"""
captures = { cls = "ident" }
api = "org.bouncycastle.{cls}"
description = "BouncyCastle crypto class instantiation."

[[classify]]
id = "CRYPTO-230"
when.api = "^org\\.bouncycastle\\.RSAKeyPairGenerator$"
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "BouncyCastle RSAKeyPairGenerator instantiated. Quantum-vulnerable RSA."

[[classify]]
id = "CRYPTO-231"
when.api = "^org\\.bouncycastle\\.AESEngine$"
algorithm_id = "aes-unattributed"
severity_hint = "auto"
message = "BouncyCastle AESEngine instantiated. A raw AES block cipher: it names no mode and takes its key size from init(). Confirm both — an unwrapped AESEngine is ECB."

[[classify]]
id = "CRYPTO-232"
when.api = "^org\\.bouncycastle\\.GCMBlockCipher$"
algorithm_id = "aes-unattributed-gcm"
severity_hint = "auto"
message = "BouncyCastle GCMBlockCipher instantiated. Good AEAD mode; the key size comes from the wrapped engine's init(), not from this call."

[[classify]]
id = "CRYPTO-233"
when.api = "^org\\.bouncycastle\\.BouncyCastleProvider$"
algorithm_id = "crypto-provider-registration"
severity_hint = "low"
message = "BouncyCastle provider registered. This selects an implementation, not an algorithm — it names none. Inventory all BC API usages reachable from here."

# BC's lightweight-API PQC classes (org.bouncycastle.crypto.* since 2026-04,
# org.bouncycastle.pqc.crypto.* before it — the bare class name is the same
# in both locations, so this rule reads unchanged across the relocation).
# None of the nine take a parameter set as a constructor literal — it is
# supplied at runtime via a KeyGenerationParameters object passed to init()
# — so every arm degrades to the family sentinel, the same shape the JCA
# KeyPairGenerator/KEM fallbacks above use for a non-literal argument.
[[classify]]
id = "CRYPTO-811"
when.api = "^org\\.bouncycastle\\.MLKEMKeyPairGenerator$"
algorithm_id = "ml-kem-unattributed"
severity_hint = "auto"
message = "BouncyCastle MLKEMKeyPairGenerator instantiated — FIPS 203, quantum-resistant, but the parameter set is chosen via KeyGenerationParameters at init(), not this call."

[[classify]]
id = "CRYPTO-812"
when.api = "^org\\.bouncycastle\\.MLDSAKeyPairGenerator$"
algorithm_id = "ml-dsa-unattributed"
severity_hint = "auto"
message = "BouncyCastle MLDSAKeyPairGenerator instantiated — FIPS 204, quantum-resistant, but the parameter set is chosen via KeyGenerationParameters at init(), not this call."

[[classify]]
id = "CRYPTO-813"
when.api = "^org\\.bouncycastle\\.SLHDSAKeyPairGenerator$"
