# BC's pre-FIPS-finalization PQC signer names (org.bouncycastle.pqc.crypto.dilithium /
# .sphincsplus, still shipped alongside the FIPS-aligned MLDSASigner/SLHDSASigner classes
# above for callers who have not migrated the class name). Same standardized algorithms
# under an older name, not a new algorithm family — resolves to the same sentinels, per
# #Y66. Not FalconSigner (FN-DSA itself is not yet FIPS-final) and not the five
# non-selected/broken schemes (PicnicSigner et al.). CompositeMLDsa/CompositeKEMs are a
# different question — pairings of the already-final ML-DSA/ML-KEM with a classical
# primitive, not a not-yet-final algorithm — and got their own coverage in #Y95/#Y101/
# #Y104 despite pre-GA experimental status; they are not a counter-example to the
# FN-DSA exclusion above.
[[classify]]
id = "CRYPTO-958"
when.api = "^org\\.bouncycastle\\.DilithiumSigner$"
algorithm_id = "ml-dsa-unattributed"
severity_hint = "auto"
message = "BouncyCastle DilithiumSigner instantiated — FIPS 204 signature under BC's pre-finalization class name, quantum-resistant, but the parameter set comes from the key it is initialised with, not this call."

[[classify]]
id = "CRYPTO-959"
when.api = "^org\\.bouncycastle\\.SPHINCSPlusSigner$"
algorithm_id = "slh-dsa-unattributed"
severity_hint = "auto"
message = "BouncyCastle SPHINCSPlusSigner instantiated — FIPS 205 signature under BC's pre-finalization class name, quantum-resistant, but the parameter set comes from the key it is initialised with, not this call."

# NIST SP 800-208 stateful hash-based signatures, BC's low-level API
# (org.bouncycastle.pqc.crypto.xmss). Unlike Dilithium/SPHINCSPlus above, the
# class name itself states single- vs multi-tree — XMSSSigner cannot produce
# an XMSSMT signature and vice versa — so no "-unattributed" sentinel is
# needed here.
[[classify]]
id = "CRYPTO-1033"
when.api = "^org\\.bouncycastle\\.XMSSSigner$"
algorithm_id = "xmss"
severity_hint = "auto"
message = "BouncyCastle XMSSSigner instantiated — RFC 8391 / NIST SP 800-208 single-tree stateful hash-based signature, quantum-resistant."

[[classify]]
id = "CRYPTO-1034"
when.api = "^org\\.bouncycastle\\.XMSSMTSigner$"
algorithm_id = "xmss-mt"
severity_hint = "auto"
message = "BouncyCastle XMSSMTSigner instantiated — RFC 8391 / NIST SP 800-208 multi-tree stateful hash-based signature, quantum-safe but explicitly prohibited by CNSA 2.0 (single-tree XMSS only)."

