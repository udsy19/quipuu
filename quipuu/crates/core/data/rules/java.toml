# BouncyCastle 1.85.2's CompositeSignatures.Mappings registers the same 18
# names as Signature.<name>, plus a Signature.<name>-PREHASH sibling for
# each — same source, same 18-not-31 correction as the KeyPairGenerator
# block above. Each regex accepts the optional `-PREHASH` suffix so both
# spellings resolve to the same ML-DSA parameter-set id, matching this
# file's established pre-hash-suffix convention (e.g. SLH-DSA's
# `-WITH-<hash>` arms above).
