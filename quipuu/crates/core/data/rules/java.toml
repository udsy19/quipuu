severity_hint = "critical"
message = "Signature.getInstance('{algo}') — SHA-1 is collision-broken (SHAttered, 2017). Move to SHA-256 now and to ML-DSA-65 before 2030."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-292"
