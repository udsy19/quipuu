# ============================================================================
# java.security.KeyPairGenerator.getInstance
# ============================================================================

[[extract]]
id = "JAV-010"
language = "java"
query = """
(method_invocation
  object: (identifier) @cls (#eq? @cls "KeyPairGenerator")
  name: (identifier) @fn (#eq? @fn "getInstance")
  arguments: (argument_list (string_literal) @algo))
"""
captures = { cls = "ident", fn = "ident", algo = "literal_string" }
api = "java.security.KeyPairGenerator.getInstance"
description = "Java KeyPairGenerator.getInstance(algo) — asymmetric keypair generation."

[[classify]]
id = "CRYPTO-210"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?RSA\"?$" }
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "RSA keypair generator. Quantum-vulnerable: NIST IR 8547 deprecates after 2030."

[[classify]]
id = "CRYPTO-211"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?EC\"?$" }
algorithm_id = "ecdsa-unattributed"
severity_hint = "auto"
# The curve is determined by the subsequent .initialize(ECGenParameterSpec)
# call, which this matcher cannot see — so the id names no curve. It used to
# name P-256 "as the most common curve", which reported secp256k1 keys as
# NIST P-256. Auditors should read the initialize() call; Shor breaks all of
# them, so only the classical strength and the threat model differ.
message = "EC keypair generator — the curve is chosen at .initialize(ECGenParameterSpec(...)) and is not stated here. Quantum-vulnerable at every curve. Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-212"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?DSA\"?$" }
algorithm_id = "dsa-unattributed"
severity_hint = "high"
message = "DSA keypair generator. Deprecated for new use (FIPS 186-5)."

