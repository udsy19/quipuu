# ============================================================================
# SSLParameters.setNamedGroups — TLS group-list hardening/compliance
# configuration, the opposite direction from every other Java PQC rule above.
# Those all fire on code that has already decided to adopt PQC; this one
# fires on a classical-only group list written years before ML-KEM existed,
# for FIPS-mode or approved-algorithm-baseline reasons unrelated to PQC. JDK
# 27 puts X25519MLKEM768 first in its own default group list, so an old
# hardening baseline that pins a classical-only list silently blocks the
# default-on PQC upgrade once the JVM updates — a downgrade case, not a
# missing-adoption case. Names and default order verified directly against
# openjdk/jdk27u's sun.security.ssl.NamedGroup.java (jeps/527's own page
# 403s), not guessed from a JEP description. Backlog #Y24, first change,
# part (a). Part (b) — System.setProperty("jdk.tls.namedGroups", "a,b,c")'s
# comma-delimited single-string form — is a separate Rust structural matcher,
# match_java_set_property_named_groups in scanner.rs, reusing the same
# api/args.group shape so the classify arms below fire on either call shape.
# ============================================================================

[[extract]]
id = "JAV-100"
language = "java"
query = """
(method_invocation
  name: (identifier) @fn (#eq? @fn "setNamedGroups")
  arguments: (argument_list
    (array_creation_expression
      value: (array_initializer (string_literal) @group))))
"""
captures = { fn = "ident", group = "literal_string" }
api = "javax.net.ssl.SSLParameters.setNamedGroups"
description = "Java SSLParameters.setNamedGroups(String[]) — TLS key-exchange group preference list, one event per named group."

[[classify]]
id = "CRYPTO-798"
when.api = "^javax\\.net\\.ssl\\.SSLParameters\\.setNamedGroups$"
when.args.group = "X25519MLKEM768"
algorithm_id = "x25519-mlkem768"
severity_hint = "auto"
message = "TLS group X25519MLKEM768 in setNamedGroups — hybrid X25519 + ML-KEM-768 (FIPS 203). Migrated key-establishment config."

