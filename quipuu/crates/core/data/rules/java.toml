id = "CRYPTO-770"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SLH-DSA-SHA2-128S(-WITH-SHA256)?\"?$" }
algorithm_id = "slh-dsa-sha2-128s"
severity_hint = "auto"
message = "KeyPairGenerator.getInstance('{algo}') — FIPS 205, quantum-resistant. Migrated signature call site."

