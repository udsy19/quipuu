# Java detection rules — two-layer (extract → classify), per D-07
#
# Covers: javax.crypto.Cipher.getInstance, java.security.KeyPairGenerator,
#         java.security.MessageDigest, org.bouncycastle.* (BC).
#
# Extract IDs: JAV-NNN
# Classify IDs: CRYPTO-200..299

# ============================================================================
# javax.crypto.Cipher.getInstance — string-driven cipher selection
# ============================================================================

[[extract]]
id = "JAV-001"
language = "java"
query = """
(method_invocation
  object: (identifier) @cls (#eq? @cls "Cipher")
  name: (identifier) @fn (#eq? @fn "getInstance")
  arguments: (argument_list (string_literal) @spec))
"""
captures = { cls = "ident", fn = "ident", spec = "literal_string" }
api = "javax.crypto.Cipher.getInstance"
description = "Java Cipher.getInstance(spec) — cipher/mode/padding string literal."

# `DESede` is 3DES, not DES — two different algorithm-ids, two different
# CBOM components. CRYPTO-200's `(?i)DES` matches both, so the specific arm
# has to come first: apply_classify takes the first `when` that matches.

[[classify]]
id = "CRYPTO-214"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)(DESede|TripleDES|3DES)" }
algorithm_id = "3des"
severity_hint = "critical"
message = "3DES in Cipher.getInstance('{spec}'). Disallowed for new encryption use (NIST SP 800-131A, 2023); 64-bit block invites Sweet32."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-200"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)DES" }
algorithm_id = "des"
severity_hint = "critical"
message = "Single DES in Cipher.getInstance('{spec}'). 56-bit key, brute-forced since 1998; disallowed for new encryption (NIST SP 800-131A)."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-213"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)(RC4|ARCFOUR)" }
algorithm_id = "rc4"
severity_hint = "critical"
message = "RC4 in Cipher.getInstance('{spec}'). Biased keystream, practical plaintext recovery; banned in TLS by RFC 7465."
cwe = "CWE-327"

# The JCE transformation string states the key size only in the optional
# `AES_128`/`AES_192`/`AES_256` forms (JCE standard names, used mainly with
# GCM). Plain `AES/...` takes its key size from the SecretKey, which is not at
# this call site — so the sized arms come first and CRYPTO-201/203 keep the
# family match without asserting a width. Rule order is load-bearing:
# apply_classify takes the first `when` that matches.

[[classify]]
id = "CRYPTO-207"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES_128.*/ECB" }
algorithm_id = "aes-128-ecb"
severity_hint = "high"
message = "AES-128-ECB mode in Cipher.getInstance('{spec}'). ECB is deterministic and leaks patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-208"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES_192.*/ECB" }
algorithm_id = "aes-192-ecb"
severity_hint = "high"
message = "AES-192-ECB mode in Cipher.getInstance('{spec}'). ECB is deterministic and leaks patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-209"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES_256.*/ECB" }
algorithm_id = "aes-256-ecb"
severity_hint = "high"
message = "AES-256-ECB mode in Cipher.getInstance('{spec}'). ECB is deterministic and leaks patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-201"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES.*/ECB" }
algorithm_id = "aes-unattributed-ecb"
severity_hint = "high"
message = "AES-ECB mode in Cipher.getInstance('{spec}'). ECB is deterministic and leaks patterns at every key size; the key size itself is not stated here — it comes from the SecretKey."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-202"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)RSA.*PKCS1Padding" }
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "high"
message = "RSA PKCS1v1.5 padding in Cipher.getInstance('{spec}'). Vulnerable to Bleichenbacher attacks; use OAEP."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-204"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES_128.*/GCM" }
algorithm_id = "aes-128-gcm"
severity_hint = "auto"
message = "AES-128-GCM in Cipher.getInstance('{spec}'). Good AEAD mode; CNSA 2.0 requires 256-bit AES."

[[classify]]
id = "CRYPTO-205"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES_192.*/GCM" }
algorithm_id = "aes-192-gcm"
severity_hint = "auto"
message = "AES-192-GCM in Cipher.getInstance('{spec}'). Good AEAD mode; CNSA 2.0 requires 256-bit AES."

[[classify]]
id = "CRYPTO-206"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES_256.*/GCM" }
algorithm_id = "aes-256-gcm"
severity_hint = "auto"
message = "AES-256-GCM in Cipher.getInstance('{spec}'). Good AEAD choice at a CNSA 2.0-approved key size."

[[classify]]
id = "CRYPTO-203"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES.*/GCM" }
algorithm_id = "aes-unattributed-gcm"
severity_hint = "auto"
message = "AES-GCM in Cipher.getInstance('{spec}'). Good AEAD mode. The key size is not in this string — it comes from the SecretKey, so this finding asserts the mode only. Confirm 256-bit key."

# --- PQC candidate: HQC, BouncyCastle's own PKE/Cipher JCA registration -----
# org.bouncycastle.pqc.jcajce.provider.HQC's Mappings.configure() registers
# HQC under Cipher.getInstance as well as KeyPairGenerator/KEM (Backlog
# #Y80) — same generic-plus-qualified name shapes as those two below.
[[classify]]
id = "CRYPTO-1002"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)^\"?HQC-128\"?$" }
algorithm_id = "hqc-128"
severity_hint = "auto"
message = "Cipher.getInstance('{spec}') — NIST-selected backup KEM (HQC), FIPS standard pending. Migrated key-establishment call site."

