# One arm for every non-SHA-1 ECDSA transformation, and it names no curve.
# `SHA256withECDSA` does not mean P-256: jetty's Ethereum credentials call
# `Signature.getInstance("NONEwithECDSA")` over secp256k1, so asserting a
# curve here would ship a wrong component in the CBOM. Shor breaks ECDSA at
# every curve, so the migration verdict is exact either way.
[[classify]]
id = "CRYPTO-298"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)withECDSA\"?$" }
algorithm_id = "ecdsa-unattributed"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — ECDSA, broken by Shor. The curve is not at this call site; it comes from the key passed to initSign(). Replace with ML-DSA-65."

