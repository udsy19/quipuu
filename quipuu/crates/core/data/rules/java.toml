# --- Approved: XMSS/XMSSMT, NIST SP 800-208 stateful hash-based signatures --
# BC's LMS/XMSS.java registers "XMSS" and "XMSSMT" as two distinct
# KeyPairGenerator service names — unlike LMS, where the identical "LMS" name
# covers both single- and multi-tree HSS keys (the multi-tree variant is
# selected later via a LMSHSSKeyGenParameterSpec passed to .initialize(),
# which this table cannot trace across statements), so LMS/HSS is not
# classified here to avoid guessing which one a bare getInstance("LMS") call
# will produce.
