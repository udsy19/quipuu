# ============================================================================
# java.security.Signature — the JCA signing surface.
#
# `Signature.getInstance("SHA1withRSA")` is the single most common way a Java
# codebase names a signature algorithm, and it was invisible: no matcher
# emitted the api, so none of these could fire. The transformation string
# states the digest and the key family but never the modulus or the curve —
# those come from the key passed to initSign(). The RSA ids inherit the
# modulus convention already used by CRYPTO-202/CRYPTO-242; the ECDSA arm
# names no curve at all, because a curve is the whole parameter for ECDSA
# and `SHA256withECDSA` does not state one.
# Rule order is load-bearing — the first matching `when` wins, so the
# digest-specific arms precede the family catch-alls.
# ============================================================================

[[extract]]
id = "JAV-090"
language = "java"
query = """
(method_invocation
  object: (identifier) @cls (#eq? @cls "Signature")
  name: (identifier) @fn (#eq? @fn "getInstance")
  arguments: (argument_list (string_literal) @algo))
"""
captures = { cls = "ident", fn = "ident", algo = "literal_string" }
api = "java.security.Signature.getInstance"
description = "Java Signature.getInstance(algorithm) — JCA signature transformation."

[[classify]]
id = "CRYPTO-290"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?MD5with(RSA|RSAandMGF1)\"?$" }
algorithm_id = "rsa-pkcs1-md5"
severity_hint = "critical"
message = "Signature.getInstance('{algo}') — MD5 is collision-broken (2004); an MD5 signature is forgeable today, before any quantum consideration."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-291"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SHA-?1with(RSA|RSAandMGF1)\"?$" }
algorithm_id = "rsa-pkcs1-sha1"
severity_hint = "critical"
message = "Signature.getInstance('{algo}') — SHA-1 is collision-broken (SHAttered, 2017). Move to SHA-256 now and to ML-DSA-65 before 2030."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-292"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SHA-?1withECDSA\"?$" }
algorithm_id = "ecdsa-sha1"
severity_hint = "critical"
message = "Signature.getInstance('{algo}') — SHA-1 digest under ECDSA is collision-broken. Move to SHA-256 now and to ML-DSA-65 before 2030."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-293"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SHA-?256with(RSA|RSAandMGF1)\"?$" }
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — RSA PKCS#1 v1.5 signature, broken by Shor. Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-294"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SHA-?384with(RSA|RSAandMGF1)\"?$" }
algorithm_id = "rsa-pkcs1-sha384"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — RSA PKCS#1 v1.5 signature, broken by Shor. Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-295"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SHA-?512with(RSA|RSAandMGF1)\"?$" }
algorithm_id = "rsa-pkcs1-sha512"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — RSA PKCS#1 v1.5 signature, broken by Shor. Replace with ML-DSA-87."

[[classify]]
id = "CRYPTO-296"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?(RSASSA-PSS|SHA-?256withRSA/PSS)\"?$" }
algorithm_id = "rsa-pss-sha256"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — RSA-PSS signature, broken by Shor. Replace with ML-DSA-65."

# One arm for every non-SHA-1 ECDSA transformation, and it names no curve.
# `SHA256withECDSA` does not mean P-256: jetty's Ethereum credentials call
# `Signature.getInstance("NONEwithECDSA")` over secp256k1, so asserting a
# curve here would ship a wrong component in the CBOM. Shor breaks ECDSA at
# every curve, so the migration verdict is exact either way.
[[classify]]
id = "CRYPTO-298"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)withECDSA\"?$" }
algorithm_id = "ecdsa-unattributed"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — ECDSA, broken by Shor. The curve is not at this call site; it comes from the key passed to initSign(). Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-299"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?(Ed25519|EdDSA)\"?$" }
algorithm_id = "ed25519"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — Ed25519, broken by Shor. Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-286"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?Ed448\"?$" }
algorithm_id = "ed448"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — Ed448, broken by Shor. Replace with ML-DSA-87."

[[classify]]
id = "CRYPTO-287"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)with(DSA|DSAinP1363Format)\"?$" }
algorithm_id = "dsa-unattributed"
severity_hint = "auto"
message = "Signature.getInstance('{algo}') — DSA, broken by Shor and already discouraged classically. Replace with ML-DSA-65."
