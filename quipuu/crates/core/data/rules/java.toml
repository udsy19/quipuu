# --- Approved: XMSS/XMSSMT, NIST SP 800-208 stateful hash-based signatures --
# Bare service names plus the four digest-qualified names BC registers
# directly for each (LMS.java/XMSS.java, read from the vendored bcprov-jdk18on
# clone). BC also registers a "<DIGEST>WITHXMSS(MT)" alias family and the
# fully-qualified "<DIGEST>WITHXMSS(MT)-<DIGEST>" names these resolve to —
# left uncovered here, named rather than silently missed: enumerating that
# alias set correctly needs the same care #Y61 put into csharp.toml's SHA3
# classes, not a quick addition. LMS/HSS is not classified for the same
# call-site ambiguity reason given at the KeyPairGenerator arms above.
