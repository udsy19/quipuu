  arguments: (argument_list (string_literal) @algo))
"""
captures = { cls = "ident", fn = "ident", algo = "literal_string" }
api = "java.security.MessageDigest.getInstance"
description = "Java MessageDigest.getInstance(algo) — hash algorithm selection."

[[classify]]
