# BouncyCastle 1.85.2's CompositeSignatures.Mappings registers a
# KeyPairGenerator.<name> entry for every OID in CompositeIndex's `pairings`
# map (draft-ounsworth-pq-composite-sigs-13) — 18 literal names, verified
# directly against the release tag r1rv85v2's own source, not the 31 a prior
# pass assumed. CompositeIndex's `algorithmNames`/`kpgInitSpecs` maps also
# carry 14 "HashMLDSA*" entries, but `Mappings.configure()` only iterates
# `getSupportedIdentifiers()` (== `pairings.keySet()`), which never includes
# them — so those 14 are not (yet) reachable through
# KeyPairGenerator.getInstance/Signature.getInstance at all, and get no arm
# here, same discipline #Y101 used for CompositeKEMs' own unregistered names.
# Without these arms every one of the 18 fell through to CRYPTO-234 below,
# an already-correct TP just reported under the JCA-wide sentinel instead of
# its actual ML-DSA parameter set — an attribution gain, not a recall fix.
