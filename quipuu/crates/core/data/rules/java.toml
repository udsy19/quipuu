# ============================================================================
# java.security.Signature — the JCA signing surface.
#
# `Signature.getInstance("SHA1withRSA")` is the single most common way a Java
# codebase names a signature algorithm, and it was invisible: no matcher
# emitted the api, so none of these could fire. The transformation string
# states the digest and the key family but never the modulus or the curve —
# those come from the key passed to initSign(). The RSA ids inherit the
# modulus convention already used by CRYPTO-202/CRYPTO-242; the ECDSA arm
# names no curve at all, because a curve is the whole parameter for ECDSA
# and `SHA256withECDSA` does not state one.
# Rule order is load-bearing — the first matching `when` wins, so the
# digest-specific arms precede the family catch-alls.
# ============================================================================

[[extract]]
id = "JAV-090"
language = "java"
query = """
(method_invocation
  object: (identifier) @cls (#eq? @cls "Signature")
  name: (identifier) @fn (#eq? @fn "getInstance")
  arguments: (argument_list (string_literal) @algo))
"""
captures = { cls = "ident", fn = "ident", algo = "literal_string" }
api = "java.security.Signature.getInstance"
description = "Java Signature.getInstance(algorithm) — JCA signature transformation."

[[classify]]
id = "CRYPTO-290"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?MD5with(RSA|RSAandMGF1)\"?$" }
algorithm_id = "rsa-pkcs1-md5"
severity_hint = "critical"
message = "Signature.getInstance('{algo}') — MD5 is collision-broken (2004); an MD5 signature is forgeable today, before any quantum consideration."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-291"
when.api = "^java\\.security\\.Signature\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SHA-?1with(RSA|RSAandMGF1)\"?$" }
