# BC's lightweight-API PQC classes (org.bouncycastle.crypto.* since 2026-04,
# org.bouncycastle.pqc.crypto.* before it — the bare class name is the same
# in both locations, so this rule reads unchanged across the relocation).
# None of the nine take a parameter set as a constructor literal — it is
# supplied at runtime via a KeyGenerationParameters object passed to init()
# — so every arm degrades to the family sentinel, the same shape the JCA
# KeyPairGenerator/KEM fallbacks above use for a non-literal argument.
[[classify]]
