nist_quantum_security_level = 0
quantum_status = "BrokenByShor"
replacement = "ml-kem-768"
notes = "NIST IR 8547 IPD: deprecated after 2030, disallowed after 2035. Reachable via Java SSLParameters.setNamedGroups('ffdhe2048') (RFC 7919 named group, group size stated in the name); a certificate's DH OIDs still name no group size and resolve to dh-unattributed until the SPKI DomainParameters prime is parsed, the way rsaEncryption is refined by modulus length today."

