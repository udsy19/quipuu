# DH / DSA -------------------------------------------------------------------

[[algorithm]]
id = "dh-unattributed"
display_name = "Finite-Field DH (group size not stated)"
family = "DH"
primitive = "key-agree"
nist_quantum_security_level = 0
quantum_status = "BrokenByShor"
replacement = "ml-kem-768"
oid = "1.2.840.10046.2.1"
notes = "dhKeyAgreement (PKCS #3) and dhpublicnumber (X9.42) name the key type; the prime size lives in the DomainParameters we do not parse, so no group size can be asserted. Shor breaks finite-field DH at every group size, so the migration verdict is exact and only the classical strength is unknown — which is why no classical_security_bits is recorded. Sentinel, in the same role as ecdsa-unattributed."

[[algorithm]]
