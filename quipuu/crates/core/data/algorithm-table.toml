# Used as algorithm-id when a TLS prober detects them in scan-network.
# ============================================================================

[[algorithm]]
id = "x25519-mlkem768"
display_name = "X25519MLKEM768 (TLS hybrid)"
family = "Hybrid-KEM"
primitive = "combiner"
nist_quantum_security_level = 3
quantum_status = "PqcFinal"
notes = "IANA TLS supported_groups codepoint 4588 (0x11EC). draft-ietf-tls-ecdhe-mlkem."

[[algorithm]]
id = "secp256r1-mlkem768"
display_name = "SecP256r1MLKEM768 (TLS hybrid)"
family = "Hybrid-KEM"
primitive = "combiner"
nist_quantum_security_level = 3
quantum_status = "PqcFinal"
notes = "IANA codepoint 4587 (0x11EB). FIPS-compliant path (P-256 + ML-KEM-768)."

[[algorithm]]
id = "secp384r1-mlkem1024"
display_name = "SecP384r1MLKEM1024 (TLS hybrid)"
family = "Hybrid-KEM"
primitive = "combiner"
