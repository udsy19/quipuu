# ============================================================================
# STATEFUL HASH-BASED SIGNATURES — NIST SP 800-208
#
# Quantum-safe and deployed today in secure boot and firmware signing, which is
# where CNSA 2.0 puts them and why they carry the earliest deadline in
# `policies/nsa-cnsa2.toml`. CNSA 2.0 approves LMS and single-tree XMSS and
# explicitly prohibits HSS and XMSS^MT, so all four need ids: a policy cannot
# rule on an algorithm the table does not name, and `Policy::cross_check`
# only sees ids, not the prose in `[meta].notes`.
#
# Status is QuantumSafe rather than PqcFinal: these are hash constructions
# standardised by an SP, not by FIPS 203/204/205, and `PqcFinal` requires a
# FIPS reference. No NIST security category is assigned by SP 800-208, so
# nist_quantum_security_level is omitted rather than invented.
#
# Sources: NIST SP 800-208 (Oct 2020); CNSA 2.0 FAQ v2.1 (Dec 2024) — see
# knowledge/02-nist-pqc-timeline §6.1 and knowledge/09-regulatory §2.
# ============================================================================

[[algorithm]]
id = "lms"
display_name = "LMS (Leighton-Micali Signature)"
family = "LMS"
primitive = "signature"
quantum_status = "QuantumSafe"
undetectable = "No LMS OID is vendored: we ship no source for the X.509 SPKI codepoints and P2 forbids fetching one, so nothing is asserted. Reachable the moment an OID lands in oid-table.toml."
notes = "RFC 8554 / NIST SP 800-208. Stateful: a one-time key reused signs away the private key, so detection matters most in firmware-signing build systems. CNSA 2.0 approves LMS for software and firmware signing, SHA-256/192 preferred."

[[algorithm]]
id = "hss"
display_name = "HSS (Hierarchical Signature System, multi-tree LMS)"
family = "LMS"
primitive = "signature"
quantum_status = "QuantumSafe"
undetectable = "As lms — no vendored OID."
notes = "RFC 8554 / NIST SP 800-208. Multi-tree LMS. Quantum-safe, but explicitly PROHIBITED by CNSA 2.0, which takes single-tree LMS only; listed in nsa-cnsa2 policy_disallowed."

[[algorithm]]
id = "xmss"
display_name = "XMSS (single-tree)"
family = "XMSS"
primitive = "signature"
quantum_status = "QuantumSafe"
undetectable = "As lms — no vendored OID."
notes = "RFC 8391 / NIST SP 800-208. Stateful hash-based. CNSA 2.0 approves single-tree XMSS for software and firmware signing."

