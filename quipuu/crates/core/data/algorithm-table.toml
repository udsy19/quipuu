replacement = "ml-kem-768"
oid = "1.2.840.113549.1.1.1"
notes = "Emitted where the source states a modulus below 2048 bits but not which one — `rsa.GenerateKey(rand, bits)` matched on `bits < 2048`. The measured size is in the finding message; naming a specific row here would report a 512-bit key as RSA-1024. Classically below the NIST SP 800-131A 112-bit minimum whatever the exact size, which is why the verdict is exact and the bit count is not recorded."

