nist_quantum_security_level = 0
quantum_status = "BrokenByShor"
replacement = "ml-kem-768"
oid = "1.2.840.113549.1.1.1"
notes = "A call site such as `RSA.Create()`, `KeyPairGenerator.getInstance(\"RSA\")` or `generateKeyPair('rsa')` names the key type and nothing else — the modulus comes from a library default or a later call. Shor breaks RSA at every modulus, so the migration verdict is exact and only the classical strength is unknown, which is why no classical_security_bits is recorded. Sentinel, in the same role as dh-unattributed."

[[algorithm]]
