# Canonical Algorithm Table
#
# This is the static lookup table quipuu ships with — every detected
# algorithm-id maps to one of these records. The Rust core crate deserializes
# this at compile time via include_dir!.
#
# Schema (per entry):
#   id                       canonical algorithm-id (kebab-case, stable across releases)
#   display_name             human-facing name in reports
#   family                   broad family (RSA, ECDSA, ML-KEM, SHA-2, AES, ...)
#   primitive                CycloneDX 1.7 algorithmProperties.primitive enum value
#                            (drbg | mac | block-cipher | stream-cipher | signature | hash |
#                             pke | xof | kdf | key-agree | kem | ae | combiner | key-wrap |
#                             other | unknown)
#   classical_security_bits  classical security in bits (omitted = not applicable)
#   nist_quantum_security_level  CBOM nistQuantumSecurityLevel integer 0..6 (0 = vuln)
#   quantum_status           BrokenByShor | WeakenedByGrover | QuantumSafe |
#                            BrokenClassically | PqcFinal | PqcDraft
#   replacement              recommended PQC replacement algorithm-id (optional)
#   fips                     FIPS reference if any (e.g. "FIPS 203")
#   oid                      most common OID (string, dotted decimal)
#   undetectable             why this row is carried although no emitter can
#                            produce it. Present iff the id is unreachable from
#                            every emitter; the reachability gate in
#                            crates/cli/tests/algorithm_reachability.rs fails
#                            both when a row is unreachable without a reason and
#                            when a row that has become reachable keeps one.
#   notes                    free-form; cite sources where they matter
#
# Sources tracked at the entry level. Family-wide source notes:
#   * Quantum status follows NIST IR 8547 IPD (Nov 2024) — see knowledge/02-nist-pqc-timeline.
#   * CBOM nistQuantumSecurityLevel anchors per CycloneDX 1.7 schema docs.
#   * Classical security bits per NIST SP 800-57 Part 1 Rev. 5.
#   * OIDs per RFC 9881 (ML-DSA), RFC 9909 (SLH-DSA), RFC 9935 (ML-KEM), classical RFCs.

# ============================================================================
# ASYMMETRIC — BROKEN BY SHOR
# ============================================================================

