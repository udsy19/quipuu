nist_quantum_security_level = 0
quantum_status = "BrokenByShor"
replacement = "ml-kem-768"
undetectable = "The DH OIDs name no group size, so a certificate resolves to dh-unattributed. This row becomes reachable when the SPKI DomainParameters prime is parsed, the way rsaEncryption is refined by modulus length today."
notes = "NIST IR 8547 IPD: deprecated after 2030, disallowed after 2035."

[[algorithm]]
id = "dh-3072"
display_name = "Finite-Field DH (3072-bit)"
family = "DH"
primitive = "key-agree"
classical_security_bits = 128
nist_quantum_security_level = 0
quantum_status = "BrokenByShor"
replacement = "ml-kem-768"
undetectable = "Same as dh-2048: no emitter can state a DH group size today."

[[algorithm]]
id = "dsa-unattributed"
display_name = "DSA (parameter size not stated)"
family = "DSA"
primitive = "signature"
nist_quantum_security_level = 0
quantum_status = "BrokenByShor"
replacement = "ml-dsa-65"
oid = "1.2.840.10040.4.1"
notes = "id-dsa and id-dsa-with-sha* name the key type and the digest; the prime and subprime sizes live in Dss-Parms, which we do not parse. `KeyPairGenerator.getInstance(\"DSA\")` names even less. Shor breaks DSA at every parameter size, so the verdict is exact. Sentinel, in the same role as dh-unattributed."

[[algorithm]]
id = "dsa-2048"
display_name = "DSA (2048-bit)"
