# ============================================================================
# SENTINELS — generic ids used by the network scanner when we know a TLS
# handshake happened but cannot attribute it to a specific group.
# ============================================================================

[[algorithm]]
id = "tls-handshake"
display_name = "TLS handshake (generic)"
family = "TLS"
primitive = "other"
quantum_status = "QuantumSafe"
notes = "Generic sentinel for scan-network's default-handshake findings; the per-group probes provide algorithm-specific attribution. Not scored as vulnerable."

[[algorithm]]
id = "tls-group-not-probed"
display_name = "TLS group catalogued, not probed"
family = "TLS"
primitive = "other"
quantum_status = "QuantumSafe"
notes = "Sentinel for scan-network's per-group enumeration when the active CryptoProvider (rustls/ring) has no `SupportedKxGroup` impl for a catalogued IANA group — the handshake was never attempted, so nothing was observed about whether the target offers or negotiates it. The specific group name and codepoint are carried in the finding message; asserting the catalogued group's own algorithm id (e.g. x25519-mlkem768) here would publish a CBOM component for a mechanism nobody checked for. Not scored as vulnerable."

[[algorithm]]
id = "ecdsa-unattributed"
display_name = "ECDSA (curve not stated at the call site)"
family = "ECDSA"
primitive = "signature"
nist_quantum_security_level = 0
quantum_status = "BrokenByShor"
replacement = "ml-dsa-65"
oid = "1.2.840.10045.4.3.2"
notes = "A JCA transformation such as `SHA256withECDSA` names the digest and the key family but never the curve — that comes from the key passed to initSign(). Shor breaks ECDSA at every curve, so the migration verdict is exact; only the classical strength is unknown, which is why no classical_security_bits is recorded. Sentinel, in the same role as aes-unattributed."

[[algorithm]]
id = "tls-legacy-protocol"
display_name = "Legacy TLS/SSL protocol version"
family = "TLS"
primitive = "other"
classical_security_bits = 0
nist_quantum_security_level = 0
quantum_status = "BrokenClassically"
notes = "SSL 3.0 / TLS 1.0 / TLS 1.1 selected as the floor of a TLS configuration. A protocol-version setting names no algorithm, so findings on these call sites carry this id rather than asserting a cipher the source never states. Broken classically (POODLE, BEAST); deprecated by RFC 8996."

[[algorithm]]
id = "tls-client-config"
display_name = "TLS client config (topology marker)"
family = "TLS"
primitive = "other"
quantum_status = "QuantumSafe"
notes = "Topology marker for rustls::ClientConfig::builder() and equivalent calls. The algorithm itself is determined at handshake time; this id flags the call site so an auditor can locate it without misclassifying it as a specific cipher. Inventory-tier."

[[algorithm]]
id = "tls-server-config"
display_name = "TLS server config (topology marker)"
family = "TLS"
primitive = "other"
quantum_status = "QuantumSafe"
notes = "Topology marker for rustls::ServerConfig::builder() and equivalent calls. Same semantics as tls-client-config: flags the call site without assigning a misleading cipher id. Inventory-tier."

[[algorithm]]
id = "webcrypto-unattributed"
display_name = "WebCrypto call (algorithm not statically determined)"
family = "WebCrypto"
primitive = "unknown"
quantum_status = "QuantumSafe"
notes = "Marker for a SubtleCrypto call whose algorithm argument is a variable, or names an algorithm with no row in this table. Same semantics as tls-client-config: it records the call site so an auditor can find it, without asserting an algorithm the source does not state. Inventory-tier — deliberately not scored as vulnerable, because scoring it would mean guessing which algorithm it is."

[[algorithm]]
id = "jca-unattributed"
display_name = "JCA getInstance call (algorithm not statically determined)"
family = "JCA"
primitive = "unknown"
quantum_status = "QuantumSafe"
notes = "Marker for a java.security.KeyPairGenerator.getInstance/Signature.getInstance call whose algorithm argument is a variable rather than a string literal. Same semantics as webcrypto-unattributed: JCA's getInstance is provider-dispatched, so the family (RSA, EC, DSA, ML-KEM, ML-DSA, or a third-party provider name) is not stated at the call site — asserting one would be a guess. Inventory-tier — deliberately not scored as vulnerable."

[[algorithm]]
id = "signature-unattributed"
display_name = "Signature keygen (implementing library not identified)"
family = "Signature"
primitive = "signature"
quantum_status = "QuantumSafe"
notes = "Marker for a signature call site whose identifier is shared by a classical and a post-quantum implementation, with nothing in the file to say which one supplies it. The motivating case is the NaCl `crypto_sign_keypair` name: Ed25519 under libsodium and TweetNaCl, ML-DSA / SLH-DSA / FN-DSA under the NIST PQC reference implementations that publish the same API. Unlike ecdsa-unattributed the migration verdict is not exact — the two candidates sit on opposite sides of it — so this row asserts neither. Inventory-tier for the same reason as webcrypto-unattributed: scoring it either way is a guess, and guessing vulnerable told FIPS 204 and FIPS 205 implementations to migrate to FIPS 204. Resolve by hand, or by the include path the build supplies."

[[algorithm]]
id = "aes-unattributed"
display_name = "AES (key size and mode not stated at the call site)"
family = "AES"
primitive = "block-cipher"
quantum_status = "QuantumSafe"
notes = "Marker for an AES call site that names neither a key size nor a mode — Cipher/engine constructors that take both from a key object or a later call (BouncyCastle AESEngine, .NET Aes.Create(), Go crypto/aes.NewCipher, CryptoJS.AES). Same semantics as webcrypto-unattributed: the operation is real and locatable, the parameters are not in the source. Scored as QuantumSafe because the alternative is guessing AES-128 or AES-256, and both guesses are wrong on some call sites. Resolve by hand, or by whichever call supplies the key."

[[algorithm]]
id = "aes-unattributed-gcm"
display_name = "AES-GCM (key size not stated at the call site)"
family = "AES"
primitive = "ae"
quantum_status = "QuantumSafe"
notes = "Marker for an AES-GCM call site whose key size is supplied by a key object rather than the transformation string — `Cipher.getInstance(\"AES/GCM/NoPadding\")` is the common case, since the JCE `AES_128`/`AES_192`/`AES_256` forms are optional and rare. The mode is stated and the key size is not, so this row asserts only the mode."

[[algorithm]]
id = "aes-unattributed-ecb"
display_name = "AES-ECB (key size not stated at the call site)"
family = "AES"
primitive = "block-cipher"
quantum_status = "BrokenClassically"
replacement = "aes-256-gcm"
notes = "Marker for an AES-ECB call site whose key size is not in the source. Unlike the other two AES sentinels this one is scored, because the verdict does not depend on the missing parameter: ECB is never appropriate beyond a single block at any key size — the same reason aes-128-ecb, aes-192-ecb and aes-256-ecb all carry BrokenClassically."

[[algorithm]]
id = "crypto-provider-registration"
display_name = "Crypto provider registration (topology marker)"
family = "Provider"
primitive = "other"
quantum_status = "QuantumSafe"
notes = "Marker for registering or instantiating a JCA/JCE provider — `new BouncyCastleProvider()` and equivalents. It selects an implementation, not an algorithm, so it names none. Useful as an inventory anchor: a provider registration means the algorithms in that provider are reachable from this codebase."

[[algorithm]]
id = "tls-cipher-suite-config"
display_name = "TLS cipher-suite configuration (topology marker)"
family = "TLS"
primitive = "other"
quantum_status = "QuantumSafe"
notes = "Marker for a call that configures which cipher suites a TLS context will offer — OpenSSL SSL_CTX_set_cipher_list and equivalents — where the suite string named no algorithm we can fault. Companion to tls-client-config/tls-server-config for the case where the topology role (client or server) is also not stated."

[[algorithm]]
id = "weak-cipher-suite"
display_name = "TLS cipher suite selecting a broken primitive"
family = "TLS"
primitive = "other"
classical_security_bits = 0
nist_quantum_security_level = 0
quantum_status = "BrokenClassically"
replacement = "aes-256-gcm"
notes = "A cipher-suite string that enables at least one classically broken primitive — RC4, DES, MD5, NULL or EXPORT — without stating which suite is finally negotiated. Companion to tls-cipher-suite-config, which is the same call site when nothing in the string can be faulted. The matched string is in the finding message; the id must not name one of the alternatives, because a string selecting DES was previously reported as RC4."

[[algorithm]]
id = "pbkdf2-unattributed"
display_name = "PBKDF2 (hash not stated at the call site)"
family = "PBKDF2"
primitive = "kdf"
quantum_status = "QuantumSafe"
notes = "Marker for a PBKDF2 call whose hash is a generic type parameter — `pbkdf2::<...>(...)` where the turbofish names no SHA-2 variant. The previous id was `sha-256`, which reported a digest the call site does not name and would have put SHA-256 in the CBOM for a PBKDF2-HMAC-MD5 site. Scored as QuantumSafe, matching the sized PBKDF2 rows, because the residual risk here is the iteration count and not the quantum one."

[[algorithm]]
id = "csprng"
display_name = "CSPRNG (cryptographically secure random)"
family = "RNG"
primitive = "drbg"
quantum_status = "QuantumSafe"
notes = "Marker for a call into a platform CSPRNG — .NET RandomNumberGenerator.Create() and equivalents. Not an encryption algorithm; recorded so the CBOM shows where key and IV material originates. Quantum-relevant only through the key sizes it is asked for, which are at the caller."

[[algorithm]]
id = "jwt-alg-none"
display_name = "JWT alg=none (signature verification disabled)"
family = "JWT"
primitive = "other"
classical_security_bits = 0
nist_quantum_security_level = 0
quantum_status = "BrokenClassically"
notes = "CWE-347: JWT with alg=none disables signature verification entirely. CVE-2015-9235 class. Not a quantum issue — already broken classically. Distinct from rsa-1024 which is a real algorithm with a too-small key."
