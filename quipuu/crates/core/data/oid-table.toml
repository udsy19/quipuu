# ECDSA / EC public key
# -----------------------------------------------------------------------------

[[oid]]
oid = "1.2.840.10045.2.1"
algorithm_id = "ecdsa-unattributed"
determines = "family"
note = "id-ecPublicKey — SPKI key type. The curve OID is in algorithm.parameters; scan-certs refines this when it is a named curve, and this row is what remains for explicit parameters."

[[oid]]
oid = "1.2.840.10045.4.1"
algorithm_id = "ecdsa-sha1"
determines = "family"
note = "ecdsa-with-SHA1 — BROKEN."

[[oid]]
oid = "1.2.840.10045.4.3.2"
algorithm_id = "ecdsa-unattributed"
determines = "family"
note = "ecdsa-with-SHA256 — names the digest. The curve comes from the key, not from this OID."

[[oid]]
oid = "1.2.840.10045.4.3.3"
algorithm_id = "ecdsa-unattributed"
determines = "family"
note = "ecdsa-with-SHA384 — names the digest, not the curve."

[[oid]]
oid = "1.2.840.10045.4.3.4"
algorithm_id = "ecdsa-unattributed"
determines = "family"
note = "ecdsa-with-SHA512 — names the digest, not the curve."

