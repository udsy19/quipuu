# OID Table — OID → algorithm-id
#
# Maps X.509 / PKCS / NIST CSOR OIDs to the canonical algorithm-id used in
# `algorithm-table.toml`. Used by scan-certs (x509-parser PublicKey::Unknown
# fallback path) and scan-source for OID-string literals in code.
#
# Two flavours of OID matter here:
#   - SubjectPublicKeyInfo.algorithm OID    (the *key* type)
#   - Certificate.signatureAlgorithm OID    (how it was signed)
# An algorithm-id may legitimately appear as both (RSA key + RSA signature).
#
# Sources:
#   * RFC 3279, 4055, 4491, 5480, 5912, 8017 — classical
#   * RFC 9881 (ML-DSA cert OIDs), RFC 9909 (SLH-DSA), RFC 9935 (ML-KEM)
#   * NIST CSOR (csrc.nist.gov/csrc/media/Projects/Computer-Security-Objects-Register)
#   * IANA TLS Parameters (knowledge/sources/iana-tls-*.csv) for TLS codepoints
#
# Format: each entry is [[oid]] with `oid`, `algorithm_id`, `determines`, and an
# optional `note`.
#
# `determines` states what the OID itself pins down, and it is not decoration:
#   "algorithm" — the OID fixes every parameter its algorithm-id names (a curve
#                 OID, a hash OID, id-alg-ml-kem-768).
#   "family"    — the OID names a key type, or a padding and a digest, and the
#                 remaining parameters live somewhere we do not parse (the SPKI
#                 modulus, DomainParameters, RSASSA-PSS-params). Such an entry
#                 must resolve to an algorithm-id that names no parameter.
# Enforced by crates/cli/tests/algorithm_parameters.rs. sha512WithRSAEncryption
# used to resolve to `rsa-pkcs1-sha512-4096`, reporting 152-bit classical
# security for any certificate a CA had signed with SHA-512.

# -----------------------------------------------------------------------------
# RSA — key + signature OIDs
# -----------------------------------------------------------------------------

[[oid]]
oid = "1.2.840.113549.1.1.1"
algorithm_id = "rsa-unattributed"
determines = "family"
note = "rsaEncryption — SPKI key type. Encodes no modulus size; scan-certs refines this to a sized id from the parsed modulus, and this row is what remains when the modulus cannot be read."

[[oid]]
oid = "1.2.840.113549.1.1.10"
algorithm_id = "rsa-pss-unattributed"
determines = "family"
note = "id-RSASSA-PSS — signature. Hash, MGF and salt length are in RSASSA-PSS-params, which we do not parse; the modulus is not here at all."

[[oid]]
oid = "1.2.840.113549.1.1.4"
algorithm_id = "rsa-pkcs1-md5"
determines = "family"
note = "md5WithRSAEncryption — BROKEN."

[[oid]]
oid = "1.2.840.113549.1.1.5"
algorithm_id = "rsa-pkcs1-sha1"
determines = "family"
note = "sha1WithRSAEncryption — BROKEN."

[[oid]]
oid = "1.2.840.113549.1.1.11"
algorithm_id = "rsa-pkcs1-sha256"
determines = "family"
note = "sha256WithRSAEncryption. Names the digest and the padding, not the modulus."

[[oid]]
oid = "1.2.840.113549.1.1.12"
algorithm_id = "rsa-pkcs1-sha384"
determines = "family"
note = "sha384WithRSAEncryption. Names the digest and the padding, not the modulus."

[[oid]]
oid = "1.2.840.113549.1.1.13"
algorithm_id = "rsa-pkcs1-sha512"
determines = "family"
note = "sha512WithRSAEncryption. Names the digest and the padding, not the modulus."

[[oid]]
oid = "1.2.840.113549.1.1.7"
algorithm_id = "rsa-oaep"
determines = "family"
note = "id-RSAES-OAEP — RSA-OAEP encryption. The OAEP parameters default to MGF1-SHA1 when absent (RFC 8017 A.2.1); the modulus is not encoded here."

