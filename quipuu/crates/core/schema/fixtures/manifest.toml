# Fixture manifest for schema contract tests.
# Each [[case]] entry drives schema_roundtrip.rs.
#
# Fields:
#   schema      - schema name (without .schema.json suffix)
#   file        - path relative to the fixtures/ directory
#   expect      - "valid" or "invalid"
#   rust_type   - optional: Rust type to serde round-trip (fully qualified)
#   error_instance_path - optional: JSON Pointer where we expect the error
#   error_keyword       - optional: JSON Schema keyword that must trigger

# ── finding ──────────────────────────────────────────────────────────────────

[[case]]
schema = "finding"
file   = "finding/valid.rsa2048-critical.json"
expect = "valid"

[[case]]
schema = "finding"
file   = "finding/valid.aes256-no-score.json"
expect = "valid"

[[case]]
schema = "finding"
file   = "finding/valid.with-archetype.json"
expect = "valid"

# P3 guard: provenance = "ai-assisted" must fail the enum constraint
[[case]]
schema = "finding"
file   = "finding/invalid.provenance-ai.json"
expect = "invalid"
error_instance_path = "/provenance"
error_keyword = "enum"

[[case]]
schema = "finding"
file   = "finding/invalid.bad-rule-id.json"
expect = "invalid"
error_instance_path = "/ruleId"
error_keyword = "pattern"

[[case]]
schema = "finding"
file   = "finding/invalid.missing-required.json"
expect = "invalid"

