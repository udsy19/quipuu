# .pre-commit-hooks.yaml — quipuu pre-commit framework hook definition
#
# This file is the hook *definition* that lives in the quipuu repo.
# It is read by pre-commit when users add this repo as a hook source.
#
# USAGE IN A DOWNSTREAM REPO:
#
#   Add the following to your .pre-commit-config.yaml:
#
#     repos:
#       - repo: https://github.com/<TBD>/quipuu
#         rev: v0.1.0          # pin to a release tag
#         hooks:
#           - id: quipuu-scan
#
#   Then run:
#     pre-commit install
#
#   quipuu will now run on every `git commit`.
#   It reads .quipuu.toml from the repo root when present.

- id: quipuu-scan
  name: quipuu — cryptographic hygiene scan
  language: system

  # The hook runs `quipuu scan` on the files that are staged for commit.
  # pre-commit passes the list of staged files as positional arguments;
  # quipuu accepts a path or list of paths to scan.
  #
  # --fail-on critical  exits 1 when a reported finding scores at severity
  #                     Critical, so medium/low findings don't block every
  #                     commit.  Change to 'high' or 'medium' to tighten this,
  #                     or 'policy' to gate at whatever the active policy's
  #                     [ci] fail_on says.  An unparseable value exits 2.
  #
  # --config is optional; quipuu auto-discovers .quipuu.toml at the
  # repo root.  Uncomment and adjust the path if your config lives elsewhere.
  entry: quipuu scan
  args:
    - --fail-on
    - critical
    # - --config
    # - .quipuu.toml

  # Pass the list of staged file paths to quipuu.
  pass_filenames: true

  # File types to check.  Pre-commit filters to these before invoking the hook.
  # quipuu is file-type-agnostic; "files" here is a regex matched against
  # the staged file path so you can narrow it (e.g. only Rust/Go/Python files).
  # Empty string means "all staged files".
  files: ""

  # Do not run this hook on files that match these patterns.
  # Adjust to skip vendored code, generated files, or test fixtures.
  exclude: |
    (?x)(
      ^vendor/|
      ^node_modules/|
      ^\.cargo/|
      ^target/|
      tests/fixtures/
    )

  # Run even on untracked files when called with `pre-commit run --all-files`.
  always_run: false

  # Minimum pre-commit version required.
  minimum_pre_commit_version: "2.9.0"

  # Verbose output is off by default; set verbose: true to see quipuu's
  # full output even when the hook passes.
  verbose: false
