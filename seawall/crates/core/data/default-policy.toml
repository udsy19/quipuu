# Default policy — NIST IR 8547 IPD (November 2024)
#
# This is the canonical default (preset name: `nist-default`). Override with
# `--policy <file.toml>` or another built-in preset — run
# `seawall policy list` for the shipped set.
#
# Source: NIST IR 8547 IPD — "Transition to Post-Quantum Cryptographic Standards"
# https://csrc.nist.gov/pubs/ir/8547/ipd  (also knowledge/sources/NIST.IR.8547.ipd.pdf)
# Status: still IPD as of 2026-06-12. Comment period closed Jan 2025. No final yet.

[meta]
name = "nist-default"
display_name = "NIST IR 8547 IPD (Nov 2024)"
source_url = "https://csrc.nist.gov/pubs/ir/8547/ipd"
notes = """
The IPD is what we ship as the default; when NIST publishes the final IR 8547,
update the years below in the same release. CNSA 2.0 (NSA) is more aggressive —
use the `nsa-cnsa2` preset for defense-aligned customers.
"""

# -----------------------------------------------------------------------------
# Algorithm timeline — per NIST IR 8547 IPD Tables 2 & 4
# All "after YEAR" thresholds are exclusive: after-2030 means findings reach
# Critical from 2031-01-01 onward.
# -----------------------------------------------------------------------------
[deprecation]
# Classical asymmetric @ 112-bit security: RSA-2048, P-224, FFDH-2048, etc.
asymmetric_112bit_deprecated_after = 2030
asymmetric_112bit_disallowed_after = 2035

# Classical asymmetric @ ≥128-bit security: RSA-3072+, P-256+, EdDSA, X25519, X448.
# No intermediate deprecation step per IR 8547 §4.1.2.
asymmetric_128bit_plus_disallowed_after = 2035

# Symmetric carve-out (IR 8547 §4.1.3 — verbatim "all NIST-approved symmetric
# primitives that provide at least 128 bits of classical security are believed
# to meet the requirements of at least Category 1 security").
aes_128_acceptable = true
aes_192_acceptable = true
aes_256_acceptable = true
sha_256_acceptable = true
sha_384_acceptable = true
sha_512_acceptable = true

# Already-broken classical primitives (SP 800-131A Rev 3 IPD). Never acceptable.
# These get max severity regardless of any other policy axis.
classically_broken = ["md5", "sha-1", "sha-224", "des", "3des", "rc4"]

# Algorithm ids this *jurisdiction* excludes from its approved list even though
# they are not broken for anyone else — scored at the full
# algorithm-vulnerability weight and never hidden as quantum-safe inventory.
# Empty here: IR 8547 takes no position beyond the timeline above. See
# `crates/core/data/policies/nsa-cnsa2.toml`, which uses it for AES-128 and
# SHA-256.
policy_disallowed = []

# -----------------------------------------------------------------------------
# QuantumRiskScore weights (D-10) — additive, totals 100.
# Adjusting these requires re-running the regression tests; document why.
# -----------------------------------------------------------------------------
[risk_weights]
algorithm_vulnerability = 40
usage_context           = 25
data_shelf_life         = 15
exposure                = 10
detection_confidence    = 10

# -----------------------------------------------------------------------------
# Algorithm-vulnerability sub-weights — added into AlgorithmVulnerability (max 40).
# Map quantum_status (from algorithm-table.toml) to a base score.
# -----------------------------------------------------------------------------
[algorithm_vulnerability]
BrokenClassically = 40   # never policy-acceptable
BrokenByShor      = 40   # Shor-vulnerable asymmetric — top priority
WeakenedByGrover  = 15   # AES-128, SHA-224 — flag but lower severity
QuantumSafe       = 0
PqcFinal          = 0    # ML-KEM/DSA/SLH-DSA — celebrated
PqcDraft          = 5    # FN-DSA — present but not yet final FIPS

# -----------------------------------------------------------------------------
# Usage context (max 25) — what the algorithm is doing in the codebase
# -----------------------------------------------------------------------------
[usage_context]
key_establishment_long_lived = 25  # KEM/key-agree protecting data with shelf-life ≥ 7y
key_establishment_ephemeral  = 15  # TLS session keys, ephemeral DH
data_at_rest_encryption      = 22  # database/disk encryption keys
signature_long_lived         = 12  # code signing, document signing
signature_ephemeral          = 5   # short-lived JWTs, session tokens
authentication_only          = 5   # not HNDL-relevant (attacker needs cert NOW)
hashing                      = 3   # context-dependent
unknown                      = 10  # conservative default

# -----------------------------------------------------------------------------
# Data shelf-life (max 15) — driven by scope tags below
# -----------------------------------------------------------------------------
[data_shelf_life]
ephemeral = 0    # < 1 day
short     = 3    # < 7 years
medium    = 10   # 7-30 years
long      = 15   # ≥ 30 years (HNDL-CRITICAL)

# Scope-glob → shelf-life bucket. First match wins.
# These ship as defaults; users override in their own policy.toml.
[shelf_life_tags]
"./services/medical/**"   = "long"     # HIPAA + OSHA 30y precedent
"./services/legal/**"     = "long"
"./services/financial/**" = "medium"   # SEC 17a-4 7y; banking 5-10y
"./services/identity/**"  = "medium"   # PII, GDPR retention
"./scratch/**"            = "ephemeral"
"./test/**"               = "ephemeral"
"./examples/**"           = "ephemeral"
"**/*_test.go"            = "ephemeral"
"**/*_test.py"            = "ephemeral"

# Default for files matching nothing above.
[shelf_life_default]
bucket = "short"

# -----------------------------------------------------------------------------
# Exposure (max 10) — assigned at the finding level by the scanner
# -----------------------------------------------------------------------------
[exposure]
public_internet  = 10
internal_service = 4
local_only       = 1

# -----------------------------------------------------------------------------
# Detection confidence (max 10) — from the rule's extraction layer
# -----------------------------------------------------------------------------
[detection_confidence]
literal_arg     = 10   # rsa.GenerateKey(rand.Reader, 2048) — 2048 is a literal int
type_name       = 8    # Rust type path Aes256Gcm — unambiguous
variable        = 5    # value flows in from a const/var; partial propagation
string_table    = 2    # algorithm chosen via runtime lookup
unknown         = 3    # fallback

# -----------------------------------------------------------------------------
# Severity bands — what QuantumRiskScore maps to in reports + SARIF
# -----------------------------------------------------------------------------
[severity_bands]
critical = 75   # ≥ 75
high     = 50   # 50..74
medium   = 25   # 25..49
low      = 10   # 10..24
safe     = 0    # < 10

# -----------------------------------------------------------------------------
# HNDL flagging — any finding meeting all of these gets the HNDL-CRITICAL tag
# -----------------------------------------------------------------------------
[hndl_flag]
require_quantum_status_in     = ["BrokenByShor", "BrokenClassically"]
require_usage_context_in      = ["key_establishment_long_lived",
                                  "key_establishment_ephemeral",
                                  "data_at_rest_encryption"]
require_min_shelf_life_bucket = "medium"  # 7+ years

# -----------------------------------------------------------------------------
# CI gate — --fail-on threshold default
# -----------------------------------------------------------------------------
[ci]
fail_on = "critical"   # exit non-zero if any Critical finding present
