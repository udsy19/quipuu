# ============================================================================
# RustCrypto — Sha256 (sha2 crate)
# ============================================================================

[[extract]]
id = "RST-020"
language = "rust"
query = """
(call_expression
  function: (scoped_identifier
    path: (identifier) @cls (#match? @cls "^Sha(256|384|512)$")
    name: (identifier) @fn (#match? @fn "^(new|digest)$")))
"""
captures = { cls = "ident", fn = "ident" }
api = "rustcrypto.{cls}.digest"
description = "sha2 crate Sha256/Sha384/Sha512 hash."

[[classify]]
id = "CRYPTO-520"
when.api = "^rustcrypto\\.Sha256\\.digest$"
algorithm_id = "sha-256"
severity_hint = "auto"
message = "RustCrypto Sha256 — SHA-256 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-521"
when.api = "^rustcrypto\\.Sha384\\.digest$"
algorithm_id = "sha-384"
severity_hint = "auto"
message = "RustCrypto Sha384 — SHA-384 hash. Quantum-safe."

[[classify]]
id = "CRYPTO-522"
when.api = "^rustcrypto\\.Sha512\\.digest$"
algorithm_id = "sha-512"
severity_hint = "auto"
message = "RustCrypto Sha512 — SHA-512 hash. Quantum-safe."

