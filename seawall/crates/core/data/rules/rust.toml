# ============================================================================
# rsa crate — RsaPrivateKey::new
# ============================================================================

[[extract]]
id = "RST-040"
language = "rust"
query = """
(call_expression
  function: (scoped_identifier
    path: (identifier) @cls (#eq? @cls "RsaPrivateKey")
    name: (identifier) @fn (#eq? @fn "new"))
  arguments: (arguments
    (_)
    (integer_literal) @bits))
"""
captures = { cls = "ident", fn = "ident", bits = "literal_int" }
api = "rsa.RsaPrivateKey.new"
description = "rsa crate RsaPrivateKey::new(rng, bits) — RSA key generation."

[[classify]]
id = "CRYPTO-540"
when.api = "^rsa\\.RsaPrivateKey\\.new$"
when.args.bits = { lt = 2048 }
algorithm_id = "rsa-undersized"
severity_hint = "critical"
message = "rsa::RsaPrivateKey::new({bits} bits) — below 2048-bit floor."
cwe = "CWE-326"

[[classify]]
id = "CRYPTO-541"
when.api = "^rsa\\.RsaPrivateKey\\.new$"
when.args.bits = 2048
algorithm_id = "rsa-2048"
severity_hint = "auto"
message = "rsa::RsaPrivateKey::new(2048 bits) — quantum-vulnerable: NIST IR 8547 deprecates 2030."

[[classify]]
id = "CRYPTO-542"
when.api = "^rsa\\.RsaPrivateKey\\.new$"
when.args.bits = { ge = 4096 }
algorithm_id = "rsa-4096"
severity_hint = "auto"
message = "rsa::RsaPrivateKey::new({bits} bits) — larger key does NOT protect against Shor."

# Catch-all: callers like rsa/src/pkcs1v15/signing_key.rs:58 pass `bit_size`
# as a variable, so `bits` is never extracted. Without this rule the
# finding silently disappears. Map to rsa-2048 as the conservative default.
[[classify]]
id = "CRYPTO-543"
when.api = "^rsa\\.RsaPrivateKey\\.new$"
algorithm_id = "rsa-unattributed"
severity_hint = "auto"
message = "rsa::RsaPrivateKey::new(rng, bit_size) — bit size is a runtime variable; cannot statically verify it meets the 2048-bit floor. Quantum-vulnerable to Shor in any case."

# ============================================================================
# rsa pkcs1v15 / pss — SigningKey::<Hash>::new
# ============================================================================
# The hash algorithm is encoded in the turbofish — captured separately by
# match_rust_callee via `extract_turbofish_inner` and exposed as the
# `turbofish` capture.

[[classify]]
id = "CRYPTO-544"
when.api = "^rsa\\.SigningKey\\.new$"
when.args.turbofish = { regex = "Sha256" }
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "auto"
message = "rsa::SigningKey::<Sha256>::new — RSA-PKCS1-SHA256 signing key. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-545"
when.api = "^rsa\\.SigningKey\\.new$"
when.args.turbofish = { regex = "Sha384" }
algorithm_id = "rsa-pkcs1-sha384"
severity_hint = "auto"
message = "rsa::SigningKey::<Sha384>::new — RSA-PKCS1-SHA384 signing key. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-546"
when.api = "^rsa\\.SigningKey\\.new$"
when.args.turbofish = { regex = "Sha512" }
algorithm_id = "rsa-pkcs1-sha512"
severity_hint = "auto"
message = "rsa::SigningKey::<Sha512>::new — RSA-PKCS1-SHA512 signing key. Quantum-vulnerable."

[[classify]]
id = "CRYPTO-547"
when.api = "^rsa\\.SigningKey\\.new$"
algorithm_id = "rsa-pkcs1-sha256"
severity_hint = "auto"
message = "rsa::SigningKey::new — RSA signing key construction; hash algorithm not statically determinable. Quantum-vulnerable."

