# CNSA 2.0 preset — NSA Commercial National Security Algorithm Suite 2.0.
#
# Select with `--policy nsa-cnsa2`, or `preset = "nsa-cnsa2"` in .seawall.toml.
#
# Scope: National Security Systems (NSS), DoD, the Intelligence Community and
# NSS contractors. It is deliberately stricter than the `nist-default` profile
# in ways that matter for ordinary code: CNSA 2.0 approves AES-256 and SHA-384+
# only, so AES-128 and SHA-256 are compliance findings here and are not in
# NIST IR 8547. Do not run this profile against a commercial codebase and read
# the result as a NIST verdict.
#
# Sources (see knowledge/09-regulatory/README.md §2 for the full extraction):
# - CNSA 2.0 advisory, 2022-09-07
#   https://www.nsa.gov/Press-Room/News-Highlights/Article/Article/3148990/
# - CNSA 2.0 FAQ v2.1, December 2024
#   https://media.defense.gov/2025/May/30/2003728741/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS.PDF
# - NSM-10, 2022-05-04
# Verified: 2026-08-27.

[meta]
name = "nsa-cnsa2"
display_name = "NSA CNSA 2.0 (National Security Systems)"
source_url = "https://media.defense.gov/2025/May/30/2003728741/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS.PDF"
notes = """
Approved for NSS: ML-KEM-1024, ML-DSA-87, LMS / single-tree XMSS for firmware
signing, AES-256, SHA-384 and SHA-512. SLH-DSA and FN-DSA are explicitly NOT
approved for NSS, and the lower ML-KEM / ML-DSA parameter sets do not meet the
suite. Everything CNSA 2.0 leaves off that list is reported at full
algorithm-vulnerability weight via `deprecation.policy_disallowed`.
"""

# -----------------------------------------------------------------------------
# Timeline — CNSA 2.0 staggered exclusive-use dates, not IR 8547's.
# Surfaced in the TUI deadline countdown and in the policy header.
# -----------------------------------------------------------------------------
[deprecation]
# "Support and prefer CNSA 2.0 by 2025" across software/firmware signing, web
# browsers, servers and cloud services — so classical asymmetric is already
# deprecated for NSS today.
asymmetric_112bit_deprecated_after = 2025
# Exclusive use by 2030 for firmware signing and traditional networking.
asymmetric_112bit_disallowed_after = 2030
# Exclusive use by 2033 for operating systems, cloud services, constrained
# devices and large PKIs — the latest date in the CNSA 2.0 table.
asymmetric_128bit_plus_disallowed_after = 2033

# CNSA 2.0 symmetric/hash carve-out is narrower than IR 8547's: AES-256 and
# SHA-384+ only.
aes_128_acceptable = false
aes_192_acceptable = false
aes_256_acceptable = true
sha_256_acceptable = false
sha_384_acceptable = true
sha_512_acceptable = true

classically_broken = ["md5", "sha-1", "sha-224", "des", "3des", "rc4"]

# Not broken — simply not on the CNSA 2.0 approved list, and therefore a
# compliance finding on an NSS codebase. Grouped by why.
policy_disallowed = [
  # Symmetric below AES-256.
  "aes-128-gcm", "aes-128-cbc", "aes-128-ecb",
  "aes-192-gcm", "aes-192-ecb",
  # Not a CNSA 2.0 algorithm at all.
  "chacha20-poly1305",
  # Hashing below SHA-384.
  "sha-256", "sha3-256",
  # PQC parameter sets below ML-KEM-1024 / ML-DSA-87.
  "ml-kem-512", "ml-kem-768", "ml-dsa-44", "ml-dsa-65",
  # "SLH-DSA and FN-DSA are not approved for NSS" — CNSA 2.0 FAQ v2.1.
  "slh-dsa-sha2-128s", "slh-dsa-sha2-128f",
  "slh-dsa-sha2-192s", "slh-dsa-sha2-192f",
  "slh-dsa-sha2-256s", "slh-dsa-sha2-256f",
  "slh-dsa-shake-128s", "slh-dsa-shake-128f",
  "slh-dsa-shake-192s", "slh-dsa-shake-192f",
  "slh-dsa-shake-256s", "slh-dsa-shake-256f",
  "fn-dsa-512", "fn-dsa-1024",
  # Hybrids carrying an under-strength KEM, plus the pre-FIPS Kyber draft.
  # secp384r1-mlkem1024 is left approved: CNSA 2.0 does not require a hybrid
  # but tolerates one when a protocol demands it, and that group carries the
  # required ML-KEM-1024.
  "x25519-mlkem768", "secp256r1-mlkem768", "x25519-kyber768-draft00",
]

# -----------------------------------------------------------------------------
# Axis weights are unchanged from nist-default. Divergence between the two
# profiles must come from the algorithm verdicts above, not from moving the
# scoring goalposts twice.
# -----------------------------------------------------------------------------
[risk_weights]
algorithm_vulnerability = 40
usage_context           = 25
data_shelf_life         = 15
exposure                = 10
detection_confidence    = 10

[algorithm_vulnerability]
BrokenClassically = 40
BrokenByShor      = 40
# AES-128 and SHA-224 are not "weakened" for NSS, they are off the suite.
WeakenedByGrover  = 40
QuantumSafe       = 0
PqcFinal          = 0    # ML-KEM-1024 / ML-DSA-87; the rest are disallowed above
PqcDraft          = 40   # FN-DSA — not approved for NSS

[usage_context]
key_establishment_long_lived = 25
key_establishment_ephemeral  = 15
data_at_rest_encryption      = 22
signature_long_lived         = 12
signature_ephemeral          = 5
authentication_only          = 5
hashing                      = 3
unknown                      = 10

[data_shelf_life]
ephemeral = 0
short     = 3
medium    = 10
long      = 15

[shelf_life_tags]
"./services/medical/**"   = "long"
"./services/legal/**"     = "long"
"./services/financial/**" = "medium"
"./services/identity/**"  = "medium"
"./scratch/**"            = "ephemeral"
"./test/**"               = "ephemeral"
"./examples/**"           = "ephemeral"
"**/*_test.go"            = "ephemeral"
"**/*_test.py"            = "ephemeral"

# NSS data is classified or export-controlled and is retained for decades.
# NSM-10 §1 states the harvest-now-decrypt-later threat is the reason for the
# whole transition, so the unmatched-file default is 7-30 years, not < 7.
[shelf_life_default]
bucket = "medium"

[exposure]
public_internet  = 10
internal_service = 4
local_only       = 1

[detection_confidence]
literal_arg     = 10
type_name       = 8
variable        = 5
string_table    = 2
unknown         = 3

[severity_bands]
critical = 75
high     = 50
medium   = 25
low      = 10
safe     = 0

[hndl_flag]
require_quantum_status_in     = ["BrokenByShor", "BrokenClassically"]
require_usage_context_in      = ["key_establishment_long_lived",
                                  "key_establishment_ephemeral",
                                  "data_at_rest_encryption"]
# NSS assumes long-lived data everywhere, so the shelf-life floor drops a bucket.
require_min_shelf_life_bucket = "short"

# CNSA 2.0 is a mandate, not guidance: the NSS acquisition gate is 2027-01-01.
[ci]
fail_on = "high"
