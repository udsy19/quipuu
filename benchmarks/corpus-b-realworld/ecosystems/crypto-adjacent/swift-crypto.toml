[project]
name = "swift-crypto"
ecosystem = "crypto-adjacent"
canonical_id = "crypto-adjacent:github.com/apple/swift-crypto"
description = "Swift Crypto — Apple's open-source Swift implementation of CryptoKit"
why_included = "Apple's Swift cryptographic library; P256/P384/P521 ECDH/ECDSA; Curve25519; AES-GCM/ChaCha20Poly1305; HKDF; SHA-2; important PQC migration surface for Apple ecosystem services"

[repo]
url = "https://github.com/apple/swift-crypto"
# Re-pinned 2026-08-29. The original pin 74c0c332df25c122b79e1d0a5299af0509663f11 is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "47d3869a7291f085c1fb9fb1e6d3b97a793f45c6"
license = "Apache-2.0"
language_primary = "swift"
languages_secondary = ["c"]

