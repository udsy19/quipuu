[project]
name = "wolfssl"
ecosystem = "crypto-adjacent"
canonical_id = "crypto-adjacent:github.com/wolfSSL/wolfssl"
description = "wolfSSL — lightweight SSL/TLS library for embedded and IoT devices, with PQC support"
why_included = "Embedded/IoT TLS library; FIPS 140-3 validated; Kyber/Dilithium integration; widely used in automotive, aerospace, IoT; important PQC migration surface for constrained devices"

[repo]
url = "https://github.com/wolfSSL/wolfssl"
# Re-pinned 2026-08-29. The original pin 5cd633798c684693d06e6cd8dc5a53adbef888e4 is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "480e16303a05ca6bbf6acefb96033d70d64aa495"
license = "GPL-2.0"
language_primary = "c"
languages_secondary = ["asm"]

[metadata]
downloads_monthly = 2000000
captured_at = "2026-06-15"
stars = 2400
last_commit_date = "2026-06-14"

[selection]
selection_method = "curated-crypto-adjacent"
selection_rank = 8
substituted_for = ""

[scan_hints]
scan_paths = ["wolfcrypt/src/", "src/tls.c", "src/tls13.c"]
exclude_paths = ["tests/", "examples/"]
expected_languages = ["c", "asm"]
