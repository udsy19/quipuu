[project]
name = "liboqs"
ecosystem = "crypto-adjacent"
canonical_id = "crypto-adjacent:github.com/open-quantum-safe/liboqs"
description = "liboqs — Open Quantum Safe C library of post-quantum cryptographic algorithms"
why_included = "Reference PQC implementation library; ML-KEM/Kyber, ML-DSA/Dilithium, SLH-DSA/SPHINCS+, FrodoKEM, HQC; used by OQS-OpenSSL, OQS-BoringSSL, OQS-Provider; ground-truth for PQC detection"

[repo]
url = "https://github.com/open-quantum-safe/liboqs"
# Re-pinned 2026-08-29. The original pin 3bd5094dec1dfbaac1a03957c35ba5e487f5b890 is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "8979276ad1eb008215aa78a3c56b3649f604bbb1"
license = "MIT"
language_primary = "c"
languages_secondary = ["asm"]

[metadata]
downloads_monthly = 500000
captured_at = "2026-06-15"
stars = 1900
last_commit_date = "2026-06-12"

[selection]
selection_method = "curated-crypto-adjacent"
selection_rank = 7
substituted_for = ""

[scan_hints]
scan_paths = ["src/kem/", "src/sig/", "src/common/"]
exclude_paths = ["tests/"]
expected_languages = ["c", "asm"]
