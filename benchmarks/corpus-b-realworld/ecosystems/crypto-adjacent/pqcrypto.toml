[project]
name = "pqcrypto"
ecosystem = "crypto-adjacent"
canonical_id = "crypto-adjacent:github.com/rustpq/pqcrypto"
description = "pqcrypto — Rust bindings to PQClean post-quantum algorithm implementations"
why_included = "Comprehensive PQC Rust bindings (Kyber/ML-KEM, Dilithium/ML-DSA, Falcon, SPHINCS+, FrodoKEM, HQC, McEliece); PQClean-verified implementations; important for Rust PQC adoption path"

[repo]
url = "https://github.com/rustpq/pqcrypto"
# Re-pinned 2026-08-29. The original pin cc7902403ec3e53df9cd0f25f5775c762ca7ccb5 is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "a63b4bcc0ef768f03d145e0913103bc75dc69223"
license = "MIT"
language_primary = "rust"
languages_secondary = ["c"]

[metadata]
downloads_monthly = 200000
captured_at = "2026-06-15"
stars = 450
last_commit_date = "2026-05-01"

[selection]
selection_method = "curated-crypto-adjacent"
selection_rank = 24
substituted_for = ""

[scan_hints]
# Repaired 2026-08-29. The crates were renamed to their FIPS names:
# pqcrypto-kyber -> pqcrypto-mlkem, pqcrypto-dilithium -> pqcrypto-mldsa.
# pqcrypto-sphincsplus keeps its pre-FIPS name upstream and is unchanged.
scan_paths = ["pqcrypto-mlkem/src/", "pqcrypto-mldsa/src/", "pqcrypto-sphincsplus/src/"]
exclude_paths = []
expected_languages = ["rust"]
