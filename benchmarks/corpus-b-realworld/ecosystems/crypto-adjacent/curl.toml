[project]
name = "curl"
ecosystem = "crypto-adjacent"
canonical_id = "crypto-adjacent:github.com/curl/curl"
description = "curl — URL transfer library supporting TLS via multiple backends (OpenSSL, GnuTLS, wolfSSL, aws-lc)"
why_included = "Ubiquitous HTTP/HTTPS client; multi-backend TLS (OpenSSL, GnuTLS, wolfSSL, BoringSSL, aws-lc); TLS 1.3; QUIC; PQC hybrid KEM testing via experimental builds"

[repo]
url = "https://github.com/curl/curl"
# Re-pinned 2026-08-29. The original pin 145aea47775217013748e6232ebcd76e8de600e1 is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "72766ecf8ab41a3384f8e1e1dc8b00c554322b78"
license = "curl"
language_primary = "c"
languages_secondary = []

[metadata]
downloads_monthly = 50000000
captured_at = "2026-06-15"
stars = 36000
last_commit_date = "2026-06-14"

[selection]
selection_method = "curated-crypto-adjacent"
selection_rank = 5
substituted_for = ""

[scan_hints]
