[project]
name = "tink-go"
ecosystem = "crypto-adjacent"
canonical_id = "crypto-adjacent:github.com/tink-crypto/tink-go"
description = "Google Tink (Go) — secure, easy-to-use cryptography API for Go"
why_included = "Google's high-level crypto API for Go; AEAD, hybrid encryption (DHKEM+HKDF+AES), digital signatures, MAC, JWT; PQC hybrid modes in development; widely used in Google products"

[repo]
url = "https://github.com/tink-crypto/tink-go"
# Re-pinned 2026-08-29. The original pin 1b6b2e274e85105bfa155183145a1dcfd63331f1 is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "ca6ac4c9d045f0bcfbf4c85900e3989b65be5a77"
license = "Apache-2.0"
language_primary = "go"
languages_secondary = []

[metadata]
downloads_monthly = 1000000
captured_at = "2026-06-15"
stars = 800
last_commit_date = "2026-06-12"

[selection]
selection_method = "curated-crypto-adjacent"
selection_rank = 20
substituted_for = "google/tink-cc (google/tink monorepo archived; tink-crypto/tink-go is the current Go release)"

[scan_hints]
scan_paths = ["aead/", "hybrid/", "signature/", "jwt/"]
exclude_paths = ["testutil/"]
expected_languages = ["go"]
