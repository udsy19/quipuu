[project]
name = "pyca-cryptography"
ecosystem = "crypto-adjacent"
canonical_id = "crypto-adjacent:github.com/pyca/cryptography"
description = "pyca/cryptography — Python cryptographic recipes and primitives library (also in pypi tier)"
why_included = "Cross-listed; canonical Python crypto for PQC migration reference; RSA/EC/X25519/Ed25519/ChaCha20/AES; Hazmat layer; FIPS-compliant builds; PQC via OQS provider integration"

[repo]
url = "https://github.com/pyca/cryptography"
# Re-pinned 2026-08-29. The original pin a63b4bcc0ef768f03d145e0913103bc75dc69223 is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "148ea72502d7502852187c3db252427343b28754"
license = "Apache-2.0"
language_primary = "python"
languages_secondary = ["rust"]

