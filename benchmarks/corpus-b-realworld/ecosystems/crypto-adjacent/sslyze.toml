[project]
name = "sslyze"
ecosystem = "crypto-adjacent"
canonical_id = "crypto-adjacent:github.com/nabla-c0d3/sslyze"
description = "SSLyze — fast and powerful SSL/TLS scanning tool"
why_included = "TLS scanning tool with cipher suite enumeration, certificate inspection, vulnerability detection; useful benchmark reference for scanner detection accuracy; Python-based TLS analysis"

[repo]
url = "https://github.com/nabla-c0d3/sslyze"
# Re-pinned 2026-08-29. The original pin 723dd38882584f95b80f53a0baf1b9562bcee28c is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "3bd5094dec1dfbaac1a03957c35ba5e487f5b890"
license = "LGPL-2.1"
language_primary = "python"
languages_secondary = []

[metadata]
downloads_monthly = 200000
captured_at = "2026-06-15"
stars = 3300
last_commit_date = "2026-05-01"

[selection]
selection_method = "curated-crypto-adjacent"
selection_rank = 10
substituted_for = "philipl/sslyze (invalid; correct repo is nabla-c0d3/sslyze)"

[scan_hints]
scan_paths = ["sslyze/"]
exclude_paths = ["tests/"]
expected_languages = ["python"]
