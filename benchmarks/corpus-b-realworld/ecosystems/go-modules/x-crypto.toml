[project]
name = "x-crypto"
ecosystem = "go-modules"
canonical_id = "go-modules:golang.org/x/crypto"
description = "Go extended cryptography package — SSH, bcrypt, PBKDF2, chacha20poly1305, argon2, blake2b"
why_included = "Top-5 Go modules by import count; extended crypto algorithms used by virtually every Go service; SSH protocol; bcrypt; argon2; critical PQC migration surface"

[repo]
url = "https://github.com/golang/crypto"
# Re-pinned 2026-08-29. The original pin a8cbf83f2be4a3b11c6e1d6e6e5c8d0a7b3f4e2c is not a
# commit in the repository this project clones, so `clone_all.sh` could never
# check it out: it clones with --no-checkout, the checkout failed, and the
# project was left with an empty working tree that every corpus figure counted
# as "scanned, zero findings". Ten of the unreachable pins are the pinned or
# current sha of a different project in this same corpus, so the pins were
# shuffled across project files at construction rather than lost since.
commit_sha = "afebf4cb4efb2b854282e03160da67120707f8f7"
license = "BSD-3-Clause"
language_primary = "go"
languages_secondary = []

[metadata]
downloads_monthly = 40000000
captured_at = "2026-06-15"
stars = 2800
last_commit_date = "2026-06-12"

[selection]
selection_method = "top-25-go-module-downloads"
selection_rank = 25
substituted_for = ""

[scan_hints]
scan_paths = ["ssh/", "argon2/", "bcrypt/", "pbkdf2/"]
exclude_paths = []
expected_languages = ["go"]
