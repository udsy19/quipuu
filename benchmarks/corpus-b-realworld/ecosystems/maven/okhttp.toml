[scan_hints]
# Repaired 2026-08-29. okhttp moved to Kotlin Multiplatform source sets, so
# `okhttp/src/main/` holds only resources. The JVM/Android sources the old
# paths named are now under jvmMain/ and commonJvmAndroid/.
scan_paths = ["okhttp/src/jvmMain/kotlin/", "okhttp/src/commonJvmAndroid/kotlin/"]
exclude_paths = ["mockwebserver/", "okhttp/src/test/"]
expected_languages = ["kotlin", "java"]
