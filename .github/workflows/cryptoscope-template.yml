# ┌─────────────────────────────────────────────────────────────────────────┐
# │  cryptoscope GitHub Actions template                                    │
# │                                                                         │
# │  QUICK START (3 steps):                                                 │
# │    1. Copy this file to YOUR repo at .github/workflows/cryptoscope.yml  │
# │    2. Commit and push to any branch                                     │
# │    3. Done — cryptoscope runs on every push and PR                      │
# │                                                                         │
# │  No account, no signup, no API token required.                          │
# │  GITHUB_TOKEN is auto-provided by GitHub Actions.                       │
# └─────────────────────────────────────────────────────────────────────────┘
#
# CONFIG KNOBS — search for the ✎ marker to find every tunable setting.
#
# All knobs can also be set via repository/organisation variables
# (Settings → Secrets and variables → Actions → Variables) so you don't
# have to edit this file per-repo.

name: cryptoscope scan

# ✎ TRIGGERS
# Add or remove events to control when the scan fires.
# workflow_dispatch lets you trigger it manually from the Actions UI.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Minimal permission set — do not widen these unless you have a specific need.
permissions:
  contents: read          # checkout
  security-events: write  # upload SARIF to Code Scanning
  pull-requests: write    # post / update PR summary comment

# ✎ GLOBAL SETTINGS
env:
  # Where cryptoscope writes its output files.
  # Change this if your repo layout requires a different path.
  REPORTS_DIR: reports

  # ✎ SCAN TARGET
  # The path cryptoscope scans.  "." means the whole repository.
  # Narrow this to a sub-directory if you only care about part of the repo,
  # e.g. SCAN_TARGET: src/crypto
  SCAN_TARGET: .

  # ✎ CRYPTOSCOPE VERSION / SOURCE
  # Uncomment ONE of the two install strategies below.
  # Option A (crates.io, default once published):  cargo install cryptoscope
  # Option B (git HEAD):
  #   cargo install --git https://github.com/<TBD>/cryptoscope crates/cli
  #
  # The workflow uses Option A when CRYPTOSCOPE_INSTALL_CMD is set here,
  # otherwise it falls through to the local-path build in the install step.
  # CRYPTOSCOPE_INSTALL_CMD: "cargo install cryptoscope --locked"

jobs:
  scan:
    name: cryptoscope scan
    # ✎ RUNNER — change to macos-latest or self-hosted if needed.
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      #
      # fetch-depth: 0 gives full history, which lets cryptoscope correlate
      # findings with their introducing commit.
      # ✎ Set fetch-depth: 1 if you don't need blame / history correlation.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Install Rust ───────────────────────────────────────────────────────
      #
      # Only needed when building cryptoscope from source.
      # ✎ Remove this step once pre-built binaries are available and you're
      #   using the curl-install approach from scripts/install.sh.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # ── Cargo cache ────────────────────────────────────────────────────────
      #
      # Caches ~/.cargo/registry and the target/ directory.
      # Saves ~3-4 minutes on repeat runs in the same repo.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # ── Install cryptoscope ────────────────────────────────────────────────
      #
      # ✎ SWAP STRATEGY:
      #   Pre-release (building from local path — remove once on crates.io):
      #     cargo install --path cryptoscope/crates/cli --locked
      #   From crates.io (swap to this when the crate is published):
      #     cargo install cryptoscope --locked
      #   From git (useful for pinning to a specific commit):
      #     cargo install --git https://github.com/<TBD>/cryptoscope --locked
      - name: Install cryptoscope
        run: |
          # Remove this block and uncomment one of the alternatives above
          # once cryptoscope is published to crates.io.
          cargo install --path cryptoscope/crates/cli --locked

      # ── Create output directory ────────────────────────────────────────────
      - name: Create reports directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      # ── Run cryptoscope ────────────────────────────────────────────────────
      #
      # ✎ OUTPUT FORMATS — comment out lines for formats you don't need.
      #   --sarif        SARIF 2.1.0 for GitHub Code Scanning
      #   --html         Human-readable HTML report
      #   --cbom         CycloneDX 1.7 Cryptography BOM (JSON)
      #   --summary-json Machine-readable JSON summary (used by PR comment step)
      #
      # ✎ CONFIG FILE — if your repo has a .cryptoscope.toml, cryptoscope
      #   picks it up automatically.  You can point to a different path with:
      #     --config path/to/.cryptoscope.toml
      #
      # ✎ EXIT CODE — by default cryptoscope exits 0 even when findings exist
      #   (so the workflow still uploads SARIF and artifacts).
      #   To fail the workflow on critical findings, add: --fail-on critical
      - name: Run cryptoscope scan
        run: >
          cryptoscope scan ${{ env.SCAN_TARGET }}
          --sarif        ${{ env.REPORTS_DIR }}/cryptoscope.sarif
          --html         ${{ env.REPORTS_DIR }}/cryptoscope.html
          --cbom         ${{ env.REPORTS_DIR }}/cryptoscope.cbom.json
          --summary-json ${{ env.REPORTS_DIR }}/cryptoscope.summary.json

      # ── Post / update PR summary comment ──────────────────────────────────
      #
      # Posts a single comment summarising the findings.
      # On re-runs the SAME comment is updated (idempotent — no comment spam).
      # ✎ Remove this step if you don't want PR comments.
      - name: Post PR summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = `${process.env.REPORTS_DIR}/cryptoscope.summary.json`;

            if (!fs.existsSync(summaryPath)) {
              core.warning('cryptoscope summary JSON not found — skipping PR comment');
              return;
            }

            const summary  = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const critical = summary.findings_by_severity?.critical ?? 0;
            const high     = summary.findings_by_severity?.high     ?? 0;
            const medium   = summary.findings_by_severity?.medium   ?? 0;
            const low      = summary.findings_by_severity?.low      ?? 0;
            const total    = summary.total_findings ?? (critical + high + medium + low);

            const statusIcon = critical > 0 ? '🔴' : high > 0 ? '🟠' : total > 0 ? '🟡' : '🟢';

            const body = [
              `<!-- cryptoscope-scan-comment -->`,
              `## ${statusIcon} cryptoscope scan results`,
              ``,
              `| Severity | Count |`,
              `|----------|-------|`,
              `| Critical | ${critical} |`,
              `| High     | ${high}     |`,
              `| Medium   | ${medium}   |`,
              `| Low      | ${low}      |`,
              `| **Total** | **${total}** |`,
              ``,
              `<details>`,
              `<summary>Full JSON summary</summary>`,
              ``,
              '```json',
              JSON.stringify(summary, null, 2),
              '```',
              `</details>`,
              ``,
              `_[Download full HTML report & CBOM from workflow artifacts.](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            // Idempotent: update the existing comment if one exists, else create.
            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('<!-- cryptoscope-scan-comment -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          REPORTS_DIR: ${{ env.REPORTS_DIR }}

      # ── Upload SARIF to GitHub Code Scanning ──────────────────────────────
      #
      # Results appear in Security → Code scanning alerts.
      # This step runs even when cryptoscope finds nothing (if: always()).
      # ✎ Remove this step if your plan/repo type doesn't support Code Scanning.
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.REPORTS_DIR }}/cryptoscope.sarif
          # ✎ CATEGORY — change if you run multiple scanners and want separate
          #   categories in the Code Scanning UI.
          category: cryptoscope

      # ── Upload HTML report as a build artifact ────────────────────────────
      #
      # ✎ RETENTION — adjust retention-days to control how long the artifact
      #   is kept (max 90 days on GitHub; default here is 30).
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoscope-html-report
          path: ${{ env.REPORTS_DIR }}/cryptoscope.html
          retention-days: 30

      # ── Upload CycloneDX CBOM as a build artifact ─────────────────────────
      - name: Upload CycloneDX CBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoscope-cbom
          path: ${{ env.REPORTS_DIR }}/cryptoscope.cbom.json
          retention-days: 30
