# quipuu.yml — Reusable cryptographic hygiene scan for this repo
#
# HOW TO WIRE THIS INTO A DOWNSTREAM REPO:
#   1. Copy `.github/workflows/quipuu-template.yml` from the quipuu
#      repo into your repo's `.github/workflows/` directory.
#   2. Commit and push — quipuu runs on every push and pull request.
#   3. View findings in the "Security" → "Code scanning" tab of your repo.
#
# No accounts, no tokens, no signup required beyond the auto-provided GITHUB_TOKEN.

name: quipuu scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required for upload-sarif
  pull-requests: write     # required to post / update the PR summary comment

jobs:
  scan:
    name: quipuu scan
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Install Rust (needed to build quipuu from source) ──────────
      #
      # Using dtolnay/rust-toolchain for a reproducible, cache-friendly install.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # ── 3. Cargo cache — avoids a full recompile on every run ─────────────
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "quipuu -> target"

      # ── 4. Install quipuu ─────────────────────────────────────────────
      #
      # Install from the local workspace path.
      # SWAP TO CRATES.IO: replace the line below with:
      #   run: cargo install quipuu --locked
      - name: Install quipuu
        run: cargo install --path quipuu/crates/cli --locked

      # ── 5. Create the output directory ────────────────────────────────────
      - name: Create reports directory
        run: mkdir -p reports

      # ── 6. Run quipuu ─────────────────────────────────────────────────
      #
      # Produces four output formats:
      #   SARIF      → uploaded to GitHub Code Scanning
      #   HTML       → downloadable artifact
      #   CycloneDX  → downloadable artifact (CBOM)
      #   JSON       → read by the PR comment step
      - name: Run quipuu scan
        run: >
          quipuu scan .
          --sarif   reports/quipuu.sarif
          --html    reports/quipuu.html
          --cbom    reports/quipuu.cbom.json
          --summary-json reports/quipuu.summary.json

      # ── 7. Post / update a PR summary comment ─────────────────────────────
      #
      # Reads reports/quipuu.summary.json and posts a single collapsible
      # comment on the PR.  Uses find-or-create semantics so re-runs update
      # the same comment rather than spamming new ones.
      - name: Post PR summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const summaryPath = 'reports/quipuu.summary.json';
            if (!fs.existsSync(summaryPath)) {
              core.warning('quipuu summary JSON not found — skipping PR comment');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));

            // Build a human-readable table from the summary.
            const critical = summary.findings_by_severity?.critical ?? 0;
            const high     = summary.findings_by_severity?.high     ?? 0;
            const medium   = summary.findings_by_severity?.medium   ?? 0;
            const low      = summary.findings_by_severity?.low      ?? 0;
            const total    = summary.total_findings ?? (critical + high + medium + low);

            const statusIcon = critical > 0 ? '🔴' : high > 0 ? '🟠' : total > 0 ? '🟡' : '🟢';

            const body = [
              `<!-- quipuu-scan-comment -->`,
              `## ${statusIcon} quipuu scan results`,
              ``,
              `| Severity | Count |`,
              `|----------|-------|`,
              `| Critical | ${critical} |`,
              `| High     | ${high}     |`,
              `| Medium   | ${medium}   |`,
              `| Low      | ${low}      |`,
              `| **Total** | **${total}** |`,
              ``,
              `<details>`,
              `<summary>Details</summary>`,
              ``,
              '```json',
              JSON.stringify(summary, null, 2),
              '```',
              `</details>`,
              ``,
              `_Full report available as a [workflow artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})._`,
            ].join('\n');

            // Find an existing quipuu comment on this PR (idempotent update).
            const { data: comments } = await github.rest.issues.listComments({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('<!-- quipuu-scan-comment -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── 8. Upload SARIF to GitHub Code Scanning ────────────────────────────
      #
      # Results appear in Security → Code scanning alerts.
      # upload-sarif is a no-op when SARIF upload is disabled on the repo
      # (e.g. private repos on free plans) — it will not fail the workflow.
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/quipuu.sarif
          category: quipuu

      # ── 9. Upload HTML report + CBOM as build artifacts ──────────────────
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quipuu-html-report
          path: reports/quipuu.html
          retention-days: 30

      - name: Upload CycloneDX CBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quipuu-cbom
          path: reports/quipuu.cbom.json
          retention-days: 30
