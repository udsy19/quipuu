when.args.member = { regex = "^ES512$" }
algorithm_id = "ecdsa-p521"
severity_hint = "auto"
message = "nimbus JWSAlgorithm.ES512 — ECDSA P-521 signature, quantum-vulnerable."

# HMAC variants — split per-hash so the algorithm_id matches the variant.
[[classify]]
id = "CRYPTO-252"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^HS256$" }
algorithm_id = "sha-256"
severity_hint = "low"
message = "nimbus JWSAlgorithm.HS256 (HMAC-SHA256). Symmetric; confirm key entropy."

[[classify]]
id = "CRYPTO-255"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^HS384$" }
algorithm_id = "sha-384"
severity_hint = "low"
message = "nimbus JWSAlgorithm.HS384 (HMAC-SHA384). Symmetric; confirm key entropy."

[[classify]]
