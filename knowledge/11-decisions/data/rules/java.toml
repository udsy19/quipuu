when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^ES256K?$" }
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "nimbus JWSAlgorithm.{member} — ECDSA P-256 signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-257"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^ES384$" }
algorithm_id = "ecdsa-p384"
severity_hint = "auto"
