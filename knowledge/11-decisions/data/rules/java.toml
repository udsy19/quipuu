when.api = "^com\\.nimbusds\\.jose\\.JWEAlgorithm$"
when.args.member = { regex = "^RSA1_5$" }
algorithm_id = "rsa-2048"
severity_hint = "auto"
message = "nimbus JWEAlgorithm.RSA1_5 — RSA-PKCS1-v1.5 key wrapping (legacy; consider RSA-OAEP-256). Quantum-vulnerable."

# ---------- jose4j (org.jose4j.jws.AlgorithmIdentifiers) ----------
