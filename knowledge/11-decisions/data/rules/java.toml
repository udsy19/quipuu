# Java detection rules — two-layer (extract → classify), per D-07
#
# Covers: javax.crypto.Cipher.getInstance, java.security.KeyPairGenerator,
#         java.security.MessageDigest, org.bouncycastle.* (BC).
#
# Extract IDs: JAV-NNN
# Classify IDs: CRYPTO-200..299

# ============================================================================
# javax.crypto.Cipher.getInstance — string-driven cipher selection
# ============================================================================

[[extract]]
id = "JAV-001"
language = "java"
query = """
(method_invocation
  object: (identifier) @cls (#eq? @cls "Cipher")
  name: (identifier) @fn (#eq? @fn "getInstance")
  arguments: (argument_list (string_literal) @spec))
"""
captures = { cls = "ident", fn = "ident", spec = "literal_string" }
api = "javax.crypto.Cipher.getInstance"
description = "Java Cipher.getInstance(spec) — cipher/mode/padding string literal."

[[classify]]
id = "CRYPTO-200"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)DES" }
algorithm_id = "des"
severity_hint = "critical"
message = "DES/3DES detected in Cipher.getInstance('{spec}'). Disallowed for new encryption (NIST SP 800-131A)."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-201"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES.*/ECB" }
algorithm_id = "aes-128-ecb"
severity_hint = "high"
message = "AES-ECB mode in Cipher.getInstance('{spec}'). ECB is deterministic and leaks patterns."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-202"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)RSA.*PKCS1Padding" }
algorithm_id = "rsa-pkcs1-sha256-2048"
severity_hint = "high"
message = "RSA PKCS1v1.5 padding in Cipher.getInstance('{spec}'). Vulnerable to Bleichenbacher attacks; use OAEP."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-203"
when.api = "^javax\\.crypto\\.Cipher\\.getInstance$"
when.args.spec = { regex = "(?i)AES.*/GCM" }
algorithm_id = "aes-256-gcm"
severity_hint = "auto"
message = "AES-GCM in Cipher.getInstance('{spec}'). Good AEAD choice; confirm 256-bit key."

# ============================================================================
# java.security.KeyPairGenerator.getInstance
# ============================================================================

[[extract]]
id = "JAV-010"
language = "java"
query = """
(method_invocation
  object: (identifier) @cls (#eq? @cls "KeyPairGenerator")
  name: (identifier) @fn (#eq? @fn "getInstance")
  arguments: (argument_list (string_literal) @algo))
"""
captures = { cls = "ident", fn = "ident", algo = "literal_string" }
api = "java.security.KeyPairGenerator.getInstance"
description = "Java KeyPairGenerator.getInstance(algo) — asymmetric keypair generation."

[[classify]]
id = "CRYPTO-210"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?RSA\"?$" }
algorithm_id = "rsa-2048"
severity_hint = "auto"
message = "RSA keypair generator. Quantum-vulnerable: NIST IR 8547 deprecates after 2030."

[[classify]]
id = "CRYPTO-211"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?EC\"?$" }
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
# Curve is determined by the subsequent .initialize(ECGenParameterSpec)
# call; we can't see that statement from this matcher. Default to
# ecdsa-p256 as the most common curve; auditors should check the
# initialize() call for secp256k1 / P-384 / P-521 variants which
# would change the algorithm_id (and for secp256k1, the threat model).
message = "EC keypair generator — curve determined at .initialize(ECGenParameterSpec(...)); default ECDSA-P256. Quantum-vulnerable. Replace with ML-DSA-65."

[[classify]]
id = "CRYPTO-212"
when.api = "^java\\.security\\.KeyPairGenerator\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?DSA\"?$" }
algorithm_id = "dsa-2048"
severity_hint = "high"
message = "DSA keypair generator. Deprecated for new use (FIPS 186-5)."

# ============================================================================
# java.security.MessageDigest.getInstance
# ============================================================================

[[extract]]
id = "JAV-020"
language = "java"
query = """
(method_invocation
  object: (identifier) @cls (#eq? @cls "MessageDigest")
  name: (identifier) @fn (#eq? @fn "getInstance")
  arguments: (argument_list (string_literal) @algo))
"""
captures = { cls = "ident", fn = "ident", algo = "literal_string" }
api = "java.security.MessageDigest.getInstance"
description = "Java MessageDigest.getInstance(algo) — hash algorithm selection."

[[classify]]
id = "CRYPTO-220"
when.api = "^java\\.security\\.MessageDigest\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?MD5\"?$" }
algorithm_id = "md5"
severity_hint = "critical"
message = "MD5 hash in MessageDigest.getInstance('{algo}'). Classically broken (collisions since 2004)."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-221"
when.api = "^java\\.security\\.MessageDigest\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SHA-?1\"?$" }
algorithm_id = "sha-1"
severity_hint = "critical"
message = "SHA-1 hash in MessageDigest.getInstance('{algo}'). Classically broken (SHAttered, 2017)."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-222"
when.api = "^java\\.security\\.MessageDigest\\.getInstance$"
when.args.algo = { regex = "(?i)^\"?SHA-?256\"?$" }
algorithm_id = "sha-256"
severity_hint = "auto"
message = "SHA-256 hash in MessageDigest.getInstance('{algo}'). Quantum-safe for hashing."

# ============================================================================
# org.bouncycastle — BC provider detection
# ============================================================================

[[extract]]
id = "JAV-030"
language = "java"
query = """
(object_creation_expression
  type: (type_identifier) @cls (#match? @cls "^(RSAKeyPairGenerator|AESEngine|GCMBlockCipher|BouncyCastleProvider)$"))
"""
captures = { cls = "ident" }
api = "org.bouncycastle.{cls}"
description = "BouncyCastle crypto class instantiation."

[[classify]]
id = "CRYPTO-230"
when.api = "^org\\.bouncycastle\\.RSAKeyPairGenerator$"
algorithm_id = "rsa-2048"
severity_hint = "auto"
message = "BouncyCastle RSAKeyPairGenerator instantiated. Quantum-vulnerable RSA."

[[classify]]
id = "CRYPTO-231"
when.api = "^org\\.bouncycastle\\.AESEngine$"
algorithm_id = "aes-256-gcm"
severity_hint = "auto"
message = "BouncyCastle AESEngine instantiated. Confirm key size and authenticated mode (GCM)."

[[classify]]
id = "CRYPTO-232"
when.api = "^org\\.bouncycastle\\.GCMBlockCipher$"
algorithm_id = "aes-256-gcm"
severity_hint = "auto"
message = "BouncyCastle GCMBlockCipher instantiated. Good AEAD mode."

[[classify]]
id = "CRYPTO-233"
when.api = "^org\\.bouncycastle\\.BouncyCastleProvider$"
algorithm_id = "aes-256-gcm"
severity_hint = "low"
message = "BouncyCastle provider registered. Inventory all BC API usages."

# ============================================================================
# Java JWT-library enum constants (jjwt, java-jwt, nimbus-jose-jwt, jose4j)
# Detected as field_access nodes: `SignatureAlgorithm.RS256` etc.
# These are CRITICAL — without them the scanner produces zero findings on
# any Java codebase using a modern JWT library. See V2 corpus run for jjwt
# (silent zero findings before this fix).
# ============================================================================

# ---------- jjwt (io.jsonwebtoken.SignatureAlgorithm) ----------
[[classify]]
id = "CRYPTO-240"
when.api = "^io\\.jsonwebtoken\\.SignatureAlgorithm$"
when.args.member = { regex = "^(NONE|none)$" }
algorithm_id = "jwt-alg-none"
severity_hint = "critical"
message = "jjwt SignatureAlgorithm.NONE — signature verification disabled (CVE-2015-9235 class)."
cwe = "CWE-347"

# HMAC variants — split per-hash so the algorithm_id matches the variant
# (Phase 15 fix; pre-fix all three routed to sha-256, breaking HS384/HS512).
[[classify]]
id = "CRYPTO-241"
when.api = "^io\\.jsonwebtoken\\.SignatureAlgorithm$"
when.args.member = { regex = "^HS256$" }
algorithm_id = "sha-256"
severity_hint = "low"
message = "jjwt SignatureAlgorithm.HS256 (HMAC-SHA256). Symmetric; confirm signing key entropy."

[[classify]]
id = "CRYPTO-245"
when.api = "^io\\.jsonwebtoken\\.SignatureAlgorithm$"
when.args.member = { regex = "^HS384$" }
algorithm_id = "sha-384"
severity_hint = "low"
message = "jjwt SignatureAlgorithm.HS384 (HMAC-SHA384). Symmetric; confirm signing key entropy."

[[classify]]
id = "CRYPTO-246"
when.api = "^io\\.jsonwebtoken\\.SignatureAlgorithm$"
when.args.member = { regex = "^HS512$" }
algorithm_id = "sha-512"
severity_hint = "low"
message = "jjwt SignatureAlgorithm.HS512 (HMAC-SHA512). Symmetric; confirm signing key entropy."

[[classify]]
id = "CRYPTO-242"
when.api = "^io\\.jsonwebtoken\\.SignatureAlgorithm$"
when.args.member = { regex = "^RS(256|384|512)$" }
algorithm_id = "rsa-pkcs1-sha256-2048"
severity_hint = "auto"
message = "jjwt SignatureAlgorithm.{member} — RSA-PKCS1 signature, quantum-vulnerable. Replace with ML-DSA."

[[classify]]
id = "CRYPTO-243"
when.api = "^io\\.jsonwebtoken\\.SignatureAlgorithm$"
when.args.member = { regex = "^PS(256|384|512)$" }
algorithm_id = "rsa-pss-sha256-2048"
severity_hint = "auto"
message = "jjwt SignatureAlgorithm.{member} — RSA-PSS signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-244"
when.api = "^io\\.jsonwebtoken\\.SignatureAlgorithm$"
when.args.member = { regex = "^ES(256|384|512)$" }
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "jjwt SignatureAlgorithm.{member} — ECDSA signature, quantum-vulnerable."

# ---------- auth0 java-jwt (com.auth0.jwt.algorithms.Algorithm) ----------
# auth0 uses Algorithm.RSA256(...), Algorithm.HMAC256(...) — these are static
# method calls, handled by method_invocation path. But Algorithm.none() is
# a method too, so the field-access path doesn't fire on auth0. Left here
# for future static-method classify rules.

# ---------- nimbus-jose-jwt (com.nimbusds.jose.JWSAlgorithm) ----------
# RS / PS variants — split per-hash so the algorithm_id reflects both the
# padding scheme (PKCS1 vs PSS) and the hash width (Phase 15 fix; pre-fix
# all six variants routed to rsa-pkcs1-sha256-2048).
[[classify]]
id = "CRYPTO-250"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^RS256$" }
algorithm_id = "rsa-pkcs1-sha256-2048"
severity_hint = "auto"
message = "nimbus JWSAlgorithm.RS256 — RSA-PKCS1-SHA256 signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-259"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^RS384$" }
algorithm_id = "rsa-pkcs1-sha384-3072"
severity_hint = "auto"
message = "nimbus JWSAlgorithm.RS384 — RSA-PKCS1-SHA384 signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-280"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^RS512$" }
algorithm_id = "rsa-pkcs1-sha512-4096"
severity_hint = "auto"
message = "nimbus JWSAlgorithm.RS512 — RSA-PKCS1-SHA512 signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-281"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^PS256$" }
algorithm_id = "rsa-pss-sha256-2048"
severity_hint = "auto"
message = "nimbus JWSAlgorithm.PS256 — RSA-PSS-SHA256 signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-282"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^PS384$" }
algorithm_id = "rsa-pss-sha384-3072"
severity_hint = "auto"
message = "nimbus JWSAlgorithm.PS384 — RSA-PSS-SHA384 signature, quantum-vulnerable."

[[classify]]
id = "CRYPTO-283"
when.api = "^com\\.nimbusds\\.jose\\.JWSAlgorithm$"
when.args.member = { regex = "^PS512$" }
algorithm_id = "rsa-pss-sha512-4096"
severity_hint = "auto"
message = "nimbus JWSAlgorithm.PS512 — RSA-PSS-SHA512 signature, quantum-vulnerable."

# ECDSA variants — split per-curve so the algorithm_id matches.
[[classify]]
