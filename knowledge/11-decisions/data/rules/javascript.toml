# JavaScript / TypeScript detection rules — two-layer (extract → classify), per D-07
#
# One file covers both .js and .ts files.  For .js we use tree-sitter-javascript;
# for .ts we use tree-sitter-typescript (TypeScript grammar extends the JS grammar
# so node shapes are identical for runtime crypto calls).
#
# Covers: node:crypto (createCipheriv, createHash, generateKeyPair, createSign),
#         WebCrypto (subtle.generateKey, subtle.sign), jsonwebtoken.
#
# Extract IDs: JST-NNN
# Classify IDs: CRYPTO-300..399

# ============================================================================
# node:crypto — createCipheriv
# ============================================================================

[[extract]]
id = "JST-001"
language = "javascript"
query = """
(call_expression
  function: (member_expression
    object: (identifier) @mod
    property: (property_identifier) @fn (#eq? @fn "createCipheriv"))
  arguments: (arguments (string) @algo))
"""
captures = { mod = "ident", fn = "ident", algo = "literal_string" }
api = "node:crypto.createCipheriv"
description = "node:crypto createCipheriv(algorithm, key, iv) — cipher algorithm string."

[[classify]]
id = "CRYPTO-300"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)des" }
algorithm_id = "des"
severity_hint = "critical"
message = "DES/3DES in createCipheriv('{algo}'). Disallowed for new use."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-301"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)rc4" }
algorithm_id = "rc4"
severity_hint = "critical"
message = "RC4 in createCipheriv('{algo}'). Classically broken."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-302"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-.*-gcm" }
algorithm_id = "aes-256-gcm"
severity_hint = "auto"
message = "AES-GCM in createCipheriv('{algo}'). Good AEAD mode."

[[classify]]
id = "CRYPTO-303"
when.api = "^node:crypto\\.createCipheriv$"
when.args.algo = { regex = "(?i)aes-.*-ecb" }
algorithm_id = "aes-128-ecb"
severity_hint = "high"
message = "AES-ECB in createCipheriv('{algo}'). Deterministic mode leaks patterns."
cwe = "CWE-327"

# ============================================================================
# node:crypto — createHash
# ============================================================================

[[extract]]
id = "JST-010"
language = "javascript"
query = """
(call_expression
  function: (member_expression
    object: (identifier) @mod
    property: (property_identifier) @fn (#eq? @fn "createHash"))
  arguments: (arguments (string) @algo))
"""
captures = { mod = "ident", fn = "ident", algo = "literal_string" }
api = "node:crypto.createHash"
description = "node:crypto createHash(algorithm) — hash algorithm string."

[[classify]]
id = "CRYPTO-310"
when.api = "^node:crypto\\.createHash$"
when.args.algo = { regex = "(?i)^['\"]?md5['\"]?$" }
algorithm_id = "md5"
severity_hint = "critical"
message = "MD5 in createHash('{algo}'). Classically broken."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-311"
when.api = "^node:crypto\\.createHash$"
when.args.algo = { regex = "(?i)^['\"]?sha1['\"]?$" }
algorithm_id = "sha-1"
severity_hint = "critical"
message = "SHA-1 in createHash('{algo}'). Classically broken (SHAttered, 2017)."
cwe = "CWE-327"

[[classify]]
id = "CRYPTO-312"
when.api = "^node:crypto\\.createHash$"
when.args.algo = { regex = "(?i)^['\"]?sha256['\"]?$" }
algorithm_id = "sha-256"
severity_hint = "auto"
message = "SHA-256 in createHash('{algo}'). Quantum-safe hash."

# ============================================================================
