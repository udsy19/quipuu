# ============================================================================
# jsonwebtoken — jwt.sign
# ============================================================================

[[extract]]
id = "JST-060"
language = "javascript"
query = """
(call_expression
  function: (member_expression
    object: (identifier) @jwt (#eq? @jwt "jwt")
    property: (property_identifier) @fn (#eq? @fn "sign")))
"""
captures = { jwt = "ident", fn = "ident" }
api = "jsonwebtoken.jwt.sign"
description = "jsonwebtoken jwt.sign(payload, secret, {algorithm: ...})."

[[classify]]
id = "CRYPTO-360"
when.api = "^jsonwebtoken\\.jwt\\.sign$"
algorithm_id = "rsa-pkcs1-sha256-2048"
severity_hint = "auto"
message = "jsonwebtoken jwt.sign() called. Confirm algorithm option and quantum exposure of signing key."

# ============================================================================
# crypto-js — pure-JS crypto library used by ~12M downloads/week.
# Two-level member-expression callees are matched in match_js_callee()
# (scanner.rs) and routed to the classify rules below.
# Every algorithm here is on the BrokenClassically tier.
# ============================================================================

[[classify]]
id = "CRYPTO-370"
when.api = "^crypto-js\\.AES\\.encrypt$"
algorithm_id = "aes-256-gcm"
severity_hint = "auto"
message = "crypto-js AES used. The CryptoJS.AES helper defaults to CBC mode with PKCS#7 padding; confirm key size and mode against project requirements. Inventory for CBOM."

[[classify]]
id = "CRYPTO-371"
when.api = "^crypto-js\\.DES\\.encrypt$"
algorithm_id = "des"
severity_hint = "critical"
message = "crypto-js DES (56-bit key) — classically broken. Replace with AES-256-GCM."

[[classify]]
id = "CRYPTO-372"
when.api = "^crypto-js\\.TripleDES\\.encrypt$"
algorithm_id = "3des"
severity_hint = "critical"
message = "crypto-js TripleDES — Sweet32 attack practical; NIST SP 800-131A disallowed after 2023."

[[classify]]
id = "CRYPTO-373"
when.api = "^crypto-js\\.RC4\\.encrypt$"
algorithm_id = "rc4"
severity_hint = "critical"
message = "crypto-js RC4 — classically broken (RFC 7465 PROHIBITS in TLS). Replace immediately."

[[classify]]
id = "CRYPTO-374"
when.api = "^crypto-js\\.MD5$"
algorithm_id = "md5"
severity_hint = "critical"
message = "crypto-js MD5 — classically broken (collision attacks since 2004). Use SHA-256."

[[classify]]
id = "CRYPTO-375"
when.api = "^crypto-js\\.SHA1$"
algorithm_id = "sha-1"
severity_hint = "critical"
message = "crypto-js SHA-1 — classically broken (SHAttered, 2017). Use SHA-256."

[[classify]]
id = "CRYPTO-376"
when.api = "^crypto-js\\.HmacMD5$"
algorithm_id = "md5"
severity_hint = "high"
message = "crypto-js HMAC-MD5 — HMAC mitigates MD5 collision attacks but the construct is deprecated; prefer HMAC-SHA-256."

[[classify]]
id = "CRYPTO-377"
when.api = "^crypto-js\\.HmacSHA1$"
algorithm_id = "sha-1"
severity_hint = "high"
message = "crypto-js HMAC-SHA1 — HMAC mitigates SHA-1 collision attacks but the construct is deprecated; prefer HMAC-SHA-256."
