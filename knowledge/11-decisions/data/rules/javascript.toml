# ============================================================================
# WebCrypto — subtle.generateKey
# ============================================================================

[[extract]]
id = "JST-040"
language = "javascript"
query = """
(call_expression
  function: (member_expression
    object: (identifier) @subtle (#eq? @subtle "subtle")
    property: (property_identifier) @fn (#eq? @fn "generateKey")))
"""
captures = { subtle = "ident", fn = "ident" }
api = "webcrypto.subtle.generateKey"
description = "WebCrypto subtle.generateKey({name, ...}, extractable, usages)."

[[classify]]
id = "CRYPTO-340"
when.api = "^webcrypto\\.subtle\\.generateKey$"
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "WebCrypto subtle.generateKey() called. Verify algorithm object name and key parameters."

