# Rust detection rules — two-layer (extract → classify), per D-07
#
# Covers: ring crate APIs, RustCrypto type-path matches (Aes256Gcm, Sha256,
#         ChaCha20Poly1305, rsa::RsaPrivateKey, ed25519_dalek::SigningKey),
#         rustls::ClientConfig.
#
# Rust note: RustCrypto encodes algorithm + key-size in type names (Aes256Gcm,
#   Sha256). The callee text captures the full path (e.g. "Aes256Gcm::new")
#   which lets us derive the algorithm without arg parsing.
#
# Extract IDs: RST-NNN
# Classify IDs: CRYPTO-500..599

# ============================================================================
# ring — EcdsaKeyPair::generate_pkcs8
# ============================================================================

[[extract]]
id = "RST-001"
language = "rust"
query = """
(call_expression
  function: (scoped_identifier
    path: (identifier) @cls (#eq? @cls "EcdsaKeyPair")
    name: (identifier) @fn (#eq? @fn "generate_pkcs8")))
"""
captures = { cls = "ident", fn = "ident" }
api = "ring.EcdsaKeyPair.generate_pkcs8"
description = "ring::signature::EcdsaKeyPair::generate_pkcs8 — ECDSA keypair."

[[classify]]
id = "CRYPTO-500"
when.api = "^ring\\.EcdsaKeyPair\\.generate_pkcs8$"
algorithm_id = "ecdsa-p256"
severity_hint = "auto"
message = "ring EcdsaKeyPair::generate_pkcs8 — ECDSA key, quantum-vulnerable. Replace with ML-DSA-65."

