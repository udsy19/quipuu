# ============================================================================
# RandomNumberGenerator.Create() / .GetBytes()
# ============================================================================

[[extract]]
id = "CSH-030"
language = "csharp"
query = """
(invocation_expression
  function: (member_access_expression
    expression: (identifier) @cls (#eq? @cls "RandomNumberGenerator")
    name: (identifier) @fn (#match? @fn "^(Create|GetBytes|Fill)$")))
"""
captures = { cls = "ident", fn = "ident" }
api = "System.Security.Cryptography.RandomNumberGenerator.Create"
description = "RandomNumberGenerator.Create/GetBytes/Fill — CSPRNG usage."

[[classify]]
id = "CRYPTO-650"
when.api = "^System\\.Security\\.Cryptography\\.RandomNumberGenerator\\.Create$"
algorithm_id = "csprng"
severity_hint = "low"
message = "RandomNumberGenerator.Create() called. A CSPRNG, not a cipher — recorded so the CBOM shows where key and IV material originates. Verify the key/IV lengths requested by the caller meet policy."

# ============================================================================
# RijndaelManaged (deprecated in .NET 6+, disallowed in FIPS mode)
# ============================================================================

[[extract]]
id = "CSH-040"
language = "csharp"
query = """
(object_creation_expression
  type: (identifier) @cls (#eq? @cls "RijndaelManaged"))
"""
captures = { cls = "ident" }
api = "System.Security.Cryptography.RijndaelManaged.new"
description = "new RijndaelManaged() — deprecated managed AES/Rijndael class."

[[classify]]
id = "CRYPTO-660"
when.api = "^System\\.Security\\.Cryptography\\.RijndaelManaged\\.new$"
algorithm_id = "aes-unattributed"
severity_hint = "high"
message = "new RijndaelManaged() — deprecated in .NET 6+; disallowed in FIPS mode. Key size and mode come from the properties set afterwards, not from this call. Use AesGcm instead."
cwe = "CWE-327"
